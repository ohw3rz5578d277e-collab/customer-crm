name: Read-only customer 26199690 probe

on:
  push:
    branches:
      - agent/read-only-customer-26199690-probe
    paths:
      - '.github/workflows/read-only-customer-26199690-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact customer_id lookup (READ ONLY)
        id: exact
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            d1 execute customer-crm-db --remote --command "SELECT customer_id, name, quote(CAST(customer_id AS TEXT)) AS id_text FROM customers WHERE CAST(customer_id AS TEXT)='26199690' AND COALESCE(deleted_at,'')='' LIMIT 5;" --json
      - name: Trim/prefix diagnostic lookup (READ ONLY)
        id: diagnostic
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            d1 execute customer-crm-db --remote --command "SELECT customer_id, name, quote(CAST(customer_id AS TEXT)) AS id_text, length(CAST(customer_id AS TEXT)) AS id_length FROM customers WHERE (TRIM(CAST(customer_id AS TEXT))='26199690' OR CAST(customer_id AS TEXT) LIKE '%26199690%') AND COALESCE(deleted_at,'')='' LIMIT 20;" --json
      - name: Reservation to CRM customer_id coverage (READ ONLY)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute reservation-app-db --remote --command "SELECT COUNT(*) AS total_reservations, SUM(CASE WHEN TRIM(COALESCE(CAST(customer_id AS TEXT),''))<>'' THEN 1 ELSE 0 END) AS with_customer_id FROM app_reservations;" --json > /tmp/res-counts.json
          npx --yes wrangler@4 d1 execute reservation-app-db --remote --command "SELECT DISTINCT TRIM(CAST(customer_id AS TEXT)) AS customer_id FROM app_reservations WHERE TRIM(COALESCE(CAST(customer_id AS TEXT),''))<>'';" --json > /tmp/res-ids.json
          npx --yes wrangler@4 d1 execute customer-crm-db --remote --command "SELECT DISTINCT TRIM(CAST(customer_id AS TEXT)) AS customer_id FROM customers WHERE TRIM(COALESCE(CAST(customer_id AS TEXT),''))<>'' AND COALESCE(deleted_at,'')='';" --json > /tmp/crm-ids.json
          node <<'NODE'
          const fs=require('fs');
          const parse=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0]?.results||[];
          const counts=parse('/tmp/res-counts.json')[0]||{};
          const resIds=new Set(parse('/tmp/res-ids.json').map(x=>String(x.customer_id||'').trim()).filter(Boolean));
          const crmIds=new Set(parse('/tmp/crm-ids.json').map(x=>String(x.customer_id||'').trim()).filter(Boolean));
          let matchingDistinct=0;
          for(const id of resIds) if(crmIds.has(id)) matchingDistinct++;
          console.log(JSON.stringify({
            total_reservations:Number(counts.total_reservations||0),
            reservations_with_customer_id:Number(counts.with_customer_id||0),
            distinct_reservation_customer_ids:resIds.size,
            crm_active_customer_ids:crmIds.size,
            matching_distinct_customer_ids:matchingDistinct,
            missing_distinct_customer_ids:resIds.size-matchingDistinct,
            target_26199690_in_reservation:resIds.has('26199690'),
            target_26199690_in_crm:crmIds.has('26199690'),
            rows_written:0
          },null,2));
          NODE
      - name: Print exact read-only result summary
        shell: bash
        env:
          EXACT: ${{ steps.exact.outputs.command-output }}
          DIAGNOSTIC: ${{ steps.diagnostic.outputs.command-output }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const exact=JSON.parse(process.env.EXACT||'[]')[0]?.results||[];
          const diagnostic=JSON.parse(process.env.DIAGNOSTIC||'[]')[0]?.results||[];
          console.log(JSON.stringify({exact_rows:exact.length,diagnostic_rows:diagnostic.length,rows_written:0},null,2));
          console.log('READ_ONLY=PASS');
          NODE
