name: Customer360 search filter UIX

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/crm-customer360-*.mjs'
      - 'src/production-index-crm-customer360-entry.js'
      - 'tests/customer360-*.mjs'
      - 'tests/customer-identity-*.mjs'
      - 'tests/crm-canonical-customer-guards.test.mjs'
      - 'tests/customer-production-owner-layout-regression.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/customer360-search-filter-uix.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax privacy and production safety
        shell: bash
        run: |
          set -euo pipefail
          node --check src/crm-customer360-search.mjs
          node --check src/crm-customer360-runtime.mjs
          node --check src/crm-customer360-ui-client.mjs
          node --check src/crm-customer360-ui.mjs
          node --check src/production-index-crm-customer360-entry.js
          ! grep -R -E "(INSERT[[:space:]]+INTO|UPDATE|DELETE[[:space:]]+FROM)[[:space:]]+customers\b" src/crm-customer360-search.mjs src/crm-customer360-runtime.mjs
          ! grep -R -E "LINE_SERVICE.*(send|push|multicast)|api.line.me.*message" src/crm-customer360-search.mjs src/crm-customer360-runtime.mjs src/crm-customer360-ui-client.mjs
          ! grep -R -E "identity-resolver|resolveCustomerIdentity|mergeCustomer" src/crm-customer360-search.mjs
          ! grep -R "CRM_CUSTOMER360_WRITE_ENABLED.*1" wrangler.jsonc
          if git diff --name-only origin/main...HEAD | grep -E '^migrations(_managed)?/'; then echo 'Migration change is forbidden in this task'; exit 1; fi

      - name: Customer360 existing and search regression
        run: |
          node tests/customer360-family-marketing-foundation.mjs
          node tests/customer360-family-marketing-birthday-thresholds.mjs
          node tests/customer360-search-filter-uix.mjs

      - name: Customer identity regression
        run: |
          node tests/customer-identity-resolver.mjs
          node tests/customer-identity-regression.mjs
          node tests/crm-canonical-customer-guards.test.mjs

      - name: Install local browser and build tooling
        run: |
          npm install --no-save playwright@1.55.0 wrangler@4.33.1
          npx playwright install --with-deps chromium

      - name: Customer360 responsive search browser regression
        run: node tests/customer360-family-marketing-browser.mjs

      - name: Preserve Owner desktop hotfix
        run: node tests/customer-production-owner-layout-regression.mjs

      - name: Wrangler dry run only
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: npx wrangler deploy --dry-run --outdir /tmp/customer360-search-dry-run

      - name: Upload Customer360 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer360-search-filter-uix-screenshots
          path: artifacts/customer360-search-filter-uix/
          if-no-files-found: warn
          retention-days: 7
