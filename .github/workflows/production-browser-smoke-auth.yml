name: Production Authenticated Browser Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Customer CRM production browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      BASE_URL: https://customer-crm-api.ohw3rz5578d277e.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secret presence
        shell: bash
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN GitHub Actions secret is missing."
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "CLOUDFLARE_ACCESS_SERVICE_TOKEN_MISSING: register CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET repository Actions secrets."
            exit 1
          fi
          echo "::add-mask::$ADMIN_TOKEN"
          echo "::add-mask::$CF_ACCESS_CLIENT_ID"
          echo "::add-mask::$CF_ACCESS_CLIENT_SECRET"
          echo "Required browser smoke credentials are present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run read-only browser smoke
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          const BASE_URL = process.env.BASE_URL;
          const ADMIN_TOKEN = process.env.ADMIN_TOKEN;
          const CF_ACCESS_CLIENT_ID = process.env.CF_ACCESS_CLIENT_ID;
          const CF_ACCESS_CLIENT_SECRET = process.env.CF_ACCESS_CLIENT_SECRET;
          const REVIEW_PATH = '/admin/customer-id-reconciliation';
          const HEALTH_PATH = '/api/crm-health-check';

          if (!BASE_URL || !ADMIN_TOKEN || !CF_ACCESS_CLIENT_ID || !CF_ACCESS_CLIENT_SECRET) {
            throw new Error('required browser smoke credentials missing');
          }

          const failures = [];
          const pageErrors = [];
          const consoleErrors = [];
          const writes = [];
          const expectedUiByPage = new WeakMap();
          const authHeaders = {
            'x-admin-token': ADMIN_TOKEN,
            'CF-Access-Client-Id': CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret': CF_ACCESS_CLIENT_SECRET
          };

          const writePatterns = [
            /\/api\/customer-id-reconciliation\/reviews\/[^/]+$/,
            /\/api\/customers\/[^/]+\/line-send/,
            /\/api\/customers\/[^/]+\/line-message-logs/,
            /\/api\/line-message-logs\/[^/]+\/mark-sent/,
            /\/api\/sync\/customers\/upsert/,
            /\/api\/reservation-drafts/,
            /\/internal\/line\/push/
          ];

          const knownAccessLoginCsp = text =>
            /Refused to load the image 'data:image\/svg\+xml/i.test(text) &&
            /Content Security Policy/i.test(text);

          function fail(message) { failures.push(message); }
          function watch(page, label) {
            expectedUiByPage.set(page, false);
            page.on('pageerror', err => pageErrors.push(`${label}: ${err.message || String(err)}`));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push({ label, text: msg.text(), page });
            });
            page.on('request', req => {
              const path = new URL(req.url()).pathname;
              if (req.method() !== 'GET' && writePatterns.some(r => r.test(path))) {
                writes.push(`${req.method()} ${path}`);
              }
            });
          }

          async function checkHealth(request) {
            const res = await request.get(BASE_URL + HEALTH_PATH, { headers: authHeaders });
            const status = res.status();
            const finalUrl = res.url();
            const contentType = res.headers()['content-type'] || '';
            console.log(`health response status=${status}`);
            console.log(`health final_url=${finalUrl}`);
            console.log(`health content_type=${contentType || '(none)'}`);
            if (/cloudflareaccess\.com/i.test(finalUrl)) return fail('ACCESS_AUTH_FAILED: health redirected to Cloudflare Access login');
            if (status !== 200) return fail(`HEALTH_FAILED: expected 200, got ${status}`);
            if (!/application\/json/i.test(contentType)) return fail(`HEALTH_FAILED: expected application/json, got ${contentType || '(none)'}`);
            const body = await res.json().catch(() => null);
            if (!body || body.ok !== true) fail('HEALTH_FAILED: response JSON missing ok=true');
          }

          async function pageIdentity(page, response, label) {
            const status = response ? response.status() : 0;
            const finalUrl = page.url();
            const contentType = response ? (response.headers()['content-type'] || '') : '';
            const title = await page.title().catch(() => '');
            const marker = await page.locator('text=顧客ID照合').first().isVisible({ timeout: 8000 }).catch(() => false);
            console.log(`${label} response status=${status}`);
            console.log(`${label} final_url=${finalUrl}`);
            console.log(`${label} content_type=${contentType || '(none)'}`);
            console.log(`${label} document_title=${title || '(empty)'}`);
            console.log(`${label} review_marker=${marker ? 'YES' : 'NO'}`);
            if (/cloudflareaccess\.com/i.test(finalUrl) || /Sign in.*Cloudflare Access/i.test(title)) {
              fail(`${label}: ACCESS_AUTH_FAILED Cloudflare Access login page returned`);
              return false;
            }
            if (status !== 200) { fail(`${label}: expected HTTP 200, got ${status}`); return false; }
            if (!/text\/html/i.test(contentType)) { fail(`${label}: expected text/html, got ${contentType || '(none)'}`); return false; }
            if (!marker) { fail(`${label}: Review Workspace marker missing`); return false; }
            expectedUiByPage.set(page, true);
            return true;
          }

          async function verifyCandidateState(page, label) {
            const bodyText = await page.locator('body').innerText({ timeout: 15000 }).catch(() => '');
            if (!/全20\s*candidate pair|全20\s*candidate|全20/.test(bodyText)) fail(`${label}: candidate total 20 not confirmed`);
            const stats = await page.locator('.stat').allInnerTexts().catch(() => []);
            const joined = stats.join(' | ');
            if (!/20[\s\S]*未確認|未確認[\s\S]*20/.test(joined)) fail(`${label}: UNREVIEWED=20 not confirmed`);
            for (const pair of [['同一人物','0'],['別人','0'],['保留','0']]) {
              const [name, count] = pair;
              const stat = stats.find(x => x.includes(name)) || '';
              if (!new RegExp(`(^|\\D)${count}(\\D|$)`).test(stat)) fail(`${label}: ${name}=0 not confirmed`);
            }
          }

          async function exerciseFilters(page, label) {
            const buttons = page.locator('#filters [data-f], #filters .filter');
            if ((await buttons.count()) < 4) return fail(`${label}: filter controls missing`);
            for (const name of ['SAME_PERSON','DIFFERENT_PERSON','DEFERRED','UNREVIEWED']) {
              const b = page.locator(`#filters [data-f="${name}"]`).first();
              if (!(await b.isVisible().catch(() => false))) { fail(`${label}: filter ${name} not visible`); continue; }
              await b.click();
              await page.waitForTimeout(200);
            }
          }

          async function checkPage(page, label, desktop = false) {
            const response = await page.goto(BASE_URL + REVIEW_PATH, { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => null);
            await page.waitForLoadState('networkidle', { timeout: 45000 }).catch(() => {});
            if (!(await pageIdentity(page, response, label))) return;

            if (!(await page.locator('.stat').first().isVisible({ timeout: 15000 }).catch(() => false))) fail(`${label}: review stats not visible`);
            if (!(await page.locator('#list .row').first().isVisible({ timeout: 15000 }).catch(() => false))) fail(`${label}: first candidate row not visible`);
            await verifyCandidateState(page, label);
            await exerciseFilters(page, label);

            const firstRow = page.locator('#list .row').first();
            if (await firstRow.isVisible().catch(() => false)) {
              await firstRow.click();
              if (!(await page.locator('#modal.show, .modal.show').first().isVisible({ timeout: 15000 }).catch(() => false))) fail(`${label}: detail modal not visible`);
              const detailText = await page.locator('#modal, .modal').first().innerText({ timeout: 15000 }).catch(() => '');
              if (!/予約管理側/.test(detailText)) fail(`${label}: Reservation side not found`);
              if (!/CRM候補/.test(detailText)) fail(`${label}: CRM side not found`);
              if (!/Evidence/.test(detailText)) fail(`${label}: Evidence not found`);
              if (desktop) {
                const grid = page.locator('#modal .grid, .modal .grid').first();
                const cols = await grid.evaluate(el => getComputedStyle(el).gridTemplateColumns).catch(() => '');
                if (!cols || cols === 'none' || cols.split(' ').length < 2) fail(`${label}: 2-column comparison not established`);
                const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 2);
                if (overflow) fail(`${label}: horizontal overflow detected`);
              }
              await page.mouse.wheel(0, 1400);
              await page.waitForTimeout(250);
              const close = page.locator('#close, button:has-text("閉じる")').first();
              if (!(await close.isVisible().catch(() => false))) fail(`${label}: close button not visible`);
              else await close.click();
            }

            await page.mouse.wheel(0, 1800);
            await page.waitForTimeout(250);
            if (!(await page.locator('body').isVisible().catch(() => false))) fail(`${label}: body not visible after scroll`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const healthContext = await browser.newContext({ extraHTTPHeaders: authHeaders });
            await checkHealth(healthContext.request);
            await healthContext.close();

            const unauthContext = await browser.newContext();
            const unauthPage = await unauthContext.newPage();
            const unauthResponse = await unauthPage.goto(BASE_URL + REVIEW_PATH, { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => null);
            const unauthStatus = unauthResponse ? unauthResponse.status() : 0;
            const unauthUrl = unauthPage.url();
            const unauthTitle = await unauthPage.title().catch(() => '');
            const unauthMarker = await unauthPage.locator('text=顧客ID照合').first().isVisible({ timeout: 3000 }).catch(() => false);
            console.log(`unauthenticated response status=${unauthStatus}`);
            console.log(`unauthenticated final_url=${unauthUrl}`);
            console.log(`unauthenticated review_marker=${unauthMarker ? 'YES' : 'NO'}`);
            if (unauthMarker) fail('unauthenticated Review Workspace was visible');
            if (!(unauthStatus === 401 || unauthStatus === 403 || /cloudflareaccess\.com/i.test(unauthUrl) || /Cloudflare Access/i.test(unauthTitle))) {
              fail(`unauthenticated access was not blocked; status=${unauthStatus}`);
            }
            await unauthContext.close();

            const mobileContext = await browser.newContext({
              viewport: { width: 412, height: 915 }, isMobile: true, hasTouch: true,
              extraHTTPHeaders: authHeaders
            });
            const mobile = await mobileContext.newPage();
            watch(mobile, 'mobile 412x915');
            await checkPage(mobile, 'mobile 412x915', false);
            await mobileContext.close();

            const desktopContext = await browser.newContext({
              viewport: { width: 1440, height: 1000 }, extraHTTPHeaders: authHeaders
            });
            const desktop = await desktopContext.newPage();
            watch(desktop, 'desktop 1440x1000');
            await checkPage(desktop, 'desktop 1440x1000', true);
            await desktopContext.close();

            await browser.close();

            if (writes.length) fail(`write requests detected: ${writes.join(', ')}`);
            if (pageErrors.length) fail(`pageerror detected: ${pageErrors.join(' | ')}`);
            const actionableConsoleErrors = consoleErrors.filter(entry => {
              if (!knownAccessLoginCsp(entry.text)) return true;
              return expectedUiByPage.get(entry.page) === true;
            });
            if (actionableConsoleErrors.length) fail(`console error detected: ${actionableConsoleErrors.map(e => `${e.label}: ${e.text}`).join(' | ')}`);

            if (failures.length) {
              console.error('Production browser smoke FAILED');
              for (const f of failures) console.error('- ' + f);
              process.exit(1);
            }

            console.log('Production browser smoke PASSED');
            console.log('decision POST: 0');
            console.log('CRM write: 0');
            console.log('Reservation write: 0');
            console.log('LINE write: 0');
          })().catch(err => {
            console.error(err && err.message ? err.message : String(err));
            process.exit(1);
          });
          NODE


  customer360_deep_readonly:
    name: Customer360 production deep read-only smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      BASE_URL: https://customer-crm-api.ohw3rz5578d277e.workers.dev
      PRODUCTION_SHA: f75f30a9c745a428dcead4fcd1c0ffaca5b70cfd
      CRM_INTERNAL_TOKEN: ${{ secrets.CRM_INTERNAL_TOKEN }}
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assert verification branch changes workflow only
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$PRODUCTION_SHA"
          git cat-file -e "$PRODUCTION_SHA^{commit}"
          changed="$(git diff --name-only "$PRODUCTION_SHA"...HEAD)"
          echo "CURRENT_MAIN_SHA=$remote_main"
          echo "VERIFICATION_BRANCH_SHA=$(git rev-parse HEAD)"
          printf 'VERIFICATION_DIFF=%s\n' "${changed//$'\n'/,}"
          test "$changed" = ".github/workflows/production-browser-smoke-auth.yml"
          echo "PRODUCTION_SOURCE_DRIFT=0"
          echo "VERIFICATION_BRANCH_WORKFLOW_ONLY=PASS"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Customer360 deep read-only Production smoke
        shell: bash
        run: |
          set -euo pipefail
          for v in CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET ADMIN_TOKEN CRM_INTERNAL_TOKEN; do
            test -n "${!v}" || { echo "::error::$v missing"; exit 1; }
          done
          echo 'CRM_INTERNAL_TOKEN_CONFIGURED=PASS'
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
          const base=process.env.BASE_URL;
          const serverAuth={
            'CF-Access-Client-Id':process.env.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret':process.env.CF_ACCESS_CLIENT_SECRET,
            'x-admin-token':process.env.ADMIN_TOKEN
          };
          const browser=await chromium.launch({headless:true});
          const writes=[],reads=[],pageErrors=[],consoleErrors=[],browserSecretHeaders=[];
          let customerDetail='NO_CUSTOMER_AVAILABLE';
          let composer='NO_APPROACH_ROW';
          try{
            const context=await browser.newContext({
              viewport:{width:390,height:844},
              screen:{width:390,height:844},
              isMobile:true,
              hasTouch:true
            });
            const page=await context.newPage();
            await page.route(base+'/**',async route=>{
              const req=route.request();
              const browserHeaders=await req.allHeaders();
              for(const name of ['cf-access-client-id','cf-access-client-secret','x-admin-token','authorization','x-internal-token']){
                if(browserHeaders[name])browserSecretHeaders.push(name);
              }
              if(req.method()!=='GET'&&req.method()!=='HEAD'){
                writes.push(req.method()+' '+new URL(req.url()).pathname);
                await route.abort('blockedbyclient');
                return;
              }
              const upstream=await fetch(req.url(),{
                method:req.method(),
                headers:{
                  ...serverAuth,
                  accept:browserHeaders.accept||'*/*',
                  'user-agent':browserHeaders['user-agent']||'Customer360-Deep-Production-Verifier',
                  'x-internal-token':process.env.CRM_INTERNAL_TOKEN,
                  'x-crm-internal-principal':'reservation-app'
                },
                redirect:'manual'
              });
              const responseHeaders=Object.fromEntries(upstream.headers.entries());
              for(const h of ['content-encoding','content-length','transfer-encoding','connection'])delete responseHeaders[h];
              await route.fulfill({
                status:upstream.status,
                headers:responseHeaders,
                body:Buffer.from(await upstream.arrayBuffer())
              });
            });
            page.on('request',r=>{
              const u=new URL(r.url());
              if(u.origin===new URL(base).origin){
                reads.push(r.method()+' '+u.pathname+u.search);
                if(r.method()!=='GET'&&r.method()!=='HEAD')writes.push(r.method()+' '+u.pathname);
              }
            });
            page.on('pageerror',e=>pageErrors.push(String(e?.message||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});

            const response=await page.goto(base+'/admin',{waitUntil:'domcontentloaded',timeout:45000});
            if(!response||response.status()!==200)throw new Error('ADMIN_STATUS_'+(response?.status()||0));
            await page.waitForFunction(()=>window.__crmOwnerView&&window.__crmCustomer360UI&&document.getElementById('crmCsvImportOpen'),null,{timeout:20000});

            const html=await page.content();
            for(const secret of [process.env.CF_ACCESS_CLIENT_ID,process.env.CF_ACCESS_CLIENT_SECRET,process.env.ADMIN_TOKEN]){
              if(secret&&html.includes(secret))throw new Error('BROWSER_SECRET_VALUE_EXPOSED');
            }

            await page.evaluate(()=>window.__crmOwnerView.showCustomers());
            await page.waitForFunction(()=>document.body.dataset.crmOwnerView==='customers',null,{timeout:10000});
            await page.locator('#crmMktList.open').waitFor({timeout:15000});
            await page.waitForTimeout(800);

            const customerButton=page.locator('#crmMktList [data-open],#crmMktList [data-direct-customer]').first();
            if(await customerButton.count()){
              const id=(await customerButton.getAttribute('data-open'))||(await customerButton.getAttribute('data-direct-customer'))||'';
              if(!/^\d{8}$/.test(id))throw new Error('VISIBLE_CUSTOMER_WITHOUT_CANONICAL_ID');
              await customerButton.click();
              await page.locator('#crmMktDetail.open').waitFor({timeout:15000});
              const detailText=await page.locator('#crmMktDetail').innerText();
              if(!detailText.includes(id))throw new Error('CUSTOMER_DETAIL_ID_MISSING');
              customerDetail='PASS';
              const close=page.locator('#crmMktDetail button').filter({hasText:/戻る|閉じる|×/}).first();
              if(await close.count())await close.click().catch(()=>{});
              else await page.evaluate(()=>document.getElementById('crmMktDetail')?.classList.remove('open'));
            }

            await page.evaluate(()=>window.__crmOwnerView.showMarketing());
            await page.waitForFunction(()=>document.body.dataset.crmOwnerView==='marketing'&&document.getElementById('crmMktHome')?.classList.contains('open'),null,{timeout:10000});
            await page.waitForSelector('#crmMktHome .crm-period-analytics',{timeout:15000});
            await page.waitForSelector('#crmMktHome .crm-approach-queue',{timeout:15000});
            await page.waitForTimeout(1800);

            const homeText=await page.locator('#crmMktHome').innerText();
            if(!/分析・アプローチ/.test(homeText))throw new Error('MARKETING_VIEW_COPY_MISSING');
            if(!reads.some(x=>x.startsWith('GET /api/customer360/analytics')))throw new Error('ANALYTICS_GET_MISSING');
            if(!reads.some(x=>x.startsWith('GET /api/customer360/approach-queue')))throw new Error('APPROACH_QUEUE_GET_MISSING');

            const revalidateType=await page.evaluate(()=>typeof window.__crmCustomer360ReadOnly?.revalidateApproachContact);
            if(revalidateType!=='function')throw new Error('LINE_REVALIDATION_HELPER_MISSING');

            const summary=page.locator('.crm-approach-row .crm-approach-draft summary').first();
            if(await summary.count()){
              await summary.click();
              await page.locator('#crmProposalCComposer.open').waitFor({timeout:10000});
              if(!(await page.locator('#crmProposalCCopy').isVisible()))throw new Error('PROPOSAL_C_COPY_BUTTON_MISSING');
              if(!(await page.locator('#crmProposalCLine').isVisible()))throw new Error('PROPOSAL_C_LINE_BUTTON_MISSING');
              const composerText=await page.locator('#crmProposalCComposer').innerText();
              if(!/自動送信されません/.test(composerText))throw new Error('PROPOSAL_C_AUTO_SEND_WARNING_MISSING');
              composer='PASS';
              await page.locator('#crmProposalCComposer .crm-c-compose-close').click();
            }

            const csvOpen=page.locator('#crmCsvImportOpen');
            if(!(await csvOpen.isVisible()))throw new Error('CSV_IMPORT_OPEN_MISSING');
            await csvOpen.click();
            await page.locator('#crmCsvSheet.open').waitFor({timeout:10000});
            if(!(await page.locator('#crmCsvFile').isVisible()))throw new Error('CSV_FILE_INPUT_MISSING');
            if(!(await page.locator('#crmCsvPreview').isVisible()))throw new Error('CSV_PREVIEW_BUTTON_MISSING');
            if(!(await page.locator('#crmCsvCommit').isVisible()))throw new Error('CSV_COMMIT_BUTTON_MISSING');
            if(!(await page.locator('#crmCsvCommit').isDisabled()))throw new Error('CSV_COMMIT_NOT_DISABLED_INITIAL');
            const enc=await page.locator('#crmCsvEncoding option').evaluateAll(opts=>opts.map(o=>o.value));
            if(!enc.includes('utf-8')||!enc.includes('shift_jis'))throw new Error('CSV_ENCODING_OPTIONS_MISSING');
            await page.locator('#crmCsvSheet .crm-csv-close').click();
            await page.waitForFunction(()=>!document.getElementById('crmCsvSheet')?.classList.contains('open'));

            const overflow=await page.evaluate(()=>Math.max(
              document.documentElement.scrollWidth-document.documentElement.clientWidth,
              document.body.scrollWidth-document.body.clientWidth
            ));
            if(overflow>1)throw new Error('HORIZONTAL_OVERFLOW_'+overflow);
            if(writes.length)throw new Error('PRODUCTION_BROWSER_WRITE:'+Array.from(new Set(writes)).join(','));
            if(browserSecretHeaders.length)throw new Error('BROWSER_SECRET_HEADER:'+browserSecretHeaders.join(','));
            if(pageErrors.length)throw new Error('PAGE_ERRORS:'+pageErrors.join(' | '));
            const actionableConsole=consoleErrors.filter(x=>/404|not found|uncaught|typeerror|referenceerror/i.test(x));
            if(actionableConsole.length)throw new Error('ACTIONABLE_CONSOLE_ERRORS:'+actionableConsole.join(' | '));

            console.log('PRODUCTION_MOBILE_390_CUSTOMER360=PASS');
            console.log('PRODUCTION_CUSTOMER_DETAIL='+customerDetail);
            console.log('PRODUCTION_ANALYTICS_READ=PASS');
            console.log('PRODUCTION_APPROACH_QUEUE_READ=PASS');
            console.log('PRODUCTION_LINE_REVALIDATION_HELPER=PASS');
            console.log('PRODUCTION_PROPOSAL_C_COMPOSER='+composer);
            console.log('PRODUCTION_LINE_NAVIGATION=0');
            console.log('PRODUCTION_LINE_SEND=0');
            console.log('PRODUCTION_CSV_IMPORT_UI=PASS');
            console.log('PRODUCTION_CSV_PREVIEW_POST=0');
            console.log('PRODUCTION_CSV_COMMIT_CLICK=0');
            console.log('PRODUCTION_BROWSER_WRITES=0');
            console.log('PRODUCTION_BROWSER_SECRET_HEADERS=0');
            console.log('PRODUCTION_HORIZONTAL_OVERFLOW='+overflow);
            console.log('CUSTOMER_ID_GENERATION=0');
            console.log('RESULT=PASS');
          } finally {
            await browser.close();
          }
          })().catch(err=>{console.error(err&&err.stack?err.stack:String(err));process.exit(1)});
          NODE
