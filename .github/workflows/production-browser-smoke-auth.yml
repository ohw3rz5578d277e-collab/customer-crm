name: Production Authenticated Browser Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Customer CRM production Owner UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      BASE_URL: https://customer-crm-api.ohw3rz5578d277e.workers.dev
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify read-only credentials
        shell: bash
        run: |
          set -euo pipefail
          for v in ADMIN_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            test -n "${!v}" || { echo "::error::MISSING_$v"; exit 1; }
            echo "::add-mask::${!v}"
          done
          echo 'PRODUCTION_WRITE=0'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run canonical Owner UI read-only smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-owner-ui-smoke
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs=require('fs');

          const BASE_URL=process.env.BASE_URL;
          const serverAuth={
            'CF-Access-Client-Id':process.env.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret':process.env.CF_ACCESS_CLIENT_SECRET,
            'x-admin-token':process.env.ADMIN_TOKEN
          };

          const results=[];
          const forbiddenHeadings=['今日やることダッシュボード','予約管理との連携','納品進捗・遅延アラート'];

          async function runViewport(browser,width,height){
            const label=width+'x'+height;
            const mobile=width<=767;
            const context=await browser.newContext({
              viewport:{width,height},
              screen:{width,height},
              isMobile:mobile,
              hasTouch:mobile
            });
            const page=await context.newPage();
            const writes=[],pageErrors=[],consoleErrors=[],secretHeaders=[];
            let customerDetailGets=0;

            await page.route(BASE_URL+'/**',async route=>{
              const req=route.request();
              const browserHeaders=await req.allHeaders();
              for(const name of ['cf-access-client-id','cf-access-client-secret','x-admin-token','authorization','x-internal-token']){
                if(browserHeaders[name])secretHeaders.push(name);
              }
              if(!['GET','HEAD'].includes(req.method())){
                writes.push(req.method()+' '+new URL(req.url()).pathname);
                await route.abort('blockedbyclient');
                return;
              }
              const upstream=await fetch(req.url(),{
                method:req.method(),
                headers:{
                  ...serverAuth,
                  accept:browserHeaders.accept||'*/*',
                  'user-agent':browserHeaders['user-agent']||'CRM-Production-Owner-UI-Smoke'
                },
                redirect:'manual'
              });
              const headers=Object.fromEntries(upstream.headers.entries());
              for(const h of ['content-encoding','content-length','transfer-encoding','connection'])delete headers[h];
              await route.fulfill({
                status:upstream.status,
                headers,
                body:Buffer.from(await upstream.arrayBuffer())
              });
            });

            page.on('pageerror',e=>pageErrors.push(String(e?.message||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('request',r=>{
              if(r.method()==='GET'&&/^\/api\/customer360\/customer\/\d{8}$/.test(new URL(r.url()).pathname))customerDetailGets++;
            });

            const response=await page.goto(BASE_URL+'/admin',{waitUntil:'domcontentloaded',timeout:45000});
            if(!response||response.status()!==200)throw new Error(label+': ADMIN_STATUS_'+(response?.status()||0));
            await page.waitForFunction(()=>window.__crmOwnerView&&document.getElementById('crmOwnerWorkspaceTitle'),null,{timeout:20000});

            if(mobile){
              if(!(await page.locator('#crmOwnerMobileNav').isVisible()))throw new Error(label+': MOBILE_NAV_MISSING');
              if(await page.locator('#crmOwnerDesktopSidebar').isVisible().catch(()=>false))throw new Error(label+': DESKTOP_NAV_VISIBLE_ON_MOBILE');
            }else{
              if(!(await page.locator('#crmOwnerDesktopSidebar').isVisible()))throw new Error(label+': DESKTOP_NAV_MISSING');
              if(await page.locator('#crmOwnerMobileNav').isVisible().catch(()=>false))throw new Error(label+': MOBILE_NAV_VISIBLE_ON_DESKTOP');
            }

            const sel={
              customers:mobile?'#crmOwnerNavCustomers':'#crmOwnerDesktopSidebar [data-crm-shell-nav="customers"]',
              search:mobile?'#crmOwnerNavSearch':'#crmOwnerDesktopSidebar [data-crm-shell-nav="search"]',
              marketing:mobile?'#crmOwnerNavMarketing':'#crmOwnerDesktopSidebar [data-crm-shell-nav="marketing"]',
              line:mobile?'#crmOwnerNavLine':'#crmOwnerDesktopSidebar [data-crm-shell-nav="line"]',
              reservation:mobile?'#crmOwnerNavReservation':'#crmOwnerDesktopSidebar [data-crm-shell-nav="reservation"]'
            };

            await page.locator(sel.customers).click();
            await page.waitForFunction(()=>document.body.dataset.crmOwnerView==='customers'&&document.getElementById('crmMktList')?.classList.contains('open'),null,{timeout:15000});
            if(!(await page.locator('#crmGlobalSearch').isVisible()))throw new Error(label+': CUSTOMER_SEARCH_MISSING');
            if((await page.locator('#crmMktList [data-open],#crmMktList [data-direct-customer]').count())<1)throw new Error(label+': CUSTOMER_ROWS_MISSING');
            const title1=(await page.locator('#crmOwnerWorkspaceTitle').textContent())||'';
            if(!title1.includes('顧客'))throw new Error(label+': CUSTOMER_TITLE_INVALID:'+title1);
            for(const h of forbiddenHeadings){
              if(await page.getByText(h,{exact:false}).first().isVisible().catch(()=>false))throw new Error(label+': LEGACY_UI_VISIBLE:'+h);
            }
            if(await page.locator('#crmTodayDashboard').isVisible().catch(()=>false))throw new Error(label+': LEGACY_TODAY_VISIBLE');

            const first=page.locator('#crmMktList [data-open],#crmMktList [data-direct-customer]').first();
            const id=(await first.getAttribute('data-open'))||(await first.getAttribute('data-direct-customer'))||'';
            if(!/^\d{8}$/.test(id))throw new Error(label+': NON_CANONICAL_VISIBLE_CUSTOMER_ID:'+id);
            await first.click();
            await page.locator('#crmMktDetail.open').waitFor({timeout:15000});
            await page.getByRole('heading',{name:'顧客プロフィール'}).waitFor({timeout:15000});
            for(const section of ['基本情報','家族','撮影履歴','売上','集客・紹介','満足度・許可','LINEから見つかった情報','備考・対応メモ']){
              if(!(await page.getByText(section,{exact:false}).first().isVisible()))throw new Error(label+': DETAIL_SECTION_MISSING:'+section);
            }
            if(customerDetailGets<1)throw new Error(label+': CUSTOMER_DETAIL_GET_MISSING');
            await page.locator('.crm-detail-close').click();
            await page.locator('#crmMktDetail.open').waitFor({state:'hidden',timeout:10000}).catch(()=>{});

            await page.locator(sel.search).click();
            await page.waitForFunction(()=>document.body.dataset.crmOwnerView==='search',null,{timeout:10000});
            if(!(await page.locator('#crmGlobalSearch').isVisible()))throw new Error(label+': SEARCH_VIEW_FIELD_MISSING');

            await page.locator(sel.marketing).click();
            await page.waitForFunction(()=>document.body.dataset.crmOwnerView==='marketing'&&document.getElementById('crmMktHome')?.classList.contains('open'),null,{timeout:10000});
            if(!(await page.locator('#crmMktHome').isVisible()))throw new Error(label+': ANALYTICS_HOME_MISSING');
            const title2=(await page.locator('#crmOwnerWorkspaceTitle').textContent())||'';
            if(!title2.includes('分析'))throw new Error(label+': ANALYTICS_TITLE_INVALID:'+title2);

            await page.locator(sel.line).click();
            await page.waitForFunction(()=>document.body.dataset.crmOwnerView==='line'&&document.getElementById('crmOwnerLineChat')&&getComputedStyle(document.getElementById('crmOwnerLineChat')).display!=='none',null,{timeout:15000});
            if(await page.locator('#lineOpsPanel').isVisible().catch(()=>false))throw new Error(label+': LEGACY_LINE_OPS_VISIBLE');

            const reservation=page.locator(sel.reservation);
            const href=await reservation.getAttribute('href');
            if(!href||!href.startsWith('https://reservation-app-api.ohw3rz5578d277e.workers.dev/admin'))throw new Error(label+': RESERVATION_LINK_INVALID:'+href);

            const overflow=await page.evaluate(()=>Math.max(
              document.documentElement.scrollWidth-document.documentElement.clientWidth,
              document.body.scrollWidth-document.body.clientWidth
            ));
            if(overflow>1)throw new Error(label+': HORIZONTAL_OVERFLOW_'+overflow);
            if(writes.length)throw new Error(label+': WRITE_REQUESTS:'+writes.join(','));
            if(secretHeaders.length)throw new Error(label+': BROWSER_SECRET_HEADERS:'+secretHeaders.join(','));
            if(pageErrors.length)throw new Error(label+': PAGE_ERRORS:'+pageErrors.join(' | '));
            const actionable=consoleErrors.filter(x=>/404|not found|uncaught|typeerror|referenceerror/i.test(x));
            if(actionable.length)throw new Error(label+': CONSOLE_ERRORS:'+actionable.join(' | '));

            await page.screenshot({
              path:'artifacts/production-owner-ui-smoke/'+label+'-line.png',
              fullPage:true
            });
            await page.locator(sel.customers).click();
            await page.waitForFunction(()=>document.body.dataset.crmOwnerView==='customers',null,{timeout:10000});
            await page.screenshot({
              path:'artifacts/production-owner-ui-smoke/'+label+'-customers.png',
              fullPage:true
            });

            results.push({
              viewport:label,
              customer:'PASS',
              search:'PASS',
              analytics:'PASS',
              line:'PASS',
              reservation_link:'PASS',
              customer360:'PASS',
              legacy_ui_hidden:'PASS',
              horizontal_overflow:overflow,
              production_writes:0,
              customer_detail_gets:customerDetailGets
            });
            await context.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const [w,h] of [[390,844],[1440,900]])await runViewport(browser,w,h);
            }finally{
              await browser.close();
            }
            fs.writeFileSync('artifacts/production-owner-ui-smoke/result.json',JSON.stringify(results,null,2));
            console.log('PRODUCTION_OWNER_UI_SMOKE=PASS');
            console.log('RESULTS='+JSON.stringify(results));
            console.log('PRODUCTION_BROWSER_WRITES=0');
            console.log('CUSTOMER_ID_GENERATION=0');
            console.log('LINE_SEND=0');
          })().catch(e=>{
            console.error(e?.stack||String(e));
            process.exit(1);
          });
          NODE

      - name: Upload Production Owner UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-owner-ui-smoke
          path: artifacts/production-owner-ui-smoke/
          if-no-files-found: warn
          retention-days: 7
