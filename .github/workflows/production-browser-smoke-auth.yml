name: Production Authenticated Browser Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-browser-smoke-auth.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Customer CRM production browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      BASE_URL: https://customer-crm-api.ohw3rz5578d277e.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secret presence
        shell: bash
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN GitHub Actions secret is missing. Register it in repository Actions secrets."
            exit 1
          fi
          echo "::add-mask::$ADMIN_TOKEN"
          echo "ADMIN_TOKEN GitHub Actions secret is present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run read-only browser smoke
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          const BASE_URL = process.env.BASE_URL;
          const ADMIN_TOKEN = process.env.ADMIN_TOKEN;
          const REVIEW_PATH = '/admin/customer-id-reconciliation';
          const HEALTH_PATH = '/api/crm-health-check';

          if (!BASE_URL || !ADMIN_TOKEN) throw new Error('BASE_URL or ADMIN_TOKEN missing');

          const failures = [];
          const pageErrors = [];
          const consoleErrors = [];
          const writes = [];
          const expectedUiByPage = new WeakMap();

          const writePatterns = [
            /\/api\/customer-id-reconciliation\/reviews\/[^/]+$/,
            /\/api\/customers\/[^/]+\/line-send/,
            /\/api\/customers\/[^/]+\/line-message-logs/,
            /\/api\/line-message-logs\/[^/]+\/mark-sent/,
            /\/api\/sync\/customers\/upsert/,
            /\/api\/reservation-drafts/,
            /\/internal\/line\/push/
          ];

          const knownCspDataImage = text =>
            /Refused to load the image 'data:image\/svg\+xml/i.test(text) &&
            /Content Security Policy/i.test(text);

          function fail(message) {
            failures.push(message);
          }

          function watch(page, label) {
            expectedUiByPage.set(page, false);
            page.on('pageerror', err => pageErrors.push(`${label}: ${err.message || String(err)}`));
            page.on('console', msg => {
              if (msg.type() !== 'error') return;
              const text = msg.text();
              consoleErrors.push({ label, text, page });
            });
            page.on('request', req => {
              const path = new URL(req.url()).pathname;
              if (req.method() !== 'GET' && writePatterns.some(r => r.test(path))) {
                writes.push(`${req.method()} ${path}`);
              }
            });
          }

          async function safeMeta(page, response, label) {
            const status = response ? response.status() : 0;
            const finalUrl = page.url();
            const contentType = response ? (response.headers()['content-type'] || '') : '';
            const title = await page.title().catch(() => '');
            const marker = await page.locator('text=顧客ID照合').first().isVisible({ timeout: 8000 }).catch(() => false);
            console.log(`${label} response status=${status}`);
            console.log(`${label} final_url=${finalUrl}`);
            console.log(`${label} content_type=${contentType || '(none)'}`);
            console.log(`${label} document_title=${title || '(empty)'}`);
            console.log(`${label} expected_ui_marker=${marker ? 'YES' : 'NO'}`);
            return { status, finalUrl, contentType, title, marker };
          }

          async function checkHealth(request) {
            const res = await request.get(BASE_URL + HEALTH_PATH, {
              headers: { 'x-admin-token': ADMIN_TOKEN }
            });
            const status = res.status();
            console.log(`health response status=${status}`);
            if (status === 401 || status === 403) {
              fail(`AUTH_FAILED: health returned ${status}`);
              return;
            }
            if (status !== 200) {
              fail(`HEALTH_FAILED: expected 200, got ${status}`);
              return;
            }
            const body = await res.json().catch(() => null);
            if (!body || body.ok !== true) fail('HEALTH_FAILED: response JSON missing ok=true');
            else console.log('health json ok=true');
          }

          async function checkPage(page, label) {
            const response = await page.goto(BASE_URL + REVIEW_PATH, {
              waitUntil: 'domcontentloaded',
              timeout: 45000
            }).catch(() => null);
            await page.waitForLoadState('networkidle', { timeout: 45000 }).catch(() => {});

            const meta = await safeMeta(page, response, label);
            if (meta.status === 401 || meta.status === 403) {
              fail(`${label}: AUTH_FAILED status=${meta.status}`);
              return;
            }
            if (meta.status !== 200) {
              fail(`${label}: WRONG_PAGE_OR_RUNTIME status=${meta.status}`);
              return;
            }
            if (!meta.marker) {
              fail(`${label}: WRONG_PAGE_OR_RUNTIME expected Review UI marker missing`);
              return;
            }

            expectedUiByPage.set(page, true);

            const statVisible = await page.locator('.stat').first().isVisible({ timeout: 15000 }).catch(() => false);
            const listVisible = await page.locator('#list .row, #list .card').first().isVisible({ timeout: 15000 }).catch(() => false);
            const bodyText = await page.locator('body').innerText({ timeout: 15000 }).catch(() => '');

            if (!statVisible) fail(`${label}: review stats not visible`);
            if (!listVisible) fail(`${label}: review list/empty state not visible`);
            if (!/candidate pair|candidate|全/.test(bodyText)) fail(`${label}: candidate summary not found`);
            if (!/未確認|同一人物|別人|保留/.test(bodyText)) fail(`${label}: filter labels not found`);

            const firstRow = page.locator('#list .row').first();
            const hasRow = await firstRow.count().then(n => n > 0).catch(() => false);
            if (hasRow) {
              await firstRow.click();
              const modalVisible = await page.locator('#modal.show, .modal.show').first().isVisible({ timeout: 15000 }).catch(() => false);
              if (!modalVisible) fail(`${label}: detail modal not visible`);
              const detailText = await page.locator('#modal, .modal').first().innerText({ timeout: 15000 }).catch(() => '');
              if (!/予約管理側/.test(detailText)) fail(`${label}: Reservation side not found`);
              if (!/CRM候補|CRM side|CRM/.test(detailText)) fail(`${label}: CRM side not found`);
              if (!/Evidence|evidence|照合/.test(detailText)) fail(`${label}: evidence not found`);
              await page.mouse.wheel(0, 1400);
              await page.waitForTimeout(300);
              const close = page.locator('#close, button:has-text("閉じる")').first();
              if (await close.count().then(n => n > 0).catch(() => false)) await close.click();
            }

            await page.mouse.wheel(0, 1800);
            await page.waitForTimeout(300);
            if (!(await page.locator('body').isVisible().catch(() => false))) fail(`${label}: body not visible after scroll`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const healthContext = await browser.newContext({
              extraHTTPHeaders: { 'x-admin-token': ADMIN_TOKEN }
            });
            await checkHealth(healthContext.request);
            await healthContext.close();

            const unauthContext = await browser.newContext();
            const unauthPage = await unauthContext.newPage();
            const unauthResponse = await unauthPage.goto(BASE_URL + REVIEW_PATH, {
              waitUntil: 'domcontentloaded', timeout: 45000
            }).catch(() => null);
            const unauthStatus = unauthResponse ? unauthResponse.status() : 0;
            const unauthBody = await unauthPage.locator('body').innerText({ timeout: 5000 }).catch(() => '');
            console.log(`unauthenticated response status=${unauthStatus}`);
            if (!(unauthStatus === 401 || unauthStatus === 403 || /login|access|unauthorized|forbidden|認証/i.test(unauthBody))) {
              fail(`unauthenticated access was not blocked; status=${unauthStatus}`);
            }
            await unauthContext.close();

            const mobileContext = await browser.newContext({
              viewport: { width: 412, height: 915 },
              isMobile: true,
              hasTouch: true,
              extraHTTPHeaders: { 'x-admin-token': ADMIN_TOKEN }
            });
            const mobile = await mobileContext.newPage();
            watch(mobile, 'mobile 412x915');
            await checkPage(mobile, 'mobile 412x915');
            await mobileContext.close();

            const desktopContext = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              extraHTTPHeaders: { 'x-admin-token': ADMIN_TOKEN }
            });
            const desktop = await desktopContext.newPage();
            watch(desktop, 'desktop 1440x1000');
            await checkPage(desktop, 'desktop 1440x1000');
            await desktopContext.close();

            await browser.close();

            if (writes.length) fail(`write requests detected: ${writes.join(', ')}`);
            if (pageErrors.length) fail(`pageerror detected: ${pageErrors.join(' | ')}`);

            const actionableConsoleErrors = consoleErrors.filter(entry => {
              if (!knownCspDataImage(entry.text)) return true;
              return expectedUiByPage.get(entry.page) !== true;
            });
            if (actionableConsoleErrors.length) {
              fail(`console error detected: ${actionableConsoleErrors.map(e => `${e.label}: ${e.text}`).join(' | ')}`);
            }

            const ignoredKnownCsp = consoleErrors.length - actionableConsoleErrors.length;
            console.log(`known CSP data-image errors ignored after valid Review UI=${ignoredKnownCsp}`);

            if (failures.length) {
              console.error('Production browser smoke FAILED');
              for (const f of failures) console.error('- ' + f);
              process.exit(1);
            }

            console.log('Production browser smoke PASSED');
            console.log('decision POST: 0');
            console.log('CRM write: 0');
            console.log('Reservation write: 0');
            console.log('LINE write: 0');
          })().catch(err => {
            console.error(err && err.message ? err.message : String(err));
            process.exit(1);
          });
          NODE
