name: Verify Customer ID Manual Review Branch

on:
  push:
    branches:
      - task/customer-id-manual-review-ui-01

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and review safety
        run: |
          set -euo pipefail
          node --check src/crm-reconciliation-review.mjs
          node --check src/production-index-crm-browser-root-entry.js
          node tests/customer-id-reconciliation-review.mjs
          node --no-warnings tests/customer-id-reconciliation-review-runtime.mjs
      - name: Existing strict CRM regression
        run: node tests/crm-internal-customer-detail.mjs
