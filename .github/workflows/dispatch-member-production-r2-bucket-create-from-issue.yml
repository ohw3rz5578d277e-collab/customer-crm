name: Dispatch Member Production R2 bucket create from release-gate issue

run-name: 'Production mutation bridge: member-r2-bucket-create'

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: member-production-r2-bucket-create-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate exact Member R2 bucket-create command and dispatch
    if: >-
      github.event.issue.number == 26 &&
      github.event.issue.pull_request == null &&
      github.actor == 'ohw3rz5578d277e-collab' &&
      github.event.comment.user.login == 'ohw3rz5578d277e-collab' &&
      startsWith(github.event.comment.body, '/member-production-r2-bucket-create ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact Owner command and current main
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          command_re='^/member-production-r2-bucket-create sha=([0-9a-f]{40}) bucket_sha256=([0-9a-f]{64}) jurisdiction=(default) owner_ack=(AUTHORIZE_MEMBER_R2_BUCKET_CREATE:[0-9a-f]{40}:[0-9a-f]{64}:default)$'
          [[ "$COMMAND_BODY" =~ $command_re ]] || { echo '::error::INVALID_MEMBER_R2_BUCKET_CREATE_COMMAND'; exit 1; }
          [[ "$SOURCE_COMMENT_ID" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_SOURCE_COMMENT_ID'; exit 1; }

          expected_sha="${BASH_REMATCH[1]}"
          bucket_sha256="${BASH_REMATCH[2]}"
          jurisdiction="${BASH_REMATCH[3]}"
          owner_ack="${BASH_REMATCH[4]}"
          canonical_bucket_sha256='6f1f7fa25143081a302fcd148a52ae660195b2a31cf93a55f9ed39cf2e25f388'

          test "$bucket_sha256" = "$canonical_bucket_sha256" || { echo '::error::NONCANONICAL_BUCKET_DIGEST'; exit 1; }
          test "$jurisdiction" = 'default' || { echo '::error::NONCANONICAL_R2_JURISDICTION'; exit 1; }
          expected_ack="AUTHORIZE_MEMBER_R2_BUCKET_CREATE:${expected_sha}:${bucket_sha256}:default"
          test "$owner_ack" = "$expected_ack" || { echo '::error::OWNER_ACK_MISMATCH'; exit 1; }

          current_sha="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$current_sha" = "$expected_sha" || { echo "::error::MAIN_DRIFT expected=$expected_sha current=$current_sha"; exit 1; }

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "bucket_sha256=$bucket_sha256" >> "$GITHUB_OUTPUT"
          echo "jurisdiction=$jurisdiction" >> "$GITHUB_OUTPUT"
          echo "owner_ack=$owner_ack" >> "$GITHUB_OUTPUT"
          echo "source_comment_id=$SOURCE_COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "MEMBER_R2_BUCKET_CREATE_AUTHORIZED_SHA=$expected_sha"
          echo "AUTHORIZED_BUCKET_SHA256=$bucket_sha256"
          echo 'AUTHORIZED_JURISDICTION=default'
          echo "SOURCE_AUTHORIZATION_COMMENT_ID=$SOURCE_COMMENT_ID"
          echo 'BUCKET_CREATE_AUTHORIZED_COUNT=1'
          echo 'BUCKET_UPDATE_AUTHORIZED=0'
          echo 'BUCKET_DELETE_AUTHORIZED=0'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_OBJECT_WRITE=0'
          echo 'R2_OBJECT_LIST=0'
          echo 'R2_OBJECT_DELETE=0'
          echo 'PRODUCTION_STORAGE_BINDING_CHANGE=0'
          echo 'PRODUCTION_STORAGE_FETCH=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_D1_WRITE=0'

      - name: Dispatch exact one-time Member R2 bucket create
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          BUCKET_SHA256: ${{ steps.gate.outputs.bucket_sha256 }}
          JURISDICTION: ${{ steps.gate.outputs.jurisdiction }}
          OWNER_ACK: ${{ steps.gate.outputs.owner_ack }}
          SOURCE_COMMENT_ID: ${{ steps.gate.outputs.source_comment_id }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              'ref':'main',
              'inputs':{
                  'expected_sha':os.environ['EXPECTED_SHA'],
                  'candidate_bucket_sha256':os.environ['BUCKET_SHA256'],
                  'jurisdiction':os.environ['JURISDICTION'],
                  'owner_ack':os.environ['OWNER_ACK'],
                  'source_comment_id':os.environ['SOURCE_COMMENT_ID']
              }
          }))
          PY
          )"
          output=/tmp/member-r2-bucket-create-dispatch.txt
          code="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' --request POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/member-production-r2-bucket-create.yml/dispatches" -d "$payload")"
          if [[ "$code" != '204' ]]; then
            rm -f "$output"
            echo "::error::MEMBER_R2_BUCKET_CREATE_DISPATCH_FAILED_HTTP_$code"
            exit 1
          fi
          rm -f "$output"
          echo "MEMBER_R2_BUCKET_CREATE_DISPATCHED_SHA=$EXPECTED_SHA"
          echo "DISPATCHED_BUCKET_SHA256=$BUCKET_SHA256"
          echo 'DISPATCHED_JURISDICTION=default'
          echo "DISPATCHED_SOURCE_COMMENT_ID=$SOURCE_COMMENT_ID"
          echo 'BUCKET_CREATE_DISPATCH_COUNT=1'
          echo 'BUCKET_UPDATE_COUNT=0'
          echo 'BUCKET_DELETE_COUNT=0'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_OBJECT_WRITE=0'
          echo 'R2_OBJECT_LIST=0'
          echo 'R2_OBJECT_DELETE=0'
          echo 'PRODUCTION_STORAGE_BINDING_CHANGE=0'
          echo 'PRODUCTION_STORAGE_FETCH=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_D1_WRITE=0'
