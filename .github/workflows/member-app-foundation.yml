name: Member app foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/crm-member-*.mjs'
      - 'src/member-*.mjs'
      - 'migrations_managed/20260924_member_*.sql'
      - 'member_tests/**'
      - 'docs/member-app/**'
      - '.github/workflows/member-app-foundation.yml'
      - '.github/workflows/member-production-schema-preflight.yml'
      - '.github/workflows/dispatch-member-schema-preflight-from-issue.yml'
      - 'tests/member-production-schema-preflight-contract.test.mjs'
      - '.github/workflows/member-production-schema-apply.yml'
      - '.github/workflows/dispatch-member-schema-apply-from-issue.yml'
      - 'tests/member-production-schema-apply-contract.test.mjs'
      - '.github/workflows/member-production-runtime-readiness.yml'
      - '.github/workflows/dispatch-member-production-runtime-readiness-from-issue.yml'
      - 'tests/member-production-runtime-readiness-contract.test.mjs'
      - '.github/workflows/member-production-runtime-secret-stage.yml'
      - '.github/workflows/dispatch-member-production-runtime-secret-stage-from-issue.yml'
      - 'tests/member-production-runtime-secret-stage-contract.test.mjs'
      - '.github/workflows/member-production-storage-preflight.yml'
      - '.github/workflows/dispatch-member-production-storage-preflight-from-issue.yml'
      - 'tests/member-production-storage-preflight-contract.test.mjs'
      - '.github/workflows/member-production-r2-bucket-digest-index.yml'
      - '.github/workflows/dispatch-member-production-r2-bucket-digest-index-from-issue.yml'
      - 'tests/member-production-r2-bucket-digest-index-contract.test.mjs'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/dispatch-production-deploy-from-issue.yml'
      - 'tests/customer360-production-observer-concurrency-isolation.test.mjs'
      - 'tests/deploy-release-concurrency-isolation.mjs'
      - 'tests/customer360-production-observer-provenance-regression.test.mjs'
      - 'tests/dispatch-production-release-from-issue-contract.test.mjs'
      - '.github/workflows/member-production-version-promotion.yml'
      - '.github/workflows/dispatch-member-production-version-promotion-from-issue.yml'
      - 'tests/member-production-version-promotion-contract.test.mjs'
      - 'release/member/member-production-runtime-secret-stage-36285531724.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard Member-only scope and Production safety
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"

          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf 'CHANGED_FILE=%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0

          for path in "${changed[@]}"; do
            case "$path" in
              src/crm-member-*.mjs|src/member-*.mjs|migrations_managed/20260924_member_*.sql|member_tests/*|docs/member-app/*|.github/workflows/member-app-foundation.yml|.github/workflows/member-production-schema-preflight.yml|.github/workflows/dispatch-member-schema-preflight-from-issue.yml|tests/member-production-schema-preflight-contract.test.mjs|.github/workflows/member-production-schema-apply.yml|.github/workflows/dispatch-member-production-schema-apply-from-issue.yml|tests/member-production-schema-apply-contract.test.mjs|.github/workflows/member-production-runtime-readiness.yml|.github/workflows/dispatch-member-production-runtime-readiness-from-issue.yml|tests/member-production-runtime-readiness-contract.test.mjs|.github/workflows/member-production-runtime-secret-stage.yml|.github/workflows/dispatch-member-production-runtime-secret-stage-from-issue.yml|tests/member-production-runtime-secret-stage-contract.test.mjs|.github/workflows/member-production-storage-preflight.yml|.github/workflows/dispatch-member-production-storage-preflight-from-issue.yml|tests/member-production-storage-preflight-contract.test.mjs|.github/workflows/member-production-r2-bucket-digest-index.yml|.github/workflows/dispatch-member-production-r2-bucket-digest-index-from-issue.yml|tests/member-production-r2-bucket-digest-index-contract.test.mjs|.github/workflows/deploy-cloudflare.yml|.github/workflows/dispatch-production-deploy-from-issue.yml|tests/customer360-production-observer-concurrency-isolation.test.mjs|tests/deploy-release-concurrency-isolation.mjs|tests/dispatch-production-release-from-issue-contract.test.mjs|tests/customer360-production-observer-provenance-regression.test.mjs|.github/workflows/member-production-version-promotion.yml|.github/workflows/dispatch-member-production-version-promotion-from-issue.yml|tests/member-production-version-promotion-contract.test.mjs|release/member/member-production-runtime-secret-stage-36285531724.json) ;;
              *) echo "::error::Unexpected Member foundation scope: $path"; exit 1 ;;
            esac
          done

          for migration in migrations_managed/20260924_member_*.sql; do
            test -f "$migration" || continue
            ! grep -E "DROP[[:space:]]+(TABLE|COLUMN)|ALTER[[:space:]]+TABLE[[:space:]]+(customers|customer_reservations|customer_delivery_links)|customer_identity_(sequence|registry)" "$migration"
            ! grep -E "(INSERT[[:space:]]+INTO|UPDATE|DELETE[[:space:]]+FROM)[[:space:]]+(customers|customer_reservations|customer_delivery_links)" "$migration"
          done

          if compgen -G 'src/crm-member-*.mjs' > /dev/null || compgen -G 'src/member-*.mjs' > /dev/null; then
            ! grep -E "(INSERT[[:space:]]+INTO|UPDATE|DELETE[[:space:]]+FROM)[[:space:]]+(customers|customer_reservations|customer_delivery_links)" src/crm-member-*.mjs src/member-*.mjs
          fi

          echo 'MEMBER_SCOPE_GUARD=PASS'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'PRODUCTION_SCHEMA_APPLY=0'
          echo 'CANONICAL_CUSTOMER_WRITE=0'
          echo 'CUSTOMER_ID_GENERATION=0'
          echo 'FAMILY_AUTO_LINK=0'
          echo 'LINE_SEND=0'
          echo 'PRODUCTION_DEPLOY=0'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Member syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/crm-member-*.mjs src/member-*.mjs; do
            test -f "$file" || continue
            node --check "$file"
          done
          echo 'MEMBER_SYNTAX=PASS'

      - name: Member regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find member_tests -maxdepth 1 -type f -name '*.test.mjs' -printf '%p\n' | sort)
          test "${#tests[@]}" -gt 0
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            node "$test_file"
            echo '::endgroup::'
          done
          echo "MEMBER_TEST_FILES=${#tests[@]} PASS"
