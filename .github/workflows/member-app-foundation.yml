name: Member app identity foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/crm-member-family-identity.mjs'
      - 'src/crm-member-line-identity.mjs'
      - 'migrations_managed/20260924_member_family_identity_foundation.sql'
      - 'member_tests/**'
      - 'docs/member-app/**'
      - '.github/workflows/member-app-foundation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact Member scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf 'CHANGED_FILE=%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0

          for path in "${changed[@]}"; do
            case "$path" in
              src/crm-member-family-identity.mjs|              src/crm-member-line-identity.mjs|              migrations_managed/20260924_member_family_identity_foundation.sql|              member_tests/*|              docs/member-app/*|              .github/workflows/member-app-foundation.yml) ;;
              *) echo "::error::Unexpected Member foundation scope: $path"; exit 1 ;;
            esac
          done

          migration='migrations_managed/20260924_member_family_identity_foundation.sql'
          ! grep -E "DROP[[:space:]]+(TABLE|COLUMN)|ALTER[[:space:]]+TABLE[[:space:]]+customers|customer_identity_(sequence|registry)" "$migration"
          ! grep -E "\b(INSERT[[:space:]]+INTO|UPDATE|DELETE[[:space:]]+FROM)[[:space:]]+customers\b" src/crm-member-family-identity.mjs src/crm-member-line-identity.mjs

          echo 'MEMBER_SCOPE_GUARD=PASS'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'PRODUCTION_SCHEMA_APPLY=0'
          echo 'CUSTOMER_WRITE=0'
          echo 'CUSTOMER_ID_GENERATION=0'
          echo 'FAMILY_AUTO_LINK=0'
          echo 'LINE_SEND=0'
          echo 'PRODUCTION_DEPLOY=0'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/crm-member-family-identity.mjs
          node --check src/crm-member-line-identity.mjs
          echo 'MEMBER_SYNTAX=PASS'

      - name: Member identity regressions
        shell: bash
        run: |
          set -euo pipefail
          node member_tests/member-family-identity-foundation.test.mjs
          node member_tests/member-line-identity-foundation.test.mjs
          echo 'MEMBER_IDENTITY_REGRESSION=PASS'
