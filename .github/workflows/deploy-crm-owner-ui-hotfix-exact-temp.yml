name: CRM Owner UI Hotfix Exact Deploy Temp

on:
  push:
    branches:
      - hotfix/crm-production-desktop-layout-owner-fail-20260825
    paths:
      - .github/workflows/deploy-crm-owner-ui-hotfix-exact-temp.yml

permissions:
  contents: read

concurrency:
  group: customer-crm-owner-ui-hotfix-exact-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/hotfix/crm-production-desktop-layout-owner-fail-20260825'
    name: Exact-head validate and deploy UI hotfix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact authorized hotfix SHA
        uses: actions/checkout@v4
        with:
          ref: 18ffc91f7946ec4495fe08202f29120bcd1f1744
          fetch-depth: 0
          persist-credentials: false

      - name: Exact SHA and UI-only scope gate
        shell: bash
        run: |
          set -euo pipefail
          BASE='7c1acdd9a3d3f7eabd1bf70f752abef4bc34b276'
          TARGET='18ffc91f7946ec4495fe08202f29120bcd1f1744'
          PROHIBITED_MAIN='1f77d5ed3ce256a4303119a4c3685a8d978beb59'
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "CHECKOUT_SHA=$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$TARGET"
          test "$ACTUAL_HEAD" != "$PROHIBITED_MAIN"
          test "$(git merge-base "$BASE" "$TARGET")" = "$BASE"
          actual="$(git diff --name-only "$BASE"..."$TARGET" | sort)"
          expected="$(printf '%s\n' \
            'src/production-index-crm-browser-root-entry.js' \
            'tests/customer-production-owner-layout-regression.mjs' | sort)"
          printf 'EFFECTIVE_DIFF_FILES:\n%s\n' "$actual"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected effective diff detected' >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          test -z "$(git diff --name-only "$BASE"..."$TARGET" -- wrangler.jsonc)"
          test -z "$(git diff --name-only "$BASE"..."$TARGET" -- 'migrations/**' 'migrations_managed/**')"
          test -z "$(git diff --name-only "$BASE"..."$TARGET" -- 'src/customer-identity-resolver.mjs' 'src/crm-canonical-customer-guards*' 'src/*identity*' 'src/*sequence*')"
          echo 'IDENTITY_FILE_CHANGE=0'
          echo 'MIGRATION_CHANGE=0'
          echo 'CURRENT_MAIN_DEPLOYED=NO'

      - name: Verify Wrangler entry and syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '"main"[[:space:]]*:[[:space:]]*"src/production-index-crm-browser-root-entry\.js"' wrangler.jsonc
          node --check src/production-index-crm-browser-root-entry.js
          echo 'WRANGLER_MAIN=src/production-index-crm-browser-root-entry.js'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install existing browser runtime
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run owner layout regression
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
        run: |
          set -euo pipefail
          node tests/customer-production-owner-layout-regression.mjs
          echo 'OWNER_LAYOUT_REGRESSION=PASS'

      - name: Confirm Cloudflare authentication
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: whoami

      - name: Deploy exact UI hotfix Worker code only
        id: deploy_worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Read-only postdeploy checks
        shell: bash
        run: |
          set -u
          base='https://customer-crm-api.ohw3rz5578d277e.workers.dev'
          check_endpoint() {
            path="$1"
            label="$2"
            headers="/tmp/${label}.headers"
            body="/tmp/${label}.body"
            code="$(curl -sS --max-time 20 --max-redirs 0 -D "$headers" -o "$body" -w '%{http_code}' "$base$path" || true)"
            ct="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\r",""); print $2; exit}' "$headers" 2>/dev/null || true)"
            loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); gsub("\r",""); print; exit}' "$headers" 2>/dev/null || true)"
            result='FAIL'
            if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
              if grep -Eqi 'cloudflare access|<html|<!doctype html' "$body" 2>/dev/null && [ "$path" = '/health' ]; then
                result='ACCESS_BLOCKED'
              else
                result='PASS'
              fi
            elif [[ "$code" =~ ^3[0-9][0-9]$ ]] || grep -Eqi 'cloudflare access|access.cloudflare.com|<html|<!doctype html' "$body" 2>/dev/null || echo "$loc" | grep -Eqi 'access.cloudflare.com'; then
              result='ACCESS_BLOCKED'
            fi
            echo "POSTDEPLOY_${label^^}=$result"
            echo "POSTDEPLOY_${label^^}_HTTP=$code"
          }
          check_endpoint '/health' 'health'
          check_endpoint '/admin' 'admin'
          echo 'DEPLOY_URL=https://customer-crm-api.ohw3rz5578d277e.workers.dev'

      - name: Safety report
        if: always()
        run: |
          echo 'CURRENT_MAIN_DEPLOYED=NO'
          echo 'D1_MIGRATION=0'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'PRODUCTION_CUSTOMER_WRITE=0'
          echo 'RESERVATION_WRITE=0'
          echo 'LINE_SEND=0'
          echo 'MANUAL_WRANGLER=0'
          echo 'HOTFIX_TO_MAIN_MERGE=0'
          echo 'SECRET_VALUE_READ=0'
