name: CRM Owner UI Layout Temp
on: push
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/hotfix/crm-production-desktop-layout-owner-fail-20260825'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scope gate
        run: |
          set -euo pipefail
          BASE=7c1acdd9a3d3f7eabd1bf70f752abef4bc34b276
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          test "$(grep -Ec 'customer-identity-resolver|canonical-customer-guards|migrations|wrangler' /tmp/changed.txt || true)" -eq 0
          test "$(grep -Evc '^(src/production-index-crm-browser-root-entry\.js|tests/customer-production-owner-layout-regression\.mjs|\.github/workflows/crm-owner-ui-layout-regression-temp\.yml)$' /tmp/changed.txt || true)" -eq 0
          echo IDENTITY_SOURCE_CHANGE=0
          echo MIGRATION_CHANGE=0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Existing UI regression
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
        run: |
          node --check src/production-index-crm-browser-root-entry.js
          node tests/customer-management-ux.mjs
          node tests/customer-reservation-history-order.mjs
          node tests/customer-management-browser.mjs
      - name: Owner layout regression
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
        run: node tests/customer-production-owner-layout-regression.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: customer-production-owner-layout
          path: artifacts/customer-production-owner-layout/
          if-no-files-found: error
          retention-days: 7
      - name: Safety report
        if: always()
        run: |
          echo PRODUCTION_CUSTOMER_WRITE=0
          echo PRODUCTION_D1_WRITE=0
          echo LINE_SEND=0
          echo DEPLOY=0
          echo MERGE=0
          echo MANUAL_WRANGLER=0
          echo SECRET_VALUE_READ=0
