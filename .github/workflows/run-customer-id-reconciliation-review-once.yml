name: Run Customer ID Reconciliation Review Once

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: customer-id-reconciliation-review-production-once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read exact approved candidate sources
        run: |
          set -euo pipefail
          cat >/tmp/res-wrangler.jsonc <<'JSON'
          {"name":"review-seed-read","compatibility_date":"2026-08-17","d1_databases":[{"binding":"RES_DB","database_name":"reservation-app-db","database_id":"507be6dd-7c94-4c84-ae28-81624834f84a"}]}
          JSON
          npx --yes wrangler@4.107.0 d1 execute RES_DB --config /tmp/res-wrangler.jsonc --remote --json --command "SELECT DISTINCT TRIM(customer_id) customer_id,customer_name FROM app_reservations WHERE TRIM(COALESCE(customer_id,''))<>''" >/tmp/res.json
          npx --yes wrangler@4.107.0 d1 execute customer-crm-db --remote --json --command "SELECT customer_id,name FROM customers WHERE TRIM(COALESCE(customer_id,''))<>'' AND COALESCE(deleted_at,'')=''" >/tmp/crm.json
          npx --yes wrangler@4.107.0 d1 execute customer-crm-db --remote --json --command "SELECT reservation_customer_id,crm_candidate_customer_id FROM customer_id_reconciliation_reviews" >/tmp/existing.json
      - name: Seed fixed 20 review pairs only
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          function rows(p){const x=JSON.parse(fs.readFileSync(p,'utf8'));const b=Array.isArray(x)?x[0]:x;if(!b?.success)throw Error('query failed');return b.results||[]}
          const norm=v=>String(v??'').trim().normalize('NFKC').toLowerCase().replace(/[\s　・･.．,，、()（）\[\]［］【】「」『』]/g,'');
          const res=rows('/tmp/res.json'),crm=rows('/tmp/crm.json'),existing=rows('/tmp/existing.json');
          if(existing.length){if(existing.length!==20)throw Error('existing review pair count '+existing.length+' != 20');console.log('Review pairs already fixed at 20; no reseed.');process.exit(0)}
          const active=new Set(crm.map(x=>String(x.customer_id??'').trim())),names=new Map();
          for(const c of crm){const n=norm(c.name);if(!n)continue;if(!names.has(n))names.set(n,[]);names.get(n).push(String(c.customer_id??'').trim())}
          const pairs=new Map();for(const r of res){const x=String(r.customer_id??'').trim();if(!x||active.has(x))continue;const ys=[...new Set(names.get(norm(r.customer_name))||[])].filter(Boolean);if(ys.length===1&&ys[0]!==x)pairs.set(x+'\0'+ys[0],[x,ys[0]])}
          const out=[...pairs.values()];if(out.length!==20)throw Error('approved candidate population changed: '+out.length);
          const q=v=>"'"+String(v).replace(/'/g,"''")+"'";
          fs.writeFileSync('/tmp/seed.sql',out.map(([x,y])=>`INSERT OR IGNORE INTO customer_id_reconciliation_reviews(reservation_customer_id,crm_candidate_customer_id,decision,candidate_source,created_at,updated_at) VALUES(${q(x)},${q(y)},'UNREVIEWED','manual_review_20260817',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);`).join('\n'));
          console.log('Resolved exactly 20 approved pairs; pair values not logged.');
          NODE
          if [ -s /tmp/seed.sql ]; then npx --yes wrangler@4.107.0 d1 execute customer-crm-db --remote --file=/tmp/seed.sql >/dev/null; fi
      - name: Verify review count and no decisions yet
        run: |
          set -euo pipefail
          npx --yes wrangler@4.107.0 d1 execute customer-crm-db --remote --json --command "SELECT COUNT(*) count,SUM(CASE WHEN decision='UNREVIEWED' THEN 1 ELSE 0 END) unreviewed,SUM(CASE WHEN decision<>'UNREVIEWED' THEN 1 ELSE 0 END) decided FROM customer_id_reconciliation_reviews" >/tmp/count.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/count.json','utf8')),r=(Array.isArray(x)?x[0]:x).results?.[0]||{};
          if(Number(r.count)!==20||Number(r.unreviewed)!==20||Number(r.decided)!==0)throw Error('review state mismatch');
          console.log('Review storage verified: total=20, unreviewed=20, decided=0');
          NODE
      - name: Deploy customer-crm-api
        run: npx --yes wrangler@4.107.0 deploy | tee /tmp/deploy.txt
      - name: Verify health and unauthenticated block
        run: |
          set -euo pipefail
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.txt | tail -n1 || true)"; [ -n "$URL" ] || URL="https://customer-crm-api.ohw3rz5578d277e.workers.dev"; URL="${URL%/}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$URL/health" -o /tmp/health.json
          node <<'NODE'
          const fs=require('fs'),h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(h.customer_id_reconciliation_review!==true||h.customer_merge!==false)throw Error('review health safety mismatch');
          if(h.line_context_events_enabled!==true)throw Error('LINE context regression');
          console.log('CRM health + review safety PASS');
          NODE
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$URL/admin/customer-id-reconciliation")"; case "$code" in 401|403) ;; *) echo "review auth failure HTTP $code" >&2; exit 1;; esac
          echo "Unauthenticated review UI blocked: HTTP $code"
