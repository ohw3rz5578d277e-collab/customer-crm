name: CRM credential Reservation D1 cross-read preflight

on:
  push:
    branches:
      - task/crm-reservation-d1-cross-read-preflight-01

permissions:
  contents: read

jobs:
  probe:
    name: Read-only Reservation D1 access with CRM credential
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Confirm Cloudflare authentication
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: whoami

      - name: Read-only Reservation D1 capability check
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 execute reservation-app-db --remote --command "SELECT 1 AS ok;" --json
