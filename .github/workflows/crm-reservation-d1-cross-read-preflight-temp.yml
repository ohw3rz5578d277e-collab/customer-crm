name: Temporary CRM credential Reservation D1 read-only preflight

on:
  pull_request:
    paths:
      - '.github/workflows/crm-reservation-d1-cross-read-preflight-temp.yml'

permissions:
  contents: read

jobs:
  read-only-cross-d1:
    name: Verify CRM credential can read Reservation Production D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Assert probe is read only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const command = 'SELECT 1 AS reservation_d1_cross_read_ok;';
          if (!/^SELECT\s+1\s+AS\s+[A-Za-z0-9_]+;$/i.test(command)) {
            throw new Error('Unexpected probe SQL');
          }
          console.log('READ_ONLY_PROBE_CONTRACT=PASS');
          NODE

      - name: Confirm CRM Cloudflare credential authentication
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: whoami

      - name: Confirm read-only access to Reservation Production D1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute reservation-app-db --remote --command "SELECT 1 AS reservation_d1_cross_read_ok;" --json
