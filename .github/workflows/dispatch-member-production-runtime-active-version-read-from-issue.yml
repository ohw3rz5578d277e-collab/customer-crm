name: Dispatch Member Production runtime active version read from release-gate issue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: member-production-runtime-active-version-read-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate exact Member active-version read command and dispatch
    if: >-
      github.event.issue.number == 26 &&
      github.event.issue.pull_request == null &&
      github.actor == 'ohw3rz5578d277e-collab' &&
      github.event.comment.user.login == 'ohw3rz5578d277e-collab' &&
      startsWith(github.event.comment.body, '/member-runtime-active-version-read ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact Owner command and current main
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
          OWNER_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          command_re='^/member-runtime-active-version-read sha=([0-9a-f]{40}) version=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}) stage_run=([0-9]+) confirm=READ_MEMBER_RUNTIME_ACTIVE_VERSION$'
          if [[ "$COMMAND_BODY" =~ $command_re ]]; then
            expected_sha="${BASH_REMATCH[1]}"
            staged_version_id="${BASH_REMATCH[2]}"
            stage_run_id="${BASH_REMATCH[3]}"
          else
            echo '::error::INVALID_MEMBER_RUNTIME_ACTIVE_VERSION_READ_COMMAND'
            exit 1
          fi
          [[ "$OWNER_COMMENT_ID" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_OWNER_COMMENT_ID'; exit 1; }
          current_sha="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
          )"
          test "$current_sha" = "$expected_sha" || { echo "::error::MAIN_DRIFT expected=$expected_sha current=$current_sha"; exit 1; }
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "staged_version_id=$staged_version_id" >> "$GITHUB_OUTPUT"
          echo "stage_run_id=$stage_run_id" >> "$GITHUB_OUTPUT"
          echo "owner_comment_id=$OWNER_COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "MEMBER_RUNTIME_ACTIVE_VERSION_READ_AUTHORIZED_SHA=$expected_sha"
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_DEPLOY=0'

      - name: Refuse during Production mutation workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in deploy-cloudflare.yml member-production-runtime-version-promotion.yml member-production-runtime-secret-stage.yml member-production-route-stage.yml member-production-version-promotion.yml; do
            for status in queued in_progress; do
              count="$(
                curl --fail --silent --show-error \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$workflow/runs?status=$status&per_page=1" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])'
              )"
              test "$count" = '0' || { echo "::error::PRODUCTION_MUTATION_LOCK_OCCUPIED workflow=$workflow status=$status count=$count"; exit 1; }
            done
          done
          echo 'PRODUCTION_MUTATION_LOCK=FREE'

      - name: Dispatch read-only active version diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          STAGED_VERSION_ID: ${{ steps.gate.outputs.staged_version_id }}
          STAGE_RUN_ID: ${{ steps.gate.outputs.stage_run_id }}
          OWNER_COMMENT_ID: ${{ steps.gate.outputs.owner_comment_id }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({
            'ref':'main',
            'inputs':{
              'expected_sha':os.environ['EXPECTED_SHA'],
              'staged_version_id':os.environ['STAGED_VERSION_ID'],
              'stage_run_id':os.environ['STAGE_RUN_ID'],
              'owner_comment_id':os.environ['OWNER_COMMENT_ID'],
              'bridge_run_id':os.environ['GITHUB_RUN_ID'],
              'bridge_run_attempt':os.environ['GITHUB_RUN_ATTEMPT']
            }
          }))
          PY
          )"
          code="$(
            curl --silent --show-error \
              --output /tmp/member-runtime-active-version-dispatch.txt \
              --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/member-production-runtime-active-version-read.yml/dispatches" \
              -d "$payload"
          )"
          test "$code" = '204' || {
            cat /tmp/member-runtime-active-version-dispatch.txt >&2 || true
            echo "::error::MEMBER_RUNTIME_ACTIVE_VERSION_READ_DISPATCH_FAILED_HTTP_$code"
            exit 1
          }
          rm -f /tmp/member-runtime-active-version-dispatch.txt
          echo "MEMBER_RUNTIME_ACTIVE_VERSION_READ_DISPATCHED_SHA=$EXPECTED_SHA"
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_DEPLOY=0'
