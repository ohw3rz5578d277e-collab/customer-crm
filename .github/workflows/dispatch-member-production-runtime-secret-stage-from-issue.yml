name: Dispatch Member Production runtime secret stage from release-gate issue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: member-production-runtime-secret-stage-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate exact Member runtime secret stage command and dispatch
    if: >-
      github.event.issue.number == 26 &&
      github.event.issue.pull_request == null &&
      github.actor == 'ohw3rz5578d277e-collab' &&
      github.event.comment.user.login == 'ohw3rz5578d277e-collab' &&
      startsWith(github.event.comment.body, '/member-runtime-secret-stage ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact Owner command and current main
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
          OWNER_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          command_re='^/member-runtime-secret-stage sha=([0-9a-f]{40}) readiness_run=([0-9]+) confirm=STAGE_MEMBER_RUNTIME_SECRETS$'
          [[ "$COMMAND_BODY" =~ $command_re ]] || { echo '::error::INVALID_MEMBER_RUNTIME_SECRET_STAGE_COMMAND'; exit 1; }
          expected_sha="${BASH_REMATCH[1]}"
          readiness_run_id="${BASH_REMATCH[2]}"
          current_sha="$(
            curl --fail --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
          )"
          test "$current_sha" = "$expected_sha" || { echo "::error::MAIN_DRIFT expected=$expected_sha current=$current_sha"; exit 1; }
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "readiness_run_id=$readiness_run_id" >> "$GITHUB_OUTPUT"
          echo "owner_comment_id=$OWNER_COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "MEMBER_RUNTIME_SECRET_STAGE_AUTHORIZED_SHA=$expected_sha"
          echo "MEMBER_RUNTIME_SECRET_STAGE_READINESS_RUN_ID=$readiness_run_id"
          echo "MEMBER_RUNTIME_SECRET_STAGE_OWNER_COMMENT_ID=$OWNER_COMMENT_ID"
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'

      - name: Refuse during conflicting Production operations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in deploy-cloudflare.yml member-production-runtime-readiness.yml member-production-runtime-secret-stage.yml; do
            for status in queued in_progress; do
              count="$(
                curl --fail --silent --show-error                   -H "Authorization: Bearer $GH_TOKEN"                   -H 'Accept: application/vnd.github+json'                   -H 'X-GitHub-Api-Version: 2022-11-28'                   "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=$status&per_page=1"                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])'
              )"
              test "$count" = '0' || { echo "::error::MEMBER_RUNTIME_SECRET_STAGE_LOCK_OCCUPIED workflow=$workflow status=$status count=$count"; exit 1; }
            done
          done
          echo 'MEMBER_RUNTIME_SECRET_STAGE_LOCK=FREE'

      - name: Reject instead of queueing behind another Production mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sleep 2
          workflows=(
            dispatch-production-deploy-from-issue.yml
            dispatch-member-schema-apply-from-issue.yml
            dispatch-member-production-runtime-secret-stage-from-issue.yml
            dispatch-member-production-version-promotion-from-issue.yml
            deploy-cloudflare.yml
            member-production-schema-apply.yml
            member-production-runtime-secret-stage.yml
          )
          statuses=(queued in_progress waiting pending requested)
          for workflow in "${workflows[@]}"; do
            for status in "${statuses[@]}"; do
              conflicts="$(
                curl --fail --silent --show-error                   -H "Authorization: Bearer $GH_TOKEN"                   -H 'Accept: application/vnd.github+json'                   -H 'X-GitHub-Api-Version: 2022-11-28'                   "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=$status&per_page=100"                 | python3 -c 'import json,os,sys; me=int(os.environ["THIS_RUN_ID"]); runs=json.load(sys.stdin).get("workflow_runs",[]); print(sum(1 for r in runs if int(r.get("id",0))!=me))'
              )"
              test "$conflicts" = '0' || {
                echo "::error::PRODUCTION_MUTATION_BUSY_RETRY_REQUIRED workflow=$workflow status=$status count=$conflicts"
                exit 1
              }
            done
          done
          echo 'PRODUCTION_MUTATION_DISPATCH_GATE=FREE'
          echo 'PRODUCTION_MUTATION_QUEUE_POLICY=REJECT_AND_RETRY'

      - name: Dispatch stage-only workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          READINESS_RUN_ID: ${{ steps.gate.outputs.readiness_run_id }}
          OWNER_COMMENT_ID: ${{ steps.gate.outputs.owner_comment_id }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'ref':'main',
            'inputs':{
              'expected_sha':os.environ['EXPECTED_SHA'],
              'readiness_run_id':os.environ['READINESS_RUN_ID'],
              'owner_comment_id':os.environ['OWNER_COMMENT_ID'],
              'confirmation':'STAGE_MEMBER_RUNTIME_SECRETS'
            }
          }))
          PY
          )"
          code="$(
            curl --silent --show-error               --output /tmp/member-runtime-secret-stage-dispatch.txt               --write-out '%{http_code}'               --request POST               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/member-production-runtime-secret-stage.yml/dispatches"               -d "$payload"
          )"
          test "$code" = '204' || {
            cat /tmp/member-runtime-secret-stage-dispatch.txt >&2 || true
            echo "::error::MEMBER_RUNTIME_SECRET_STAGE_DISPATCH_FAILED_HTTP_$code"
            exit 1
          }
          echo "MEMBER_RUNTIME_SECRET_STAGE_DISPATCHED_SHA=$EXPECTED_SHA"
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_D1_WRITE=0'
