name: Member Production storage binding preflight

on:
  pull_request:
    paths:
      - '.github/workflows/member-production-storage-preflight.yml'
      - '.github/workflows/dispatch-member-production-storage-preflight-from-issue.yml'
      - 'tests/member-production-storage-preflight-contract.test.mjs'
      - 'docs/member-app/member-production-storage-preflight.md'
      - '.github/workflows/member-app-foundation.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA to inspect read-only
        required: true
        type: string
      mode:
        description: Inventory account R2 buckets or verify one explicit candidate
        required: true
        type: choice
        options:
          - inventory
          - verify
      candidate_bucket_name:
        description: Exact candidate bucket name; required only for verify mode
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('member-production-storage-preflight-pr-{0}', github.event.pull_request.number) || format('member-production-storage-preflight-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  contract:
    name: Member Production storage preflight contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Verify workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" .github/workflows/member-production-storage-preflight.yml
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" .github/workflows/dispatch-member-production-storage-preflight-from-issue.yml
          echo 'MEMBER_STORAGE_PREFLIGHT_WORKFLOW_YAML=PASS'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify read-only storage preflight contract
        run: node tests/member-production-storage-preflight-contract.test.mjs

  preflight:
    name: Exact-SHA read-only Member Production storage preflight
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA_RAW: ${{ inputs.expected_sha }}
      MODE_RAW: ${{ inputs.mode }}
      CANDIDATE_BUCKET_NAME_RAW: ${{ inputs.candidate_bucket_name }}
    steps:
      - name: Normalize and validate read-only inputs
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(printf '%s' "$EXPECTED_SHA_RAW" | tr '[:upper:]' '[:lower:]')"
          mode="$(printf '%s' "$MODE_RAW" | tr '[:upper:]' '[:lower:]')"
          candidate="$CANDIDATE_BUCKET_NAME_RAW"

          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::INVALID_EXPECTED_SHA'; exit 1; }
          [[ "$mode" == 'inventory' || "$mode" == 'verify' ]] || { echo '::error::INVALID_STORAGE_PREFLIGHT_MODE'; exit 1; }

          if [[ "$mode" == 'inventory' ]]; then
            test -z "$candidate" || { echo '::error::INVENTORY_MODE_FORBIDS_CANDIDATE_BUCKET'; exit 1; }
          else
            [[ "$candidate" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || { echo '::error::INVALID_CANDIDATE_BUCKET_NAME'; exit 1; }
          fi

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "candidate_bucket_name=$candidate" >> "$GITHUB_OUTPUT"
          echo "MEMBER_STORAGE_PREFLIGHT_SHA=$expected_sha"
          echo "MEMBER_STORAGE_PREFLIGHT_MODE=$mode"
          echo 'PRODUCTION_STORAGE_BINDING_CHANGE=0'
          echo 'PRODUCTION_STORAGE_FETCH=0'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_WRITE=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_D1_WRITE=0'

      - name: Checkout exact inspected SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Exact current-main gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA" || { echo "::error::CHECKOUT_SHA_MISMATCH actual=$actual_sha expected=$EXPECTED_SHA"; exit 1; }
          test "$current_main" = "$EXPECTED_SHA" || { echo "::error::MAIN_DRIFT current=$current_main expected=$EXPECTED_SHA"; exit 1; }
          echo 'CURRENT_MAIN_EXACT_GATE=PASS'

      - name: Verify canonical Member storage wiring remains default-off
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const entry=fs.readFileSync('src/production-index-crm-customer360-entry.js','utf8');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(!entry.includes('const MEMBER_PRODUCTION_OWNER_APPROVED=false;'))throw new Error('MEMBER_OWNER_FLAG_NOT_DEFAULT_OFF');
          if(!entry.includes('public_asset_adapter:null'))throw new Error('PUBLIC_ASSET_ADAPTER_NOT_DEFAULT_NULL');
          if(!entry.includes('private_media_storage_adapter:null'))throw new Error('PRIVATE_MEDIA_ADAPTER_NOT_DEFAULT_NULL');
          if(String(cfg?.vars?.MEMBER_PRODUCTION_ROUTE_MODE||'').trim().toLowerCase()==='enabled')throw new Error('MEMBER_PRODUCTION_ROUTE_MODE_ENABLED');
          if(String(cfg?.vars?.MEMBER_PRIVATE_MEDIA_CONTENT_ROUTE_MODE||'').trim().toLowerCase()==='enabled')throw new Error('PRIVATE_MEDIA_ROUTE_MODE_ENABLED');
          if(Array.isArray(cfg?.r2_buckets)&&cfg.r2_buckets.length)throw new Error('CANONICAL_R2_BINDING_ALREADY_DECLARED');
          console.log('MEMBER_CANONICAL_STORAGE_DEFAULT_OFF=PASS');
          console.log('CANONICAL_R2_BINDING_DECLARED=NO');
          NODE

      - name: Install pinned Wrangler tooling
        run: npm install --no-save wrangler@4.131.2

      - name: Confirm Cloudflare authentication
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler whoami >/tmp/member-storage-preflight-whoami.txt
          test -s /tmp/member-storage-preflight-whoami.txt
          rm -f /tmp/member-storage-preflight-whoami.txt
          echo 'CLOUDFLARE_AUTH=PASS'

      - name: Snapshot exact active Production version before inventory
        id: active_before
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-storage-deployment-before.json
          active_version_id="$(node - /tmp/member-storage-deployment-before.json <<'NODE'
          const fs=require('fs');
          const value=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const d=Array.isArray(value)?value[0]:value;
          const active=(d?.versions||[]).filter(v=>Number(v.percentage)===100);
          if(active.length!==1||typeof active[0].version_id!=='string')process.exit(2);
          process.stdout.write(active[0].version_id.toLowerCase());
          NODE
          )" || { echo '::error::CURRENT_ACTIVE_PRODUCTION_VERSION_UNAVAILABLE'; exit 1; }
          [[ "$active_version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo '::error::INVALID_CURRENT_ACTIVE_VERSION_ID'; exit 1; }
          echo "active_version_id=$active_version_id" >> "$GITHUB_OUTPUT"
          echo "ACTIVE_PRODUCTION_VERSION_BEFORE=$active_version_id"

      - name: Read account R2 bucket inventory without object access
        id: inventory
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ steps.gate.outputs.mode }}
          CANDIDATE_BUCKET_NAME: ${{ steps.gate.outputs.candidate_bucket_name }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN_MISSING'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID_MISSING'; exit 1; }

          code="$(curl --silent --show-error \
            --output /tmp/member-storage-r2-buckets.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets?per_page=1000&order=name&direction=asc")"
          test "$code" = '200' || {
            echo "::error::R2_BUCKET_INVENTORY_HTTP_$code"
            exit 1
          }

          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/member-storage-r2-buckets.json','utf8'));
          if(payload?.success!==true)throw new Error('R2_BUCKET_INVENTORY_API_NOT_SUCCESS');
          const buckets=Array.isArray(payload?.result?.buckets)?payload.result.buckets:[];
          const cursor=String(payload?.result_info?.cursor||'');
          if(cursor)throw new Error('R2_BUCKET_INVENTORY_PAGINATION_UNSUPPORTED');
          const names=buckets.map(b=>String(b?.name||'')).filter(Boolean);
          if(new Set(names).size!==names.length)throw new Error('R2_BUCKET_INVENTORY_DUPLICATE_NAME');
          const sorted=[...names].sort();
          const digest=crypto.createHash('sha256').update(sorted.join('\n')).digest('hex');
          const mode=process.env.MODE;
          const candidate=process.env.CANDIDATE_BUCKET_NAME||'';
          console.log('R2_BUCKET_INVENTORY_COUNT='+sorted.length);
          console.log('R2_BUCKET_INVENTORY_SHA256='+digest);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'bucket_count='+sorted.length+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'inventory_sha256='+digest+'\n');
          if(mode==='verify'){
            const found=buckets.find(b=>String(b?.name||'')===candidate);
            if(!found)throw new Error('CANDIDATE_R2_BUCKET_NOT_FOUND');
            const candidateDigest=crypto.createHash('sha256').update(candidate).digest('hex');
            console.log('CANDIDATE_R2_BUCKET_EXISTS=PASS');
            console.log('CANDIDATE_R2_BUCKET_NAME_SHA256='+candidateDigest);
            console.log('CANDIDATE_R2_BUCKET_JURISDICTION='+String(found?.jurisdiction||'unspecified'));
            console.log('CANDIDATE_R2_BUCKET_LOCATION='+String(found?.location||'unspecified'));
            console.log('CANDIDATE_R2_BUCKET_STORAGE_CLASS='+String(found?.storage_class||'unspecified'));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'candidate_sha256='+candidateDigest+'\n');
          }else{
            console.log('CANDIDATE_R2_BUCKET_EXISTS=NOT_REQUESTED');
          }
          NODE

          rm -f /tmp/member-storage-r2-buckets.json
          echo 'R2_BUCKET_INVENTORY=PASS'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_WRITE=0'
          echo 'PRODUCTION_STORAGE_FETCH=0'

      - name: Verify active Production version and main did not drift
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          ACTIVE_BEFORE: ${{ steps.active_before.outputs.active_version_id }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-storage-deployment-after.json
          active_after="$(node - /tmp/member-storage-deployment-after.json <<'NODE'
          const fs=require('fs');
          const value=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const d=Array.isArray(value)?value[0]:value;
          const active=(d?.versions||[]).filter(v=>Number(v.percentage)===100);
          if(active.length!==1||typeof active[0].version_id!=='string')process.exit(2);
          process.stdout.write(active[0].version_id.toLowerCase());
          NODE
          )" || { echo '::error::ACTIVE_VERSION_AFTER_INVENTORY_UNAVAILABLE'; exit 1; }
          test "$active_after" = "$ACTIVE_BEFORE" || { echo "::error::ACTIVE_PRODUCTION_VERSION_DRIFT before=$ACTIVE_BEFORE after=$active_after"; exit 1; }
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$EXPECTED_SHA" || { echo "::error::MAIN_DRIFT_AFTER_INVENTORY expected=$EXPECTED_SHA current=$current_main"; exit 1; }
          echo "ACTIVE_PRODUCTION_VERSION_AFTER=$active_after"
          echo 'ACTIVE_PRODUCTION_VERSION_STABLE=PASS'
          echo 'CURRENT_MAIN_STABLE=PASS'
          rm -f /tmp/member-storage-deployment-before.json /tmp/member-storage-deployment-after.json

      - name: Summarize read-only evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          MODE: ${{ steps.gate.outputs.mode }}
          ACTIVE_VERSION: ${{ steps.active_before.outputs.active_version_id }}
          BUCKET_COUNT: ${{ steps.inventory.outputs.bucket_count }}
          INVENTORY_SHA256: ${{ steps.inventory.outputs.inventory_sha256 }}
          CANDIDATE_SHA256: ${{ steps.inventory.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          {
            echo '## Member Production storage read-only preflight'
            echo
            echo "- CURRENT_MAIN_SHA=$EXPECTED_SHA"
            echo "- MODE=$MODE"
            echo "- ACTIVE_PRODUCTION_VERSION=$ACTIVE_VERSION"
            echo "- R2_BUCKET_COUNT=$BUCKET_COUNT"
            echo "- R2_BUCKET_INVENTORY_SHA256=$INVENTORY_SHA256"
            if [[ "$MODE" == 'verify' ]]; then
              echo "- CANDIDATE_R2_BUCKET_NAME_SHA256=$CANDIDATE_SHA256"
              echo '- CANDIDATE_R2_BUCKET_EXISTS=PASS'
            fi
            echo '- PRODUCTION_STORAGE_BINDING_CHANGE=0'
            echo '- PRODUCTION_STORAGE_FETCH=0'
            echo '- R2_OBJECT_READ=0'
            echo '- R2_WRITE=0'
            echo '- MEMBER_ROUTE_ACTIVATION=0'
            echo '- PRODUCTION_DEPLOY=0'
            echo '- PRODUCTION_TRAFFIC_CHANGE=0'
            echo '- PRODUCTION_D1_WRITE=0'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'MEMBER_PRODUCTION_STORAGE_PREFLIGHT=PASS'
