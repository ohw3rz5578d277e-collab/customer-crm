name: Member Production storage binding preflight

on:
  pull_request:
    paths:
      - '.github/workflows/member-production-storage-preflight.yml'
      - '.github/workflows/dispatch-member-production-storage-preflight-from-issue.yml'
      - 'tests/member-production-storage-preflight-contract.test.mjs'
      - 'docs/member-app/member-production-storage-preflight.md'
      - '.github/workflows/member-app-foundation.yml'
      - 'src/production-index-crm-customer360-entry.js'
      - 'src/member-production-storage-adapter.mjs'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA to inspect read-only
        required: true
        type: string
      mode:
        description: Inventory account R2 buckets or verify one explicit candidate digest
        required: true
        type: choice
        options:
          - inventory
          - verify
      jurisdictions:
        description: Explicit canonical comma-separated jurisdiction subset (default,eu,us,fedramp,fedramp-high)
        required: true
        type: string
      candidate_bucket_sha256:
        description: SHA-256 of exact candidate bucket name; required only for verify mode
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('member-production-storage-preflight-pr-{0}', github.event.pull_request.number) || format('member-production-storage-preflight-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  contract:
    name: Member Production storage preflight contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Verify workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" .github/workflows/member-production-storage-preflight.yml
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" .github/workflows/dispatch-member-production-storage-preflight-from-issue.yml
          echo 'MEMBER_STORAGE_PREFLIGHT_WORKFLOW_YAML=PASS'

      - name: Verify R2 auth and inventory shell syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; y=YAML.load_file(ARGV[0]); steps=y.fetch("jobs").fetch("preflight").fetch("steps"); %w[Verify\ dedicated\ R2\ REST\ API\ token Read\ Owner-authorized\ R2\ jurisdiction\ inventory\ without\ object\ access].each_with_index { |name,i| s=steps.find { |step| step["name"] == name }; abort "R2_STEP_NOT_FOUND:#{name}" unless s; File.write("/tmp/member-storage-r2-step-#{i}.sh", s.fetch("run")) }' .github/workflows/member-production-storage-preflight.yml
          bash -n /tmp/member-storage-r2-step-0.sh
          bash -n /tmp/member-storage-r2-step-1.sh
          rm -f /tmp/member-storage-r2-step-0.sh /tmp/member-storage-r2-step-1.sh
          echo 'MEMBER_STORAGE_PREFLIGHT_R2_SHELL_SYNTAX=PASS'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify read-only storage preflight contract
        run: node tests/member-production-storage-preflight-contract.test.mjs

  preflight:
    name: Exact-SHA read-only Member Production storage preflight
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA_RAW: ${{ inputs.expected_sha }}
      MODE_RAW: ${{ inputs.mode }}
      JURISDICTIONS_RAW: ${{ inputs.jurisdictions }}
      CANDIDATE_BUCKET_SHA256_RAW: ${{ inputs.candidate_bucket_sha256 }}
    steps:
      - name: Normalize and validate read-only inputs
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(printf '%s' "$EXPECTED_SHA_RAW" | tr '[:upper:]' '[:lower:]')"
          mode="$(printf '%s' "$MODE_RAW" | tr '[:upper:]' '[:lower:]')"
          jurisdictions="$JURISDICTIONS_RAW"
          candidate_sha256="$(printf '%s' "$CANDIDATE_BUCKET_SHA256_RAW" | tr '[:upper:]' '[:lower:]')"

          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::INVALID_EXPECTED_SHA'; exit 1; }
          [[ "$mode" == 'inventory' || "$mode" == 'verify' ]] || { echo '::error::INVALID_STORAGE_PREFLIGHT_MODE'; exit 1; }
          test -n "$jurisdictions" || { echo '::error::R2_JURISDICTIONS_REQUIRED'; exit 1; }
          [[ "$jurisdictions" != *[[:space:]]* ]] || { echo '::error::R2_JURISDICTIONS_WHITESPACE_FORBIDDEN'; exit 1; }
          lowercase_jurisdictions="$(printf '%s' "$jurisdictions" | tr '[:upper:]' '[:lower:]')"
          test "$jurisdictions" = "$lowercase_jurisdictions" || { echo '::error::R2_JURISDICTIONS_CASE_NOT_CANONICAL'; exit 1; }
          [[ "$jurisdictions" =~ ^(default|eu|us|fedramp|fedramp-high)(,(default|eu|us|fedramp|fedramp-high))*$ ]] || { echo '::error::INVALID_R2_JURISDICTIONS_FORMAT'; exit 1; }

          IFS=',' read -r -a jurisdiction_parts <<< "$jurisdictions"
          test "${#jurisdiction_parts[@]}" -ge 1 || { echo '::error::R2_JURISDICTIONS_REQUIRED'; exit 1; }
          last_index=-1
          declare -A seen=()
          for jurisdiction in "${jurisdiction_parts[@]}"; do
            case "$jurisdiction" in
              default) index=0 ;;
              eu) index=1 ;;
              us) index=2 ;;
              fedramp) index=3 ;;
              fedramp-high) index=4 ;;
              *) echo '::error::INVALID_R2_JURISDICTION'; exit 1 ;;
            esac
            [[ -z "${seen[$jurisdiction]:-}" ]] || { echo '::error::DUPLICATE_R2_JURISDICTION'; exit 1; }
            (( index > last_index )) || { echo '::error::R2_JURISDICTIONS_NOT_CANONICAL_ORDER'; exit 1; }
            seen[$jurisdiction]=1
            last_index=$index
          done
          rejoined_jurisdictions="$(IFS=,; printf '%s' "${jurisdiction_parts[*]}")"
          test "$rejoined_jurisdictions" = "$jurisdictions" || { echo '::error::R2_JURISDICTIONS_REJOIN_MISMATCH'; exit 1; }

          if [[ "$mode" == 'inventory' ]]; then
            test -z "$candidate_sha256" || { echo '::error::INVENTORY_MODE_FORBIDS_CANDIDATE_BUCKET_DIGEST'; exit 1; }
          else
            [[ "$candidate_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::INVALID_CANDIDATE_BUCKET_SHA256'; exit 1; }
          fi

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "jurisdictions=$jurisdictions" >> "$GITHUB_OUTPUT"
          echo "candidate_bucket_sha256=$candidate_sha256" >> "$GITHUB_OUTPUT"
          echo "MEMBER_STORAGE_PREFLIGHT_SHA=$expected_sha"
          echo "MEMBER_STORAGE_PREFLIGHT_MODE=$mode"
          echo "R2_JURISDICTIONS_AUTHORIZED=$jurisdictions"
          echo 'PRODUCTION_STORAGE_BINDING_CHANGE=0'
          echo 'PRODUCTION_STORAGE_FETCH=0'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_WRITE=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_D1_WRITE=0'

      - name: Checkout exact inspected SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Exact current-main gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA" || { echo "::error::CHECKOUT_SHA_MISMATCH actual=$actual_sha expected=$EXPECTED_SHA"; exit 1; }
          test "$current_main" = "$EXPECTED_SHA" || { echo "::error::MAIN_DRIFT current=$current_main expected=$EXPECTED_SHA"; exit 1; }
          echo 'CURRENT_MAIN_EXACT_GATE=PASS'

      - name: Verify canonical Member storage wiring remains default-off
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const entry=fs.readFileSync('src/production-index-crm-customer360-entry.js','utf8');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const storageImport="import { createMemberPrivateMediaStorageAdapter } from './member-production-storage-adapter.mjs';";
          const privateWiring='private_media_storage_adapter:createMemberPrivateMediaStorageAdapter(env?.MEMBER_PRIVATE_MEDIA_BUCKET)';
          if(!entry.includes('const MEMBER_PRODUCTION_OWNER_APPROVED=false;'))throw new Error('MEMBER_OWNER_FLAG_NOT_DEFAULT_OFF');
          if(!entry.includes('public_asset_adapter:null'))throw new Error('PUBLIC_ASSET_ADAPTER_NOT_DEFAULT_NULL');
          if(!entry.includes(storageImport))throw new Error('PRIVATE_MEDIA_ADAPTER_IMPORT_MISSING');
          if(!entry.includes(privateWiring))throw new Error('PRIVATE_MEDIA_RUNTIME_WIRING_MISSING');
          if(entry.includes('private_media_storage_adapter:null'))throw new Error('PRIVATE_MEDIA_RUNTIME_WIRING_REGRESSED_TO_NULL');
          if(entry.includes('customer-crm-member-private-media'))throw new Error('PRIVATE_MEDIA_BUCKET_NAME_HARDCODED_IN_RUNTIME');
          if((entry.match(/MEMBER_PRIVATE_MEDIA_BUCKET/g)||[]).length!==1)throw new Error('CANONICAL_PRIVATE_MEDIA_BINDING_REFERENCE_COUNT_INVALID');
          if(String(cfg?.vars?.MEMBER_PRODUCTION_ROUTE_MODE||'').trim().toLowerCase()==='enabled')throw new Error('MEMBER_PRODUCTION_ROUTE_MODE_ENABLED');
          if(String(cfg?.vars?.MEMBER_PRIVATE_MEDIA_CONTENT_ROUTE_MODE||'').trim().toLowerCase()==='enabled')throw new Error('PRIVATE_MEDIA_ROUTE_MODE_ENABLED');
          const bindings=Array.isArray(cfg?.r2_buckets)?cfg.r2_buckets:[];
          if(bindings.length!==1)throw new Error('CANONICAL_R2_BINDING_COUNT_INVALID');
          const binding=bindings[0]||{};
          if(binding.binding!=='MEMBER_PRIVATE_MEDIA_BUCKET')throw new Error('CANONICAL_R2_BINDING_NAME_MISMATCH');
          if(binding.bucket_name!=='customer-crm-member-private-media')throw new Error('CANONICAL_R2_BUCKET_NAME_MISMATCH');
          const allowedBindingKeys=new Set(['binding','bucket_name']);
          if(Object.keys(binding).some(key=>!allowedBindingKeys.has(key)))throw new Error('CANONICAL_R2_BINDING_UNEXPECTED_CONFIGURATION');
          for(const [envName,scope] of Object.entries(cfg?.env||{})){
            if(Array.isArray(scope?.r2_buckets)&&scope.r2_buckets.length)throw new Error('NONCANONICAL_ENV_R2_BINDING_DECLARED:'+envName);
          }
          console.log('MEMBER_CANONICAL_STORAGE_DEFAULT_OFF=PASS');
          console.log('CANONICAL_R2_BINDING_DECLARED=PASS');
          console.log('CANONICAL_R2_BINDING_EXACT=PASS');
          console.log('PRIVATE_MEDIA_RUNTIME_WIRING=SOURCE_ONLY_PASS');
          console.log('PRODUCTION_STORAGE_FETCH=0');
          NODE

      - name: Install pinned Wrangler tooling
        run: npm install --no-save wrangler@4.131.2

      - name: Confirm Worker-management Cloudflare authentication
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler whoami >/tmp/member-storage-preflight-whoami.txt
          test -s /tmp/member-storage-preflight-whoami.txt
          rm -f /tmp/member-storage-preflight-whoami.txt
          echo 'CLOUDFLARE_WORKER_AUTH=PASS'

      - name: Snapshot exact active Production version before inventory
        id: active_before
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-storage-deployment-before.json
          active_version_id="$(node - /tmp/member-storage-deployment-before.json <<'NODE'
          const fs=require('fs');
          const value=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const d=Array.isArray(value)?value[0]:value;
          const active=(d?.versions||[]).filter(v=>Number(v.percentage)===100);
          if(active.length!==1||typeof active[0].version_id!=='string')process.exit(2);
          process.stdout.write(active[0].version_id.toLowerCase());
          NODE
          )" || { echo '::error::CURRENT_ACTIVE_PRODUCTION_VERSION_UNAVAILABLE'; exit 1; }
          [[ "$active_version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo '::error::INVALID_CURRENT_ACTIVE_VERSION_ID'; exit 1; }
          echo "active_version_id=$active_version_id" >> "$GITHUB_OUTPUT"
          echo "ACTIVE_PRODUCTION_VERSION_BEFORE=$active_version_id"

      - name: Verify dedicated R2 REST API token
        id: r2_auth
        shell: bash
        env:
          CLOUDFLARE_R2_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_R2_READ_API_TOKEN" || { echo '::error::CLOUDFLARE_R2_READ_API_TOKEN_MISSING'; exit 1; }
          [[ "$CLOUDFLARE_R2_READ_API_TOKEN" != *[[:space:]]* ]] || { echo '::error::R2_READ_REST_TOKEN_FORMAT_INVALID_WHITESPACE'; exit 1; }
          verify_file=/tmp/member-storage-r2-token-verify.json
          code="$(curl --silent --show-error \
            --output "$verify_file" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_R2_READ_API_TOKEN" \
            -H 'Accept: application/json' \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          if [[ "$code" != '200' ]]; then
            error_codes="$(node -e 'const fs=require("fs"); try { const payload=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const values=(Array.isArray(payload?.errors)?payload.errors:[]).map(value=>String(value?.code??"")).filter(value=>/^\d+$/.test(value)); process.stdout.write(values.length?[...new Set(values)].join(","):"unknown"); } catch { process.stdout.write("unparseable"); }' "$verify_file")"
            rm -f "$verify_file"
            echo "::error::R2_READ_REST_TOKEN_VERIFY_HTTP_${code}_CF_CODES_${error_codes}"
            exit 1
          fi
          verify_state="$(node - "$verify_file" <<'NODE'
          const fs=require('fs');
          try {
            const payload=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            if(payload?.success!==true){process.stdout.write('API_NOT_SUCCESS');process.exit(0);}
            if(String(payload?.result?.status||'')!=='active'){process.stdout.write('NOT_ACTIVE');process.exit(0);}
            process.stdout.write('PASS');
          } catch {
            process.stdout.write('JSON_INVALID');
          }
          NODE
          )"
          rm -f "$verify_file"
          case "$verify_state" in
            PASS) ;;
            API_NOT_SUCCESS) echo '::error::R2_READ_REST_TOKEN_VERIFY_API_NOT_SUCCESS'; exit 1 ;;
            NOT_ACTIVE) echo '::error::R2_READ_REST_TOKEN_NOT_ACTIVE'; exit 1 ;;
            JSON_INVALID) echo '::error::R2_READ_REST_TOKEN_VERIFY_JSON_INVALID'; exit 1 ;;
            *) echo '::error::R2_READ_REST_TOKEN_VERIFY_STATE_INVALID'; exit 1 ;;
          esac
          echo 'R2_READ_REST_TOKEN_AUTH=PASS'
          echo 'R2_READ_REST_TOKEN_VALUE_PRINTED=NO'

      - name: Read Owner-authorized R2 jurisdiction inventory without object access
        id: inventory
        shell: bash
        env:
          CLOUDFLARE_R2_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ steps.gate.outputs.mode }}
          JURISDICTIONS: ${{ steps.gate.outputs.jurisdictions }}
          CANDIDATE_BUCKET_SHA256: ${{ steps.gate.outputs.candidate_bucket_sha256 }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_R2_READ_API_TOKEN" || { echo '::error::CLOUDFLARE_R2_READ_API_TOKEN_MISSING'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID_MISSING'; exit 1; }
          test -n "$JURISDICTIONS" || { echo '::error::R2_JURISDICTIONS_REQUIRED'; exit 1; }

          IFS=',' read -r -a jurisdictions <<< "$JURISDICTIONS"
          rm -f /tmp/member-storage-r2-buckets-*.json
          cleanup(){ rm -f /tmp/member-storage-r2-buckets-*.json; }
          trap cleanup EXIT
          for jurisdiction in "${jurisdictions[@]}"; do
            response_file="/tmp/member-storage-r2-buckets-$jurisdiction.json"
            code="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_R2_READ_API_TOKEN" \
              -H 'Content-Type: application/json' \
              -H "cf-r2-jurisdiction: $jurisdiction" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets?per_page=1000&order=name&direction=asc")"
            if [[ "$code" != '200' ]]; then
              error_codes="$(node -e 'const fs=require("fs"); try { const payload=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const values=(Array.isArray(payload?.errors)?payload.errors:[]).map(value=>String(value?.code??"")).filter(value=>/^\d+$/.test(value)); process.stdout.write(values.length?[...new Set(values)].join(","):"unknown"); } catch { process.stdout.write("unparseable"); }' "$response_file")"
              rm -f "$response_file"
              echo "::error::R2_BUCKET_INVENTORY_HTTP_${jurisdiction}_${code}_CF_CODES_${error_codes}"
              exit 1
            fi
          done

          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const jurisdictions=String(process.env.JURISDICTIONS||'').split(',');
          if(!jurisdictions.length)throw new Error('R2_JURISDICTIONS_REQUIRED');
          const records=[];
          const sha256=value=>crypto.createHash('sha256').update(value).digest('hex');
          for(const jurisdiction of jurisdictions){
            const path=`/tmp/member-storage-r2-buckets-${jurisdiction}.json`;
            const payload=JSON.parse(fs.readFileSync(path,'utf8'));
            if(payload?.success!==true)throw new Error('R2_BUCKET_INVENTORY_API_NOT_SUCCESS:'+jurisdiction);
            const cursor=String(payload?.result_info?.cursor||'');
            if(cursor)throw new Error('R2_BUCKET_INVENTORY_PAGINATION_UNSUPPORTED:'+jurisdiction);
            const buckets=Array.isArray(payload?.result?.buckets)?payload.result.buckets:[];
            for(const bucket of buckets){
              const name=String(bucket?.name||'');
              if(!name)continue;
              records.push({
                name,
                name_sha256:sha256(name),
                observed_jurisdiction:jurisdiction,
                jurisdiction:String(bucket?.jurisdiction||jurisdiction),
                location:String(bucket?.location||'unspecified'),
                storage_class:String(bucket?.storage_class||'unspecified')
              });
            }
          }
          const keys=records.map(r=>r.observed_jurisdiction+':'+r.name);
          if(new Set(keys).size!==keys.length)throw new Error('R2_BUCKET_INVENTORY_DUPLICATE_JURISDICTION_NAME');
          const sorted=[...keys].sort();
          const digest=sha256(sorted.join('\n'));
          const mode=process.env.MODE;
          const candidateDigest=(process.env.CANDIDATE_BUCKET_SHA256||'').toLowerCase();
          console.log('R2_JURISDICTIONS_SCANNED='+jurisdictions.join(','));
          console.log('R2_BUCKET_INVENTORY_COUNT='+sorted.length);
          console.log('R2_BUCKET_INVENTORY_SHA256='+digest);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'bucket_count='+sorted.length+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'inventory_sha256='+digest+'\n');
          if(mode==='verify'){
            const found=records.filter(r=>r.name_sha256===candidateDigest);
            if(found.length===0)throw new Error('CANDIDATE_R2_BUCKET_DIGEST_NOT_FOUND');
            if(found.length!==1)throw new Error('CANDIDATE_R2_BUCKET_DIGEST_NOT_UNIQUE_ACROSS_JURISDICTIONS');
            console.log('CANDIDATE_R2_BUCKET_EXISTS=PASS');
            console.log('CANDIDATE_R2_BUCKET_NAME_SHA256='+candidateDigest);
            console.log('CANDIDATE_R2_BUCKET_OBSERVED_JURISDICTION='+found[0].observed_jurisdiction);
            console.log('CANDIDATE_R2_BUCKET_JURISDICTION='+found[0].jurisdiction);
            console.log('CANDIDATE_R2_BUCKET_LOCATION='+found[0].location);
            console.log('CANDIDATE_R2_BUCKET_STORAGE_CLASS='+found[0].storage_class);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'candidate_sha256='+candidateDigest+'\n');
          }else{
            console.log('CANDIDATE_R2_BUCKET_EXISTS=NOT_REQUESTED');
          }
          NODE

          cleanup
          trap - EXIT
          echo 'R2_BUCKET_INVENTORY=PASS'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_WRITE=0'
          echo 'PRODUCTION_STORAGE_FETCH=0'

      - name: Verify active Production version and main did not drift
        if: ${{ always() && steps.active_before.outcome == 'success' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          ACTIVE_BEFORE: ${{ steps.active_before.outputs.active_version_id }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-storage-deployment-after.json
          active_after="$(node - /tmp/member-storage-deployment-after.json <<'NODE'
          const fs=require('fs');
          const value=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const d=Array.isArray(value)?value[0]:value;
          const active=(d?.versions||[]).filter(v=>Number(v.percentage)===100);
          if(active.length!==1||typeof active[0].version_id!=='string')process.exit(2);
          process.stdout.write(active[0].version_id.toLowerCase());
          NODE
          )" || { echo '::error::ACTIVE_VERSION_AFTER_INVENTORY_UNAVAILABLE'; exit 1; }
          test "$active_after" = "$ACTIVE_BEFORE" || { echo "::error::ACTIVE_PRODUCTION_VERSION_DRIFT before=$ACTIVE_BEFORE after=$active_after"; exit 1; }
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$EXPECTED_SHA" || { echo "::error::MAIN_DRIFT_AFTER_INVENTORY expected=$EXPECTED_SHA current=$current_main"; exit 1; }
          echo "ACTIVE_PRODUCTION_VERSION_AFTER=$active_after"
          echo 'ACTIVE_PRODUCTION_VERSION_STABLE=PASS'
          echo 'CURRENT_MAIN_STABLE=PASS'
          rm -f /tmp/member-storage-deployment-before.json /tmp/member-storage-deployment-after.json

      - name: Summarize read-only evidence
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          MODE: ${{ steps.gate.outputs.mode }}
          JURISDICTIONS: ${{ steps.gate.outputs.jurisdictions }}
          ACTIVE_VERSION: ${{ steps.active_before.outputs.active_version_id }}
          R2_AUTH_OUTCOME: ${{ steps.r2_auth.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          BUCKET_COUNT: ${{ steps.inventory.outputs.bucket_count }}
          INVENTORY_SHA256: ${{ steps.inventory.outputs.inventory_sha256 }}
          CANDIDATE_SHA256: ${{ steps.inventory.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          {
            echo '## Member Production storage read-only preflight'
            echo
            echo "- CURRENT_MAIN_SHA=$EXPECTED_SHA"
            echo "- MODE=$MODE"
            echo "- R2_JURISDICTIONS_AUTHORIZED=$JURISDICTIONS"
            echo "- ACTIVE_PRODUCTION_VERSION_BEFORE=$ACTIVE_VERSION"
            echo "- R2_REST_TOKEN_AUTH_OUTCOME=$R2_AUTH_OUTCOME"
            echo "- INVENTORY_OUTCOME=$INVENTORY_OUTCOME"
            if [[ "$INVENTORY_OUTCOME" == 'success' ]]; then
              echo "- R2_JURISDICTIONS_SCANNED=$JURISDICTIONS"
              echo "- R2_BUCKET_COUNT=$BUCKET_COUNT"
              echo "- R2_BUCKET_INVENTORY_SHA256=$INVENTORY_SHA256"
              if [[ "$MODE" == 'verify' ]]; then
                echo "- CANDIDATE_R2_BUCKET_NAME_SHA256=$CANDIDATE_SHA256"
                echo '- CANDIDATE_R2_BUCKET_EXISTS=PASS'
              fi
            fi
            echo '- R2_AUTH_SECRET=CLOUDFLARE_R2_READ_API_TOKEN'
            echo '- R2_AUTH_EXPECTED_CREDENTIAL=Cloudflare REST API token (Bearer), not R2 S3 Access Key ID/Secret Access Key'
            echo '- PRODUCTION_STORAGE_BINDING_CHANGE=0'
            echo '- PRIVATE_MEDIA_RUNTIME_WIRING=SOURCE_ONLY'
            echo '- PRODUCTION_STORAGE_FETCH=0'
            echo '- R2_OBJECT_READ=0'
            echo '- R2_WRITE=0'
            echo '- MEMBER_ROUTE_ACTIVATION=0'
            echo '- PRODUCTION_DEPLOY=0'
            echo '- PRODUCTION_TRAFFIC_CHANGE=0'
            echo '- PRODUCTION_D1_WRITE=0'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$INVENTORY_OUTCOME" == 'success' ]]; then
            echo 'MEMBER_PRODUCTION_STORAGE_PREFLIGHT=PASS'
          else
            echo 'MEMBER_PRODUCTION_STORAGE_PREFLIGHT=FAIL_CLOSED'
          fi