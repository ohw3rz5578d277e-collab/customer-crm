name: Deploy customer-crm to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-crm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate production config and managed migration safety
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'customer-crm-api') throw new Error('Unexpected Worker name');
          if (config.main !== 'src/production-index-crm-browser-root-entry.js') throw new Error('Production main changed');
          const db = (config.d1_databases || []).find(x => x.binding === 'DB');
          if (!db) throw new Error('DB binding missing');
          if (db.database_name !== 'customer-crm-db') throw new Error('Unexpected D1 database name');
          if (db.database_id !== '1ae3e0d9-72c0-47ad-8fc1-fed9d15ec70f') throw new Error('Unexpected D1 database id');
          if (db.migrations_dir !== 'migrations_managed') throw new Error('Managed migrations directory is not configured');
          if (db.migrations_table !== 'd1_migrations_managed') throw new Error('Managed migrations table is not configured');

          const legacyFile = 'migrations/20260814_customer_line_message_events.sql';
          const managedFile = 'migrations_managed/20260814_customer_line_message_events.sql';
          const legacySql = fs.readFileSync(legacyFile, 'utf8');
          const managedSql = fs.readFileSync(managedFile, 'utf8');
          if (legacySql !== managedSql) throw new Error('Managed migration is not an exact copy of the approved legacy source migration');

          let sql = managedSql.replace(/--.*$/gm, ' ').replace(/\/\*[\s\S]*?\*\//g, ' ');
          const forbidden = [
            /\bDROP\b/i,
            /\bDELETE\b/i,
            /\bALTER\b/i,
            /\bUPDATE\b/i,
            /\bINSERT\b/i,
            /\bREPLACE\b/i,
            /\bTRUNCATE\b/i
          ];
          for (const pattern of forbidden) {
            if (pattern.test(sql)) throw new Error(`Forbidden migration statement detected: ${pattern}`);
          }

          const statements = sql.split(';').map(x => x.trim()).filter(Boolean);
          if (!statements.length) throw new Error('Managed migration is empty');
          for (const statement of statements) {
            if (!/^CREATE\s+(TABLE|INDEX)\s+IF\s+NOT\s+EXISTS\b/i.test(statement)) {
              throw new Error(`Managed migration contains a non-approved statement: ${statement.slice(0, 80)}`);
            }
          }

          const required = [
            'CREATE TABLE IF NOT EXISTS customer_line_message_events',
            'idx_customer_line_message_events_customer_time',
            'idx_customer_line_message_events_line_user_time',
            'idx_customer_line_message_events_context'
          ];
          for (const token of required) {
            if (!sql.includes(token)) throw new Error(`Required migration definition missing: ${token}`);
          }
          console.log('Production config, managed namespace, exact-copy check, and migration safety checks passed.');
          NODE

      - name: Confirm Cloudflare authentication
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: whoami

      - name: List pending managed remote D1 migrations
        id: pending_migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 migrations list customer-crm-db --remote

      - name: Guard managed pending migration set
        shell: bash
        env:
          PENDING_MIGRATIONS: ${{ steps.pending_migrations.outputs.command-output }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const output = process.env.PENDING_MIGRATIONS || '';
          const target = '20260814_customer_line_message_events.sql';
          const files = [...new Set([...output.matchAll(/[A-Za-z0-9_.-]+\.sql/g)].map(m => m[0]))];
          const leakedLegacy = files.filter(x => /^202606(?:12|13|14)_/.test(x));
          if (leakedLegacy.length) {
            throw new Error(`Legacy migrations leaked into the managed namespace: ${leakedLegacy.join(', ')}`);
          }
          const unexpected = files.filter(x => x !== target);
          if (unexpected.length) {
            throw new Error(`Unexpected managed unapplied migrations detected: ${unexpected.join(', ')}`);
          }
          console.log(files.length ? `Managed pending migration approved: ${target}` : 'No managed pending migrations; safe idempotent rerun.');
          NODE

      - name: Apply managed remote D1 migrations
        id: migrate
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 migrations apply customer-crm-db --remote

      - name: Deploy customer-crm-api
        id: deploy_worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Verify managed migration tracking table exists (READ ONLY)
        id: verify_migration_table
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 execute customer-crm-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='d1_migrations_managed';" --json

      - name: Verify D1 table exists (READ ONLY)
        id: verify_table
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 execute customer-crm-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='customer_line_message_events';" --json

      - name: Verify D1 columns (READ ONLY)
        id: verify_columns
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 execute customer-crm-db --remote --command "PRAGMA table_info(customer_line_message_events);" --json

      - name: Verify D1 indexes (READ ONLY)
        id: verify_indexes
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 execute customer-crm-db --remote --command "PRAGMA index_list(customer_line_message_events);" --json

      - name: Assert D1 verification results
        shell: bash
        env:
          MIGRATION_TABLE_OUTPUT: ${{ steps.verify_migration_table.outputs.command-output }}
          TABLE_OUTPUT: ${{ steps.verify_table.outputs.command-output }}
          COLUMNS_OUTPUT: ${{ steps.verify_columns.outputs.command-output }}
          INDEXES_OUTPUT: ${{ steps.verify_indexes.outputs.command-output }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const migrationTable = process.env.MIGRATION_TABLE_OUTPUT || '';
          const table = process.env.TABLE_OUTPUT || '';
          const columns = process.env.COLUMNS_OUTPUT || '';
          const indexes = process.env.INDEXES_OUTPUT || '';

          if (!migrationTable.includes('d1_migrations_managed')) throw new Error('Managed migration tracking table not found');
          if (!table.includes('customer_line_message_events')) throw new Error('customer_line_message_events table not found');

          const requiredColumns = [
            'id','event_id','customer_id','line_user_id','direction','message_type','message_text',
            'source','send_status','send_error','line_message_id','idempotency_key','sender_type',
            'occurred_at','created_at','updated_at','raw_json'
          ];
          const missingColumns = requiredColumns.filter(x => !columns.includes(`"${x}"`) && !columns.includes(x));
          if (missingColumns.length) throw new Error(`Missing columns: ${missingColumns.join(', ')}`);

          const requiredIndexes = [
            'idx_customer_line_message_events_customer_time',
            'idx_customer_line_message_events_line_user_time',
            'idx_customer_line_message_events_context'
          ];
          const missingIndexes = requiredIndexes.filter(x => !indexes.includes(x));
          if (missingIndexes.length) throw new Error(`Missing indexes: ${missingIndexes.join(', ')}`);
          console.log('Managed migration tracking table, D1 table, columns, and required indexes verified.');
          NODE

      - name: Verify deployed Worker safety (READ ONLY HTTP)
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_worker.outputs.deployment-url }}
          DEPLOY_COMMAND_OUTPUT: ${{ steps.deploy_worker.outputs.command-output }}
        run: |
          set -euo pipefail

          cat > /tmp/verify-health.js <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          let h;
          try {
            h = JSON.parse(text);
          } catch (error) {
            throw new Error(`Health endpoint declared JSON but could not be parsed: ${error.message}`);
          }
          const expected = {
            line_context_events_enabled: true,
            line_context_events_table_present: true,
            line_context_events_columns_ok: true,
            line_context_sent_only_formal: true,
            line_live_send_enabled: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (h[key] !== value) {
              throw new Error(`Health mismatch: ${key}=${JSON.stringify(h[key])}, expected ${value}`);
            }
          }
          console.log('Health JSON verification passed.');
          NODE

          WORKER_URL="${DEPLOYMENT_URL:-}"
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="$(printf '%s' "${DEPLOY_COMMAND_OUTPUT:-}" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | head -n1 || true)"
          fi
          if [ -z "$WORKER_URL" ]; then
            echo 'Could not determine deployed Worker URL.' >&2
            exit 1
          fi
          WORKER_URL="${WORKER_URL%/}"

          request_no_redirect() {
            local url="$1"
            local headers="$2"
            local body="$3"
            curl --silent --show-error --retry 4 --retry-delay 2 --max-redirs 0 \
              -D "$headers" -o "$body" -w '%{http_code}' "$url"
          }

          read_header() {
            local name="$1"
            local file="$2"
            grep -i "^${name}:" "$file" | tail -n1 | cut -d: -f2- | sed 's/^ *//;s/\r$//' || true
          }

          health_status="$(request_no_redirect "$WORKER_URL/health" /tmp/health.headers /tmp/health.body)"
          health_content_type="$(read_header 'Content-Type' /tmp/health.headers)"
          health_location="$(read_header 'Location' /tmp/health.headers)"
          health_body_kind=other
          if LC_ALL=C head -c 512 /tmp/health.body | grep -Eiq '^[[:space:]]*(<html|<!doctype)'; then
            health_body_kind=html
          fi
          health_location_lower="$(printf '%s' "$health_location" | tr '[:upper:]' '[:lower:]')"
          health_access_redirect=no
          if [[ "$health_status" =~ ^(302|303|307|308)$ ]] && \
             { [[ "$health_location_lower" == *"cloudflareaccess.com"* ]] || [[ "$health_location_lower" == *"/cdn-cgi/access/"* ]]; }; then
            health_access_redirect=yes
          fi

          echo "Health response: status=$health_status content_type=${health_content_type:-<none>} body_kind=$health_body_kind access_redirect=$health_access_redirect"

          case "$health_status" in
            200)
              if [[ "$health_content_type" == *"application/json"* || "$health_content_type" == *"+json"* ]]; then
                node /tmp/verify-health.js /tmp/health.body
              elif [ "$health_body_kind" = "html" ]; then
                echo 'Health returned HTTP 200 HTML, not health JSON; refusing to parse HTML as JSON.' >&2
                exit 1
              else
                echo "Health returned HTTP 200 with non-JSON Content-Type: ${health_content_type:-<none>}." >&2
                exit 1
              fi
              ;;
            302|303|307|308)
              if [ "$health_access_redirect" != "yes" ]; then
                echo "Health returned an unexpected redirect that was not recognized as a Cloudflare Access challenge: HTTP $health_status." >&2
                exit 1
              fi
              echo 'Health endpoint is protected by Cloudflare Access.'
              echo 'Authenticated application health must be verified separately.'
              ;;
            401|403)
              echo 'Health endpoint is protected by Cloudflare Access.'
              echo 'Authenticated application health must be verified separately.'
              ;;
            *)
              echo "Unexpected health response: HTTP $health_status." >&2
              exit 1
              ;;
          esac

          internal_status="$(request_no_redirect "$WORKER_URL/api/internal/line-context-events?line_user_id=test" /tmp/internal.headers /tmp/internal.body)"
          case "$internal_status" in
            401|403|302|303|307|308)
              echo "Internal API unauthenticated request was blocked: HTTP $internal_status."
              ;;
            200)
              echo 'Internal API returned HTTP 200 without authentication; refusing unsafe access.' >&2
              exit 1
              ;;
            *)
              echo "Internal API unauthenticated status was $internal_status; expected 401/403 or Cloudflare Access redirect." >&2
              exit 1
              ;;
          esac

          customer_status="$(request_no_redirect "$WORKER_URL/api/customers/test/line-context-events" /tmp/customer.headers /tmp/customer.body)"
          case "$customer_status" in
            401|403|302|303|307|308)
              echo "Customer context unauthenticated request was blocked: HTTP $customer_status."
              ;;
            200)
              echo 'Customer context API returned HTTP 200 without authentication; refusing unsafe access.' >&2
              exit 1
              ;;
            *)
              echo "Customer context unauthenticated status was $customer_status; expected 401/403 or Cloudflare Access redirect." >&2
              exit 1
              ;;
          esac

          admin_status="$(request_no_redirect "$WORKER_URL/admin" /tmp/admin.headers /tmp/admin.body)"
          case "$admin_status" in
            302|303|307|308|401|403)
              echo "Admin endpoint is protected from this unauthenticated runner: HTTP $admin_status."
              ;;
            200)
              if grep -Eqi 'Worker threw exception|Error 1101|internal server error' /tmp/admin.body; then
                echo 'Admin response contains a Worker error.' >&2
                exit 1
              fi
              echo 'Admin endpoint returned HTTP 200 without a Worker error.'
              ;;
            404)
              echo 'Admin endpoint unhealthy: HTTP 404.' >&2
              exit 1
              ;;
            5??)
              echo "Admin endpoint unhealthy: HTTP $admin_status." >&2
              exit 1
              ;;
            *)
              echo "Unexpected admin endpoint status: HTTP $admin_status." >&2
              exit 1
              ;;
          esac

          draft_status="$(request_no_redirect "$WORKER_URL/api/line-ops/dashboard" /tmp/line-ops.headers /tmp/line-ops.body)"
          case "$draft_status" in
            200)
              if grep -Eqi 'Worker threw exception|Error 1101|internal server error' /tmp/line-ops.body; then
                echo 'Existing customer_line_draft_logs API response contains a Worker error.' >&2
                exit 1
              fi
              echo 'Existing customer_line_draft_logs API returned HTTP 200 without a Worker error.'
              ;;
            401|403|302|303|307|308)
              echo "Existing customer_line_draft_logs API is protected from this unauthenticated runner: HTTP $draft_status."
              ;;
            404)
              echo 'Existing customer_line_draft_logs API path unhealthy: HTTP 404.' >&2
              exit 1
              ;;
            5??)
              echo "Existing customer_line_draft_logs API path unhealthy: HTTP $draft_status." >&2
              exit 1
              ;;
            *)
              echo "Unexpected existing customer_line_draft_logs API status: HTTP $draft_status." >&2
              exit 1
              ;;
          esac

          echo 'Worker HTTP verification passed: Access-aware health handling, auth guards, admin, and existing LINE draft API are non-destructive.'
