name: Deploy customer-crm to Cloudflare

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
      - 'tests/deploy-*.mjs'
      - 'migrations_managed/20260828_customer360_family_marketing_foundation.sql'
      - 'wrangler.jsonc'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy
      expected_sha:
        description: 'Exact current main SHA authorized by PROJECT HQ'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: customer-crm-production-deploy
  cancel-in-progress: false

env:
  CUSTOMER360_MIGRATION: 20260828_customer360_family_marketing_foundation.sql

jobs:
  release_ci:
    name: Customer360 release PR full regression
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install local browser and Wrangler tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 wrangler@4.33.1
          npx playwright install --with-deps chromium

      - name: Validate release workflow and managed migration contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/deploy-customer360-production-release-gate.test.mjs
          node tests/deploy-managed-migration-guard.mjs
          node tests/deploy-identity-sequence-monotonic-guard.test.mjs
          node tests/deploy-identity-sequence-workflow-contract.test.mjs

      - name: Enumerate and run all local static mocked read-only tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' -printf '%p\n' | sort)
          test "${#tests[@]}" -gt 0
          echo 'TEST_INVENTORY_BEGIN'
          printf '%s\n' "${tests[@]}"
          echo 'TEST_INVENTORY_END'
          echo 'EXCLUDED_TESTS=NONE'
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            node "$test_file"
            echo '::endgroup::'
          done
          echo "FULL_MAIN_LOCAL_TEST_FILES=${#tests[@]} PASS"

      - name: Production entry import and Wrangler dry-run
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          set -euo pipefail
          node --check src/production-index-crm-customer360-entry.js
          node -e "import('./src/production-index-crm-customer360-entry.js').then(()=>console.log('PRODUCTION_ENTRY_IMPORT=PASS'))"
          npx wrangler deploy --dry-run --outdir /tmp/customer360-release-dry-run
          test -n "$(find /tmp/customer360-release-dry-run -type f -print -quit)"
          echo 'WRANGLER_DRY_RUN=PASS'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'WORKER_DEPLOY=0'
          echo 'LINE_SEND=0'

  release:
    name: Exact-SHA Production release gate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - name: Normalize and validate authorized SHA
        id: authorized_sha
        shell: bash
        env:
          RAW_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RAW_RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$RAW_RELEASE_MODE" in
            preflight|deploy) ;;
            *) echo '::error::INVALID_RELEASE_MODE'; exit 1 ;;
          esac
          normalized_sha="$(printf '%s' "$RAW_EXPECTED_SHA" | python3 -c 'import sys; print(sys.stdin.read().strip().lower(), end="")')"
          if [[ ! "$normalized_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::INVALID_EXPECTED_SHA_FORMAT'
            exit 1
          fi
          echo "sha=$normalized_sha" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_SHA=$normalized_sha" >> "$GITHUB_ENV"
          echo "AUTHORIZED_SHA=$normalized_sha"
          echo "RELEASE_MODE=$RAW_RELEASE_MODE"

      - name: Checkout exact authorized SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.authorized_sha.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Exact SHA and current-main gate
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_MODE" in
            preflight|deploy) ;;
            *) echo '::error::INVALID_RELEASE_MODE'; exit 1 ;;
          esac
          actual_sha="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "AUTHORIZED_SHA=$EXPECTED_SHA"
          echo "CHECKOUT_SHA=$actual_sha"
          echo "CURRENT_MAIN_SHA=$remote_main"
          echo "RELEASE_MODE=$RELEASE_MODE"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo '::error::BLOCKED_CHECKOUT_SHA_MISMATCH'
            exit 1
          fi
          if [[ "$remote_main" != "$EXPECTED_SHA" ]]; then
            echo '::error::BLOCKED_CURRENT_MAIN_SHA_MISMATCH'
            exit 1
          fi
          echo "PREFLIGHT_CHECKOUT_SHA=$actual_sha"
          echo 'EXPECTED_SHA_GUARD=PASS'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install local browser and Wrangler tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 wrangler@4.33.1
          npx playwright install --with-deps chromium

      - name: Validate production config and managed migration safety
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(config.name!=='customer-crm-api')throw new Error('Unexpected Worker name');
          if(config.main!=='src/production-index-crm-customer360-entry.js')throw new Error('Production main changed');
          const db=(config.d1_databases||[]).find(x=>x.binding==='DB');
          if(!db)throw new Error('DB binding missing');
          if(db.database_name!=='customer-crm-db')throw new Error('Unexpected D1 database name');
          if(db.database_id!=='1ae3e0d9-72c0-47ad-8fc1-fed9d15ec70f')throw new Error('Unexpected D1 database id');
          if(db.migrations_dir!=='migrations_managed')throw new Error('Managed migrations directory changed');
          if(db.migrations_table!=='d1_migrations_managed')throw new Error('Managed migrations table changed');
          NODE
          node tests/deploy-customer360-production-release-gate.test.mjs
          node tests/deploy-managed-migration-guard.mjs
          node tests/deploy-identity-sequence-monotonic-guard.test.mjs
          node tests/deploy-identity-sequence-workflow-contract.test.mjs

      - name: Current-main full local regression
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' -printf '%p\n' | sort)
          test "${#tests[@]}" -gt 0
          echo 'TEST_INVENTORY_BEGIN'
          printf '%s\n' "${tests[@]}"
          echo 'TEST_INVENTORY_END'
          echo 'EXCLUDED_TESTS=NONE'
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            node "$test_file"
            echo '::endgroup::'
          done
          echo "FULL_MAIN_LOCAL_TEST_FILES=${#tests[@]} PASS"

      - name: Production entry import and Wrangler dry-run
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          set -euo pipefail
          node --check src/production-index-crm-customer360-entry.js
          node -e "import('./src/production-index-crm-customer360-entry.js').then(()=>console.log('PRODUCTION_ENTRY_IMPORT=PASS'))"
          npx wrangler deploy --dry-run --outdir /tmp/customer360-preflight-dry-run
          test -n "$(find /tmp/customer360-preflight-dry-run -type f -print -quit)"
          echo 'WRANGLER_DRY_RUN=PASS'

      - name: Confirm Cloudflare authentication
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: whoami

      - name: List pending managed remote D1 migrations
        id: pending_migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 migrations list customer-crm-db --remote

      - name: Read Production D1 table names
        id: remote_tables
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            d1 execute customer-crm-db --remote --json --command
            "SELECT name FROM sqlite_master WHERE type='table' AND name IN
            ('d1_migrations_managed','customer_line_message_events','customer_identity_registry',
            'customer_identity_sequence','customer_family_members','customer_marketing_profiles')
            ORDER BY name;"

      - name: Read managed migration tracking
        id: remote_tracking
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            d1 execute customer-crm-db --remote --json --command
            "SELECT name FROM d1_migrations_managed WHERE name IN
            ('20260814_customer_line_message_events.sql',
            '20260818_customer_identity_registry.sql',
            '20260818_customer_identity_sequence.sql',
            '20260828_customer360_family_marketing_foundation.sql') ORDER BY id;"

      - name: Read Production D1 columns
        id: remote_columns
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            d1 execute customer-crm-db --remote --json --command
            "PRAGMA table_info(customer_identity_registry);
            PRAGMA table_info(customer_identity_sequence);
            PRAGMA table_info(customer_family_members);
            PRAGMA table_info(customer_marketing_profiles);"

      - name: Read Production D1 indexes
        id: remote_indexes
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            d1 execute customer-crm-db --remote --json --command
            "PRAGMA index_list(customer_identity_registry);
            PRAGMA index_list(customer_family_members);
            PRAGMA index_list(customer_marketing_profiles);"

      - name: Read identity sequence state
        id: sequence_preflight
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            d1 execute customer-crm-db --remote --json --command
            "SELECT s.sequence_key,s.last_value,(SELECT COALESCE(MAX(CAST(SUBSTR(customer_id,3,6) AS INTEGER)),0) FROM customers WHERE customer_id GLOB '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]') AS existing_numeric_suffix_max FROM customer_identity_sequence s WHERE s.sequence_key='canonical_customer_id';"

      - name: Classify remote pending migrations and read-only state
        id: classify
        shell: bash
        env:
          PENDING_OUTPUT: ${{ steps.pending_migrations.outputs.command-output }}
          TABLE_OUTPUT: ${{ steps.remote_tables.outputs.command-output }}
          TRACKING_OUTPUT: ${{ steps.remote_tracking.outputs.command-output }}
          COLUMN_OUTPUT: ${{ steps.remote_columns.outputs.command-output }}
          INDEX_OUTPUT: ${{ steps.remote_indexes.outputs.command-output }}
          SEQUENCE_OUTPUT: ${{ steps.sequence_preflight.outputs.command-output }}
        run: |
          set -euo pipefail
          printf '%s' "$SEQUENCE_OUTPUT" | node scripts/assert-customer-identity-sequence-monotonic.mjs
          node <<'NODE'
          const fs=require('fs');
          const pending=process.env.PENDING_OUTPUT||'';
          const tables=process.env.TABLE_OUTPUT||'';
          const tracking=process.env.TRACKING_OUTPUT||'';
          const columns=process.env.COLUMN_OUTPUT||'';
          const indexes=process.env.INDEX_OUTPUT||'';
          const sequence=process.env.SEQUENCE_OUTPUT||'';
          const approved=['20260814_customer_line_message_events.sql','20260818_customer_identity_registry.sql','20260818_customer_identity_sequence.sql','20260828_customer360_family_marketing_foundation.sql'];
          const preexisting=new Set(approved.slice(0,3));
          const customer360=approved[3];
          const files=[];
          for(const match of pending.matchAll(/[A-Za-z0-9_.-]+\.sql/g))if(!files.includes(match[0]))files.push(match[0]);
          const unknown=files.filter(x=>!approved.includes(x));
          if(unknown.length)throw new Error(`BLOCKED_UNEXPECTED_MANAGED_MIGRATION:${unknown.join(',')}`);
          const oldPending=files.filter(x=>preexisting.has(x));
          if(oldPending.length)throw new Error(`BLOCKED_PREEXISTING_MANAGED_MIGRATIONS_PENDING:${oldPending.join(',')}`);
          if(files.length>1||(files.length===1&&files[0]!==customer360))throw new Error(`BLOCKED_UNEXPECTED_MANAGED_MIGRATION_ORDER:${files.join(' -> ')}`);
          for(const required of ['d1_migrations_managed','customer_identity_registry','customer_identity_sequence'])if(!tables.includes(required))throw new Error(`PREFLIGHT_REQUIRED_TABLE_ABSENT:${required}`);
          if(!columns.includes('customer_id')||!columns.includes('sequence_key')||!columns.includes('last_value'))throw new Error('IDENTITY_SCHEMA_READBACK_INCOMPLETE');
          if(!indexes.includes('idx_customer_identity_registry_customer_id'))throw new Error('IDENTITY_INDEX_READBACK_INCOMPLETE');
          if(!sequence.includes('canonical_customer_id')||!sequence.includes('last_value')||!sequence.includes('existing_numeric_suffix_max'))throw new Error('IDENTITY_SEQUENCE_READBACK_INCOMPLETE');
          const familyPresent=tables.includes('customer_family_members');
          const profilePresent=tables.includes('customer_marketing_profiles');
          let classification,migrationTracking;
          if(files.length===1){
            classification='CUSTOMER360_MIGRATION_ONLY_PENDING';
            migrationTracking=tracking.includes(customer360)?'TRACKED_AND_PENDING_INCONSISTENT':'NOT_APPLIED';
            if(migrationTracking==='TRACKED_AND_PENDING_INCONSISTENT')throw new Error('INCONSISTENT_REMOTE_MIGRATION_STATE:tracked_but_pending');
          }else if(familyPresent&&profilePresent&&tracking.includes(customer360)){
            classification='ALREADY_APPLIED_CONFIRMED';migrationTracking='PASS';
          }else{
            throw new Error(`INCONSISTENT_REMOTE_MIGRATION_STATE:family=${familyPresent},profile=${profilePresent},tracked=${tracking.includes(customer360)}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`classification=${classification}\nfamily_table=${familyPresent?'PRESENT':'ABSENT'}\nprofile_table=${profilePresent?'PRESENT':'ABSENT'}\nmigration_tracking=${migrationTracking}\npending_files=${files.join(',')||'NONE'}\n`);
          console.log(`REMOTE_PENDING_MIGRATIONS=${files.join(' -> ')||'NONE'}`);
          console.log(`PENDING_CLASSIFICATION=${classification}`);
          console.log(`FAMILY_TABLE=${familyPresent?'PRESENT':'ABSENT'}`);
          console.log(`PROFILE_TABLE=${profilePresent?'PRESENT':'ABSENT'}`);
          console.log(`MIGRATION_TRACKING=${migrationTracking}`);
          console.log('IDENTITY_SEQUENCE_READBACK=PASS');
          console.log('REMOTE_D1_PREFLIGHT=READ_ONLY_PASS');
          NODE

      - name: Preflight safety stop
        if: ${{ inputs.mode == 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "PENDING_CLASSIFICATION=${{ steps.classify.outputs.classification }}"
          echo "FAMILY_TABLE=${{ steps.classify.outputs.family_table }}"
          echo "PROFILE_TABLE=${{ steps.classify.outputs.profile_table }}"
          echo "MIGRATION_TRACKING=${{ steps.classify.outputs.migration_tracking }}"
          echo "REMOTE_PENDING_MIGRATIONS=${{ steps.classify.outputs.pending_files }}"
          echo 'CRM_CUSTOMER360_WRITE_ENABLED=NOT_ENABLED_BY_RELEASE'
          echo 'PRODUCTION_MIGRATION_APPLY=0'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'PRODUCTION_CUSTOMER_WRITE=0'
          echo 'PRODUCTION_FAMILY_WRITE=0'
          echo 'WORKER_DEPLOY=0'
          echo 'LINE_SEND=0'
          echo 'CRM_CUSTOMER360_PRODUCTION_PREFLIGHT_PASS'

      - name: Apply Customer360 managed remote D1 migration
        id: migrate
        if: ${{ inputs.mode == 'deploy' && steps.classify.outputs.classification == 'CUSTOMER360_MIGRATION_ONLY_PENDING' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 migrations apply customer-crm-db --remote

      - name: Verify identity sequence before deploy (READ ONLY)
        id: verify_sequence_predeploy
        if: ${{ inputs.mode == 'deploy' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            d1 execute customer-crm-db --remote --json --command
            "SELECT s.sequence_key,s.last_value,(SELECT COALESCE(MAX(CAST(SUBSTR(customer_id,3,6) AS INTEGER)),0) FROM customers WHERE customer_id GLOB '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]') AS existing_numeric_suffix_max FROM customer_identity_sequence s WHERE s.sequence_key='canonical_customer_id';"

      - name: Assert identity sequence monotonic before deploy
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          SEQUENCE_OUTPUT: ${{ steps.verify_sequence_predeploy.outputs.command-output }}
        run: |
          set -euo pipefail
          printf '%s' "$SEQUENCE_OUTPUT" | node scripts/assert-customer-identity-sequence-monotonic.mjs

      - name: Deploy customer-crm-api
        id: deploy_worker
        if: ${{ inputs.mode == 'deploy' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: Verify identity sequence state (READ ONLY)
        id: verify_sequence
        if: ${{ inputs.mode == 'deploy' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            d1 execute customer-crm-db --remote --json --command
            "SELECT s.sequence_key,s.last_value,(SELECT COALESCE(MAX(CAST(SUBSTR(customer_id,3,6) AS INTEGER)),0) FROM customers WHERE customer_id GLOB '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]') AS existing_numeric_suffix_max FROM customer_identity_sequence s WHERE s.sequence_key='canonical_customer_id';"

      - name: Assert D1 verification results
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          SEQUENCE_OUTPUT: ${{ steps.verify_sequence.outputs.command-output }}
        run: |
          set -euo pipefail
          printf '%s' "$SEQUENCE_OUTPUT" | node scripts/assert-customer-identity-sequence-monotonic.mjs
          echo 'POST_DEPLOY_IDENTITY_SEQUENCE=PASS'

      - name: Verify deployed Worker safety (READ ONLY HTTP)
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_worker.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --max-time 15 "$DEPLOYMENT_URL/health" >/tmp/customer-crm-health.json
          test -s /tmp/customer-crm-health.json
          echo 'POST_DEPLOY_HTTP_READ_ONLY=PASS'
