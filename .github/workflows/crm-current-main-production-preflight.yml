name: CRM current-main Production preflight

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  preflight:
    if: github.event.pull_request.head.ref == 'task/crm-current-main-production-preflight-01'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current-main baseline
        shell: bash
        run: |
          set -euo pipefail
          expected_main='51c2ed4b8ca3324db58ec403774255675846d412'
          test "${{ github.event.pull_request.base.sha }}" = "$expected_main"
          test "$(git merge-base HEAD "$expected_main")" = "$expected_main"
          test "$(git diff --name-only "$expected_main" HEAD)" = '.github/workflows/crm-current-main-production-preflight.yml'
          node --check src/production-index-crm-browser-root-entry.js
          grep -q 'crm-production-desktop-owner-hotfix-20260825' src/production-index-crm-browser-root-entry.js
          echo 'CURRENT_MAIN_EXACT_BASELINE=PASS'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run canonical release regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/deploy-managed-migration-guard.mjs
          node tests/customer-identity-resolver.mjs
          node tests/customer-identity-regression.mjs
          node tests/customer-reservation-history-order.mjs
          echo 'CRM_CANONICAL_RELEASE_REGRESSION=PASS'

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run owner/browser UX regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/customer-production-owner-layout-regression.mjs
          node tests/customer-management-browser.mjs
          node tests/customer-management-ux.mjs
          echo 'CRM_CURRENT_MAIN_BROWSER=PASS'

      - name: Confirm Cloudflare authentication
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: whoami

      - name: List pending managed D1 migrations READ ONLY
        id: pending
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 migrations list customer-crm-db --remote

      - name: Guard pending migration set
        shell: bash
        env:
          PENDING: ${{ steps.pending.outputs.command-output }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const output = process.env.PENDING || '';
          const approved = [
            '20260814_customer_line_message_events.sql',
            '20260818_customer_identity_registry.sql',
            '20260818_customer_identity_sequence.sql'
          ];
          const files = [...new Set([...output.matchAll(/[A-Za-z0-9_.-]+\.sql/g)].map(m => m[0]))];
          const unexpected = files.filter(x => !approved.includes(x));
          if (unexpected.length) throw new Error(`Unexpected pending migrations: ${unexpected.join(', ')}`);
          const positions = files.map(x => approved.indexOf(x));
          for (let i=1;i<positions.length;i++) if (positions[i] <= positions[i-1]) throw new Error(`Unsafe migration order: ${files.join(' -> ')}`);
          console.log('PENDING_MANAGED_MIGRATIONS=' + (files.join(',') || 'NONE'));
          console.log('PENDING_MANAGED_SET=PASS');
          NODE

      - name: Read current Production D1 schema state READ ONLY
        id: schema
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute customer-crm-db --remote --command "SELECT type,name FROM sqlite_master WHERE name IN ('d1_migrations_managed','customer_line_message_events','customer_identity_registry','customer_identity_sequence') ORDER BY name; SELECT COALESCE(MAX(CAST(SUBSTR(customer_id,3,6) AS INTEGER)),0) AS existing_numeric_suffix_max FROM customers WHERE customer_id GLOB '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]';" --json

      - name: Summarize read-only D1 evidence
        shell: bash
        env:
          SCHEMA: ${{ steps.schema.outputs.command-output }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const out = process.env.SCHEMA || '';
          for (const name of ['d1_migrations_managed','customer_line_message_events','customer_identity_registry','customer_identity_sequence']) {
            console.log(`${name.toUpperCase()}_PRESENT=${out.includes(name) ? 'YES' : 'NO'}`);
          }
          if (!out.includes('existing_numeric_suffix_max')) throw new Error('Existing Customer ID suffix max evidence missing');
          console.log('PRODUCTION_D1_READONLY_EVIDENCE=PASS');
          NODE

      - name: Read identity sequence monotonic state READ ONLY
        id: sequence
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute customer-crm-db --remote --command "SELECT s.sequence_key,s.last_value,(SELECT COALESCE(MAX(CAST(SUBSTR(customer_id,3,6) AS INTEGER)),0) FROM customers WHERE customer_id GLOB '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]') AS existing_numeric_suffix_max FROM customer_identity_sequence s WHERE s.sequence_key='canonical_customer_id';" --json

      - name: Assert identity sequence monotonic READ ONLY
        shell: bash
        env:
          SEQUENCE: ${{ steps.sequence.outputs.command-output }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const out = process.env.SEQUENCE || '';
          if (!out.includes('canonical_customer_id')) throw new Error('Canonical sequence row missing');
          const last = out.match(/"last_value"\s*:\s*([0-9]+)/)?.[1];
          const max = out.match(/"existing_numeric_suffix_max"\s*:\s*([0-9]+)/)?.[1];
          if (last == null || max == null) throw new Error('Sequence numeric evidence missing');
          const lastValue = Number(last), maxExisting = Number(max);
          if (!Number.isSafeInteger(lastValue) || !Number.isSafeInteger(maxExisting)) throw new Error('Sequence evidence is not integer-safe');
          if (lastValue < maxExisting) throw new Error(`Sequence is behind existing Customer IDs: ${lastValue} < ${maxExisting}`);
          console.log(`IDENTITY_SEQUENCE_LAST_VALUE=${lastValue}`);
          console.log(`EXISTING_NUMERIC_SUFFIX_MAX=${maxExisting}`);
          console.log('IDENTITY_SEQUENCE_MONOTONIC=PASS');
          NODE

      - name: Safety declaration
        run: |
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'PRODUCTION_CUSTOMER_WRITE=0'
          echo 'PRODUCTION_RESERVATION_WRITE=0'
          echo 'LINE_SEND=0'
          echo 'DEPLOY=0'
          echo 'MAIN_MERGE=0'
