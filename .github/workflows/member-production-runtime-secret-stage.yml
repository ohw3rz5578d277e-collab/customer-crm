name: Member Production runtime secret stage

on:
  pull_request:
    paths:
      - '.github/workflows/member-production-runtime-secret-stage.yml'
      - '.github/workflows/dispatch-member-production-runtime-secret-stage-from-issue.yml'
      - 'tests/member-production-runtime-secret-stage-contract.test.mjs'
      - 'docs/member-app/member-production-runtime-secret-stage.md'
      - '.github/workflows/member-app-foundation.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA authorized for Member runtime secret staging
        required: true
        type: string
      readiness_run_id:
        description: Successful exact-SHA Member Production runtime readiness run ID
        required: true
        type: string
      owner_comment_id:
        description: Owner authorization issue comment ID from release-gate issue #26
        required: true
        type: string
      confirmation:
        description: Exact confirmation token
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'member-production-runtime-secret-stage' || format('member-runtime-secret-stage-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  contract:
    name: Member runtime secret stage contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify Member runtime secret stage contract
        run: node tests/member-production-runtime-secret-stage-contract.test.mjs

  stage:
    name: Exact-SHA Member Production runtime secret stage
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA_RAW: ${{ inputs.expected_sha }}
      READINESS_RUN_ID_RAW: ${{ inputs.readiness_run_id }}
      OWNER_COMMENT_ID_RAW: ${{ inputs.owner_comment_id }}
      CONFIRMATION_RAW: ${{ inputs.confirmation }}
    steps:
      - name: Normalize and validate authorization inputs
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(printf '%s' "$EXPECTED_SHA_RAW" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::INVALID_EXPECTED_SHA'; exit 1; }
          [[ "$READINESS_RUN_ID_RAW" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_READINESS_RUN_ID'; exit 1; }
          [[ "$OWNER_COMMENT_ID_RAW" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_OWNER_COMMENT_ID'; exit 1; }
          test "$CONFIRMATION_RAW" = 'STAGE_MEMBER_RUNTIME_SECRETS' || { echo '::error::INVALID_MEMBER_RUNTIME_SECRET_STAGE_CONFIRMATION'; exit 1; }
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "readiness_run_id=$READINESS_RUN_ID_RAW" >> "$GITHUB_OUTPUT"
          echo "owner_comment_id=$OWNER_COMMENT_ID_RAW" >> "$GITHUB_OUTPUT"
          echo "MEMBER_RUNTIME_SECRET_STAGE_AUTHORIZED_SHA=$expected_sha"
          echo 'MEMBER_RUNTIME_SECRET_STAGE_CONFIRMATION=PASS'

      - name: Checkout exact authorized SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.auth.outputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Exact SHA and current-main gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA" || { echo "::error::CHECKOUT_SHA_MISMATCH actual=$actual_sha expected=$EXPECTED_SHA"; exit 1; }
          test "$current_main" = "$EXPECTED_SHA" || { echo "::error::MAIN_DRIFT current=$current_main expected=$EXPECTED_SHA"; exit 1; }
          echo 'EXACT_SHA_GATE=PASS'
          echo "CURRENT_MAIN_SHA=$current_main"

      - name: Verify Owner authorization comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
          READINESS_RUN_ID: ${{ steps.auth.outputs.readiness_run_id }}
          OWNER_COMMENT_ID: ${{ steps.auth.outputs.owner_comment_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$OWNER_COMMENT_ID"             > /tmp/member-runtime-secret-stage-owner-comment.json
          EXPECTED_BODY="/member-runtime-secret-stage sha=$EXPECTED_SHA readiness_run=$READINESS_RUN_ID confirm=STAGE_MEMBER_RUNTIME_SECRETS"           python3 - <<'PY'
          import json, os
          with open('/tmp/member-runtime-secret-stage-owner-comment.json', encoding='utf-8') as f:
              c=json.load(f)
          if c.get('user',{}).get('login')!='ohw3rz5578d277e-collab':
              raise SystemExit('OWNER_COMMENT_ACTOR_MISMATCH')
          if c.get('body')!=os.environ['EXPECTED_BODY']:
              raise SystemExit('OWNER_COMMENT_BODY_MISMATCH')
          if not str(c.get('issue_url','')).endswith('/issues/26'):
              raise SystemExit('OWNER_COMMENT_ISSUE_MISMATCH')
          print('OWNER_AUTHORIZATION_COMMENT=PASS')
          PY
          rm -f /tmp/member-runtime-secret-stage-owner-comment.json

      - name: Verify successful exact-SHA runtime readiness receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
          READINESS_RUN_ID: ${{ steps.auth.outputs.readiness_run_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$READINESS_RUN_ID"             > /tmp/member-runtime-secret-stage-readiness-run.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/member-runtime-secret-stage-readiness-run.json', encoding='utf-8') as f:
              r=json.load(f)
          checks={
              'id': r.get('id')==int(os.environ['READINESS_RUN_ID']),
              'status': r.get('status')=='completed',
              'conclusion': r.get('conclusion')=='success',
              'head_sha': r.get('head_sha')==os.environ['EXPECTED_SHA'],
              'event': r.get('event')=='workflow_dispatch',
              'path': r.get('path')=='.github/workflows/member-production-runtime-readiness.yml',
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('INVALID_RUNTIME_READINESS_RECEIPT:'+','.join(bad))
          print('MEMBER_RUNTIME_READINESS_RECEIPT=PASS')
          PY
          rm -f /tmp/member-runtime-secret-stage-readiness-run.json

      - name: Verify canonical Member source remains default-off
        shell: bash
        run: |
          set -euo pipefail
          node member_tests/member-production-entry-default-off-manifest.test.mjs
          node member_tests/member-production-route-wiring-preflight.test.mjs
          node <<'NODE'
          const fs=require('fs');
          const entry=fs.readFileSync('src/production-index-crm-customer360-entry.js','utf8');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(!entry.includes('const MEMBER_PRODUCTION_OWNER_APPROVED=false;'))throw new Error('MEMBER_OWNER_FLAG_NOT_DEFAULT_OFF');
          if(String(cfg?.vars?.MEMBER_PRODUCTION_ROUTE_MODE||'').trim().toLowerCase()==='enabled')throw new Error('MEMBER_PRODUCTION_ROUTE_MODE_ENABLED');
          if(String(cfg?.vars?.MEMBER_PRIVATE_MEDIA_CONTENT_ROUTE_MODE||'').trim().toLowerCase()==='enabled')throw new Error('PRIVATE_MEDIA_ROUTE_MODE_ENABLED');
          console.log('MEMBER_CANONICAL_SOURCE_DEFAULT_OFF=PASS');
          console.log('MEMBER_PRODUCTION_OWNER_APPROVED=false');
          console.log('MEMBER_PRODUCTION_ROUTE_MODE=NOT_ENABLED');
          console.log('MEMBER_PRIVATE_MEDIA_CONTENT_ROUTE_MODE=NOT_ENABLED');
          NODE

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify stage contract
        run: node tests/member-production-runtime-secret-stage-contract.test.mjs

      - name: Install Wrangler tooling
        run: npm install --no-save wrangler@4.131.2

      - name: Confirm Cloudflare authentication
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler whoami >/tmp/member-runtime-secret-stage-whoami.txt
          test -s /tmp/member-runtime-secret-stage-whoami.txt
          rm -f /tmp/member-runtime-secret-stage-whoami.txt
          echo 'CLOUDFLARE_AUTH=PASS'

      - name: Snapshot active Production deployment and versions
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-runtime-deployment-before.json
          npx wrangler versions list --name customer-crm-api --json > /tmp/member-runtime-versions-before.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/member-runtime-deployment-before.json','utf8'));JSON.parse(require('fs').readFileSync('/tmp/member-runtime-versions-before.json','utf8'));"
          echo 'PRODUCTION_DEPLOYMENT_SNAPSHOT_BEFORE=PASS'

      - name: Prepare exactly four staged secret values
        shell: bash
        env:
          MEMBER_LINE_LOGIN_CHANNEL_SECRET_INPUT: ${{ secrets.MEMBER_LINE_LOGIN_CHANNEL_SECRET }}
        run: |
          set -euo pipefail
          test -n "$MEMBER_LINE_LOGIN_CHANNEL_SECRET_INPUT" || { echo '::error::MEMBER_LINE_LOGIN_CHANNEL_SECRET_GITHUB_SECRET_MISSING'; exit 1; }
          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const channel=process.env.MEMBER_LINE_LOGIN_CHANNEL_SECRET_INPUT||'';
          if(channel.length<32)throw new Error('MEMBER_LINE_LOGIN_CHANNEL_SECRET_TOO_SHORT');
          if(channel!==channel.trim())throw new Error('MEMBER_LINE_LOGIN_CHANNEL_SECRET_HAS_SURROUNDING_WHITESPACE');
          const values={
            MEMBER_SESSION_SECRET:crypto.randomBytes(48).toString('base64url'),
            MEMBER_LINE_LOGIN_TRANSACTION_SECRET:crypto.randomBytes(48).toString('base64url'),
            MEMBER_LINE_LOGIN_CHANNEL_SECRET:channel,
            MEMBER_PRIVATE_MEDIA_DELIVERY_SECRET:crypto.randomBytes(48).toString('base64url')
          };
          for(const [name,value] of Object.entries(values)){
            if(value.length<32)throw new Error('WEAK_SECRET:'+name);
            process.stdout.write('::add-mask::'+value+'\n');
          }
          fs.writeFileSync('/tmp/member-runtime-secrets.json',JSON.stringify(values),{mode:0o600});
          console.log('MEMBER_RUNTIME_SECRET_INPUT_COUNT=4');
          console.log('MEMBER_RUNTIME_GENERATED_SECRET_COUNT=3');
          console.log('MEMBER_RUNTIME_EXTERNAL_SECRET_COUNT=1');
          console.log('SECRET_VALUES_PRINTED=NO');
          NODE
          test "$(stat -c '%a' /tmp/member-runtime-secrets.json)" = '600'

      - name: Stage secret-bearing Worker version without deployment
        id: stage
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
        run: |
          set -euo pipefail
          npx wrangler versions secret bulk /tmp/member-runtime-secrets.json             --name customer-crm-api             --message "Owner-gated Member runtime secret stage for $EXPECTED_SHA"
          npx wrangler versions list --name customer-crm-api --json > /tmp/member-runtime-versions-after.json
          node <<'NODE'
          const fs=require('fs');
          function rows(path){
            const x=JSON.parse(fs.readFileSync(path,'utf8'));
            return Array.isArray(x)?x:Array.isArray(x.versions)?x.versions:Array.isArray(x.result)?x.result:[];
          }
          function id(row){return String(row?.id||row?.version_id||row?.versionId||'');}
          const before=new Set(rows('/tmp/member-runtime-versions-before.json').map(id).filter(Boolean));
          const after=rows('/tmp/member-runtime-versions-after.json').map(id).filter(Boolean);
          const created=after.filter(x=>!before.has(x));
          if(created.length!==1)throw new Error('STAGED_VERSION_DELTA_NOT_EXACTLY_ONE:'+created.length);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'version_id='+created[0]+'\n');
          console.log('MEMBER_RUNTIME_SECRET_STAGED_VERSION_ID='+created[0]);
          console.log('WORKER_VERSION_STAGE=PASS');
          NODE

      - name: Verify staged version and unchanged Production traffic
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGED_VERSION_ID: ${{ steps.stage.outputs.version_id }}
        run: |
          set -euo pipefail
          npx wrangler versions view "$STAGED_VERSION_ID" --name customer-crm-api --json > /tmp/member-runtime-staged-version.json
          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-runtime-deployment-after.json
          node <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/member-runtime-deployment-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('/tmp/member-runtime-deployment-after.json','utf8'));
          function canonical(value){
            if(Array.isArray(value))return value.map(canonical);
            if(value&&typeof value==='object'){
              return Object.fromEntries(Object.keys(value).sort().map(key=>[key,canonical(value[key])]));
            }
            return value;
          }
          if(JSON.stringify(canonical(before))!==JSON.stringify(canonical(after)))throw new Error('PRODUCTION_DEPLOYMENT_CHANGED_DURING_SECRET_STAGE');
          const staged=fs.readFileSync('/tmp/member-runtime-staged-version.json','utf8');
          for(const name of [
            'MEMBER_SESSION_SECRET',
            'MEMBER_LINE_LOGIN_TRANSACTION_SECRET',
            'MEMBER_LINE_LOGIN_CHANNEL_SECRET',
            'MEMBER_PRIVATE_MEDIA_DELIVERY_SECRET'
          ]){
            if(!staged.includes(name))throw new Error('STAGED_SECRET_BINDING_MISSING:'+name);
          }
          for(const name of [
            'ADMIN_TOKEN',
            'CRM_INTERNAL_TOKEN',
            'RESERVATION_INTERNAL_TOKEN',
            'SYNC_TOKEN',
            'CRM_OWNER_PASSWORD',
            'CRM_OWNER_SESSION_SECRET'
          ]){
            if(!staged.includes(name))throw new Error('STAGED_EXISTING_REQUIRED_SECRET_BINDING_MISSING:'+name);
          }
          for(const name of ['DB','LINE_SERVICE','RESERVATION_SERVICE','CRM_OWNER_LOGIN_RATE_LIMITER']){
            if(!staged.includes(name))throw new Error('STAGED_REQUIRED_RESOURCE_BINDING_MISSING:'+name);
          }
          console.log('STAGED_SECRET_BINDINGS=4');
          console.log('STAGED_EXISTING_REQUIRED_SECRET_BINDINGS=PASS');
          console.log('STAGED_REQUIRED_RESOURCE_BINDINGS=PASS');
          console.log('PRODUCTION_DEPLOYMENT_UNCHANGED=PASS');
          console.log('PRODUCTION_TRAFFIC_CHANGE=0');
          console.log('PRODUCTION_DEPLOY=0');
          console.log('MEMBER_ROUTE_ACTIVATION=0');
          console.log('PRODUCTION_D1_WRITE=0');
          console.log('CRM_WRITE=0');
          console.log('LINE_SEND=0');
          console.log('CUSTOMER_ID_GENERATION=0');
          console.log('COMMERCE_ACTIVATION=0');
          NODE

      - name: Cleanup temporary secret material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f             /tmp/member-runtime-secrets.json             /tmp/member-runtime-deployment-before.json             /tmp/member-runtime-deployment-after.json             /tmp/member-runtime-versions-before.json             /tmp/member-runtime-versions-after.json             /tmp/member-runtime-staged-version.json
          echo 'TEMP_SECRET_MATERIAL_REMOVED=YES'

      - name: Final stage-only declaration
        if: ${{ success() }}
        shell: bash
        run: |
          echo 'MEMBER_RUNTIME_SECRET_STAGE=PASS'
          echo 'WORKER_VERSION_STAGE=PASS'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'MEMBER_PRODUCTION_OWNER_APPROVED_ACTIVATION=0'
          echo 'MEMBER_PRODUCTION_ROUTE_MODE_ENABLEMENT=0'
          echo 'MEMBER_SESSION_PRODUCTION_ACTIVATION=0'
          echo 'LINE_LOGIN_PRODUCTION_ACTIVATION=0'
          echo 'PRIVATE_MEDIA_PRODUCTION_BINDING_CHANGE=0'
          echo 'PUBLIC_ASSET_PRODUCTION_BINDING_CHANGE=0'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'CRM_WRITE=0'
          echo 'LINE_SEND=0'
          echo 'CUSTOMER_ID_GENERATION=0'
          echo 'COMMERCE_ACTIVATION=0'
