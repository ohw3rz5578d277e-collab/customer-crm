name: Dispatch Member Production LINE Login candidate stage from release-gate issue

run-name: >-
  ${{ startsWith(github.event.comment.body, '/member-production-line-login-stage ') && 'Production mutation bridge: member-line-login-stage' || 'Production bridge: ignored' }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  validate:
    name: Validate exact Member LINE Login stage command and issue receipt
    if: >-
      github.event.issue.number == 26 &&
      github.event.issue.pull_request == null &&
      github.actor == 'ohw3rz5578d277e-collab' &&
      github.event.comment.user.login == 'ohw3rz5578d277e-collab' &&
      startsWith(github.event.comment.body, '/member-production-line-login-stage ')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate exact Owner command current main first attempt and fresh comment
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
          OWNER_COMMENT_ID: ${{ github.event.comment.id }}
          BRIDGE_RUN_ID: ${{ github.run_id }}
          BRIDGE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$BRIDGE_RUN_ATTEMPT" = '1' || { echo '::error::MEMBER_LINE_LOGIN_STAGE_BRIDGE_RERUN_NOT_AUTHORIZED'; exit 1; }
          command_re='^/member-production-line-login-stage sha=([0-9a-f]{40}) route_stage_run=([0-9]+) route_promotion_run=([0-9]+) active_version=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}) confirm=STAGE_MEMBER_LINE_LOGIN_CANDIDATE$'
          [[ "$COMMAND_BODY" =~ $command_re ]] || { echo '::error::INVALID_MEMBER_LINE_LOGIN_STAGE_COMMAND'; exit 1; }
          expected_sha="${BASH_REMATCH[1]}"
          route_stage_run_id="${BASH_REMATCH[2]}"
          route_promotion_run_id="${BASH_REMATCH[3]}"
          active_version_id="${BASH_REMATCH[4]}"
          [[ "$OWNER_COMMENT_ID" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_OWNER_COMMENT_ID'; exit 1; }
          [[ "$BRIDGE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_BRIDGE_RUN_ID'; exit 1; }

          current_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$current_sha" = "$expected_sha" || { echo "::error::MAIN_DRIFT expected=$expected_sha current=$current_sha"; exit 1; }

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$OWNER_COMMENT_ID" \
            > /tmp/member-line-login-stage-owner-comment.json

          export COMMAND_BODY OWNER_COMMENT_ID
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          c=json.load(open('/tmp/member-line-login-stage-owner-comment.json', encoding='utf-8'))
          if c.get('id') != int(os.environ['OWNER_COMMENT_ID']): raise SystemExit('OWNER_COMMENT_ID_MISMATCH')
          if c.get('user',{}).get('login') != 'ohw3rz5578d277e-collab': raise SystemExit('OWNER_COMMENT_ACTOR_MISMATCH')
          if c.get('body') != os.environ['COMMAND_BODY']: raise SystemExit('OWNER_COMMENT_BODY_MISMATCH')
          if not str(c.get('issue_url','')).endswith('/issues/26'): raise SystemExit('OWNER_COMMENT_ISSUE_MISMATCH')
          if c.get('created_at') != c.get('updated_at'): raise SystemExit('OWNER_COMMENT_EDITED')
          created=datetime.fromisoformat(str(c.get('created_at','')).replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-created).total_seconds()
          if age < -30: raise SystemExit('OWNER_COMMENT_FROM_FUTURE')
          if age > 900: raise SystemExit(f'OWNER_COMMENT_NOT_FRESH:age_seconds={age:.0f}')
          print('OWNER_LINE_LOGIN_STAGE_BRIDGE_AUTHORIZATION=PASS')
          PY
          rm -f /tmp/member-line-login-stage-owner-comment.json

          command_sha256="$(printf '%s' "$COMMAND_BODY" | sha256sum | awk '{print $1}')"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "route_stage_run_id=$route_stage_run_id" >> "$GITHUB_OUTPUT"
          echo "route_promotion_run_id=$route_promotion_run_id" >> "$GITHUB_OUTPUT"
          echo "active_version_id=$active_version_id" >> "$GITHUB_OUTPUT"
          echo "owner_comment_id=$OWNER_COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "bridge_run_id=$BRIDGE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "command_sha256=$command_sha256" >> "$GITHUB_OUTPUT"
          echo 'MEMBER_LINE_LOGIN_STAGE_COMMAND=PASS'
          echo 'MEMBER_LINE_LOGIN_STAGE_BRIDGE_RUN_ATTEMPT=1'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_D1_WRITE=0'

      - name: Reject instead of queueing behind another Production mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sleep 2
          workflows=(
            dispatch-production-deploy-from-issue.yml
            dispatch-member-schema-apply-from-issue.yml
            dispatch-member-production-runtime-secret-stage-from-issue.yml
            dispatch-member-production-runtime-version-promotion-from-issue.yml
            dispatch-member-production-version-promotion-from-issue.yml
            dispatch-member-production-route-stage-from-issue.yml
            dispatch-member-production-line-login-stage-from-issue.yml
            deploy-cloudflare.yml
            member-production-schema-apply.yml
            member-production-runtime-secret-stage.yml
            member-production-runtime-version-promotion.yml
            member-production-version-promotion.yml
            member-production-route-stage.yml
            member-production-line-login-stage.yml
          )
          statuses=(queued in_progress waiting pending requested)
          for workflow in "${workflows[@]}"; do
            for status in "${statuses[@]}"; do
              code="$(curl --silent --show-error --output /tmp/member-line-login-stage-conflicts.json --write-out '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=$status&per_page=100")"
              if [[ "$code" == 404 ]]; then
                continue
              fi
              test "$code" = 200 || { cat /tmp/member-line-login-stage-conflicts.json >&2 || true; exit 1; }
              conflicts="$(WORKFLOW="$workflow" THIS_RUN_ID="$THIS_RUN_ID" python3 - <<'PY'
          import json, os
          with open('/tmp/member-line-login-stage-conflicts.json', encoding='utf-8') as f:
              runs=json.load(f).get('workflow_runs',[])
          workflow=os.environ['WORKFLOW']
          me=int(os.environ['THIS_RUN_ID'])
          direct_mutation_workflows={
              'member-production-schema-apply.yml',
              'member-production-runtime-secret-stage.yml',
              'member-production-runtime-version-promotion.yml',
              'member-production-version-promotion.yml',
              'member-production-route-stage.yml',
              'member-production-line-login-stage.yml',
          }
          def is_actual_mutation(run):
              if int(run.get('id',0))==me:
                  return False
              event=run.get('event')
              title=str(run.get('display_title',''))
              if workflow=='deploy-cloudflare.yml':
                  return event=='workflow_dispatch' and not title.startswith('CRM Production preflight ')
              if workflow in direct_mutation_workflows:
                  return event=='workflow_dispatch'
              if workflow.startswith('dispatch-'):
                  if title.startswith('Production read-only bridge:') or title=='Production bridge: ignored':
                      return False
                  return title.startswith('Production mutation bridge:') or event=='issue_comment'
              return False
          print(sum(1 for run in runs if is_actual_mutation(run)))
          PY
              )"
              test "$conflicts" = 0 || { echo "::error::PRODUCTION_MUTATION_BUSY_RETRY_REQUIRED workflow=$workflow status=$status count=$conflicts"; exit 1; }
            done
          done
          rm -f /tmp/member-line-login-stage-conflicts.json
          echo 'PRODUCTION_MUTATION_DISPATCH_GATE=FREE'
          echo 'PRODUCTION_MUTATION_QUEUE_POLICY=REJECT_AND_RETRY'
          echo 'PRODUCTION_MUTATION_FILTER=ACTUAL_MUTATIONS_ONLY'

      - name: Create validated stage dispatch receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          ROUTE_STAGE_RUN_ID: ${{ steps.gate.outputs.route_stage_run_id }}
          ROUTE_PROMOTION_RUN_ID: ${{ steps.gate.outputs.route_promotion_run_id }}
          ACTIVE_VERSION_ID: ${{ steps.gate.outputs.active_version_id }}
          OWNER_COMMENT_ID: ${{ steps.gate.outputs.owner_comment_id }}
          BRIDGE_RUN_ID: ${{ steps.gate.outputs.bridge_run_id }}
          COMMAND_SHA256: ${{ steps.gate.outputs.command_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          receipt={
            'schema':'member-line-login-stage-dispatch-receipt-v1',
            'repository':os.environ['GITHUB_REPOSITORY'],
            'bridge_workflow_path':'.github/workflows/dispatch-member-production-line-login-stage-from-issue.yml',
            'bridge_run_id':int(os.environ['BRIDGE_RUN_ID']),
            'bridge_run_attempt':1,
            'expected_sha':os.environ['EXPECTED_SHA'],
            'route_stage_run_id':int(os.environ['ROUTE_STAGE_RUN_ID']),
            'route_promotion_run_id':int(os.environ['ROUTE_PROMOTION_RUN_ID']),
            'active_version_id':os.environ['ACTIVE_VERSION_ID'],
            'owner_comment_id':int(os.environ['OWNER_COMMENT_ID']),
            'confirmation':'STAGE_MEMBER_LINE_LOGIN_CANDIDATE',
            'command_sha256':os.environ['COMMAND_SHA256'],
          }
          with open('/tmp/member-line-login-stage-dispatch-receipt.json','w',encoding='utf-8') as f:
              json.dump(receipt,f,sort_keys=True,separators=(',',':'))
              f.write('\n')
          print('MEMBER_LINE_LOGIN_STAGE_DISPATCH_RECEIPT=PASS')
          PY
          chmod 600 /tmp/member-line-login-stage-dispatch-receipt.json

      - name: Upload short-lived validated dispatch receipt
        uses: actions/upload-artifact@v4
        with:
          name: member-line-login-stage-dispatch-receipt-${{ github.run_id }}
          path: /tmp/member-line-login-stage-dispatch-receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Bridge completion receipt
        shell: bash
        run: |
          echo 'MEMBER_LINE_LOGIN_STAGE_BRIDGE=PASS'
          echo 'MEMBER_LINE_LOGIN_STAGE_BRIDGE_COMPLETION_REQUIRED_BEFORE_DISPATCH=YES'
          echo 'WORKFLOW_DISPATCH=0'
          echo 'PRODUCTION_MUTATION=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_OBJECT_WRITE=0'