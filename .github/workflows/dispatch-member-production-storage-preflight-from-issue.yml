name: Dispatch Member Production storage preflight from release-gate issue

run-name: 'Production read-only bridge: storage-preflight'

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: member-production-storage-preflight-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate exact Member storage preflight command and dispatch
    if: >-
      github.event.issue.number == 26 &&
      github.event.issue.pull_request == null &&
      github.actor == 'ohw3rz5578d277e-collab' &&
      github.event.comment.user.login == 'ohw3rz5578d277e-collab' &&
      startsWith(github.event.comment.body, '/member-production-storage-preflight ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact Owner command and current main
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          command_re='^/member-production-storage-preflight sha=([0-9a-f]{40}) mode=(inventory|verify) jurisdictions=([a-z,-]+)( candidate_bucket_sha256=([0-9a-f]{64}))?$'
          [[ "$COMMAND_BODY" =~ $command_re ]] || { echo '::error::INVALID_MEMBER_STORAGE_PREFLIGHT_COMMAND'; exit 1; }

          expected_sha="${BASH_REMATCH[1]}"
          mode="${BASH_REMATCH[2]}"
          jurisdictions="${BASH_REMATCH[3]}"
          candidate_sha256="${BASH_REMATCH[5]:-}"

          test -n "$jurisdictions" || { echo '::error::R2_JURISDICTIONS_REQUIRED'; exit 1; }
          IFS=',' read -r -a jurisdiction_parts <<< "$jurisdictions"
          last_index=-1
          declare -A seen=()
          for jurisdiction in "${jurisdiction_parts[@]}"; do
            case "$jurisdiction" in
              default) index=0 ;;
              eu) index=1 ;;
              us) index=2 ;;
              fedramp) index=3 ;;
              fedramp-high) index=4 ;;
              *) echo '::error::INVALID_R2_JURISDICTION'; exit 1 ;;
            esac
            [[ -z "${seen[$jurisdiction]:-}" ]] || { echo '::error::DUPLICATE_R2_JURISDICTION'; exit 1; }
            (( index > last_index )) || { echo '::error::R2_JURISDICTIONS_NOT_CANONICAL_ORDER'; exit 1; }
            seen[$jurisdiction]=1
            last_index=$index
          done

          if [[ "$mode" == 'inventory' ]]; then
            test -z "$candidate_sha256" || { echo '::error::INVENTORY_MODE_FORBIDS_CANDIDATE_BUCKET_DIGEST'; exit 1; }
          else
            [[ "$candidate_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::VERIFY_MODE_REQUIRES_CANDIDATE_BUCKET_SHA256'; exit 1; }
          fi

          current_sha="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
          )"
          test "$current_sha" = "$expected_sha" || { echo "::error::MAIN_DRIFT expected=$expected_sha current=$current_sha"; exit 1; }

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "jurisdictions=$jurisdictions" >> "$GITHUB_OUTPUT"
          echo "candidate_bucket_sha256=$candidate_sha256" >> "$GITHUB_OUTPUT"
          echo "MEMBER_STORAGE_PREFLIGHT_AUTHORIZED_SHA=$expected_sha"
          echo "MEMBER_STORAGE_PREFLIGHT_MODE=$mode"
          echo "R2_JURISDICTIONS_AUTHORIZED=$jurisdictions"
          echo 'CANDIDATE_BUCKET_NAME_EXPOSED=NO'
          echo 'PRODUCTION_STORAGE_BINDING_CHANGE=0'
          echo 'PRODUCTION_STORAGE_FETCH=0'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_WRITE=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_D1_WRITE=0'

      - name: Dispatch exact read-only Member storage preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          MODE: ${{ steps.gate.outputs.mode }}
          JURISDICTIONS: ${{ steps.gate.outputs.jurisdictions }}
          CANDIDATE_BUCKET_SHA256: ${{ steps.gate.outputs.candidate_bucket_sha256 }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              'ref':'main',
              'inputs':{
                  'expected_sha':os.environ['EXPECTED_SHA'],
                  'mode':os.environ['MODE'],
                  'jurisdictions':os.environ['JURISDICTIONS'],
                  'candidate_bucket_sha256':os.environ.get('CANDIDATE_BUCKET_SHA256','')
              }
          }))
          PY
          )"
          code="$(
            curl --silent --show-error \
              --output /tmp/member-storage-preflight-dispatch.txt \
              --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/member-production-storage-preflight.yml/dispatches" \
              -d "$payload"
          )"
          test "$code" = '204' || {
            cat /tmp/member-storage-preflight-dispatch.txt >&2 || true
            echo "::error::MEMBER_STORAGE_PREFLIGHT_DISPATCH_FAILED_HTTP_$code"
            exit 1
          }
          rm -f /tmp/member-storage-preflight-dispatch.txt
          echo "MEMBER_STORAGE_PREFLIGHT_DISPATCHED_SHA=$EXPECTED_SHA"
          echo "MEMBER_STORAGE_PREFLIGHT_DISPATCHED_MODE=$MODE"
          echo "R2_JURISDICTIONS_DISPATCHED=$JURISDICTIONS"
          echo 'CANDIDATE_BUCKET_NAME_EXPOSED=NO'
          echo 'PRODUCTION_STORAGE_BINDING_CHANGE=0'
          echo 'PRODUCTION_STORAGE_FETCH=0'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_WRITE=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_D1_WRITE=0'
