name: CRM mobile owner interaction recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/crm-mobile-owner-interaction-recovery.mjs'
      - 'src/crm-mobile-owner-card-summary.mjs'
      - 'src/crm-owner-view-state.mjs'
      - 'src/crm-owner-view-state-v2.mjs'
      - 'src/crm-owner-app-shell.mjs'
      - 'src/crm-customer-list-daily-operations.mjs'
      - 'src/crm-customer360-*.mjs'
      - 'src/customer-identity-resolver.mjs'
      - 'src/production-index-crm-customer360-entry.js'
      - 'migrations_managed/20260903_customer360_profile_auto_enrichment.sql'
      - 'tests/**'
      - '.github/workflows/crm-mobile-owner-interaction-recovery.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard scope and Production safety
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf 'CHANGED_FILE=%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0
          mapfile -t migrations < <(printf '%s\n' "${changed[@]}" | grep -E '^(migrations/|migrations_managed/)' || true)
          for path in "${migrations[@]}"; do
            test "$path" = 'migrations_managed/20260903_customer360_profile_auto_enrichment.sql' || { echo "::error::Unauthorized migration: $path"; exit 1; }
          done
          if test -f migrations_managed/20260903_customer360_profile_auto_enrichment.sql; then
            ! grep -E "DROP[[:space:]]+(TABLE|COLUMN)|ALTER[[:space:]]+TABLE[[:space:]]+customers|customer_identity_(sequence|registry)" migrations_managed/20260903_customer360_profile_auto_enrichment.sql
          fi
          mapfile -t identity_changed < <(printf '%s\n' "${changed[@]}" | grep -E '^src/.*(identity|customer-id|canonical-customer)' || true)
          for path in "${identity_changed[@]}"; do
            case "$path" in
              src/customer-identity-resolver.mjs|src/crm-customer-id-autofill-runtime.mjs) ;;
              *) echo "::error::Unexpected identity source change: $path"; exit 1 ;;
            esac
          done
          echo 'IDENTITY_SOURCE_CHANGE=0'
          echo "AUTHORIZED_ADDITIVE_MIGRATION_COUNT=${#migrations[@]}"
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'PRODUCTION_CUSTOMER_WRITE=0'
          echo 'PRODUCTION_ID_GENERATION=0'
          echo 'PRODUCTION_SEQUENCE_UPDATE=0'
          echo 'LINE_SEND=0'
          echo 'DEPLOY=0'
          echo 'MERGE=0'
          echo 'CUSTOMER360_WRITE_ENABLE=0'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install browser and Wrangler tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 wrangler@4.33.1
          npx playwright install --with-deps chromium

      - name: Syntax and canonical mobile contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/crm-mobile-owner-interaction-recovery.mjs
          node --check src/crm-mobile-owner-card-summary.mjs
          node --check src/crm-owner-view-state.mjs
          node --check src/crm-owner-view-state-v2.mjs
          node --check src/crm-owner-app-shell.mjs
          node --check src/crm-customer-id-autofill-runtime.mjs
          node --check src/customer-identity-resolver.mjs
          node --check src/crm-customer360-profile-enrichment.mjs
          node --check src/crm-customer360-line-profile-extraction.mjs
          node --check src/crm-customer360-profile-ui-client.mjs
          node --check src/production-index-crm-customer360-entry.js
          node tests/crm-mobile-owner-interaction-recovery.mjs
          node tests/customer360-profile-auto-enrichment.mjs

      - name: CRM prefixed full regression
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'crm-*.mjs' -printf '%p\n' | sort)
          for test_file in "${tests[@]}"; do echo "::group::$test_file"; node "$test_file"; echo '::endgroup::'; done
          echo "CRM_TEST_FILES=${#tests[@]} PASS"

      - name: Customer prefixed full regression
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'customer*.mjs' -printf '%p\n' | sort)
          for test_file in "${tests[@]}"; do echo "::group::$test_file"; node "$test_file"; echo '::endgroup::'; done
          echo "CUSTOMER_TEST_FILES=${#tests[@]} PASS"

      - name: Deploy prefixed full regression
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'deploy*.mjs' -printf '%p\n' | sort)
          for test_file in "${tests[@]}"; do echo "::group::$test_file"; node "$test_file"; echo '::endgroup::'; done
          echo "DEPLOY_TEST_FILES=${#tests[@]} PASS"

      - name: Remaining full regression
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' ! -name 'crm-*.mjs' ! -name 'customer*.mjs' ! -name 'deploy*.mjs' -printf '%p\n' | sort)
          for test_file in "${tests[@]}"; do echo "::group::$test_file"; node "$test_file"; echo '::endgroup::'; done
          echo "REMAINING_TEST_FILES=${#tests[@]} PASS"

      - name: Production entry import and Wrangler dry-run only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          set -euo pipefail
          node -e "import('./src/production-index-crm-customer360-entry.js').then(()=>console.log('PRODUCTION_ENTRY_IMPORT=PASS'))"
          npx wrangler deploy --dry-run --outdir /tmp/crm-mobile-owner-interaction-dry-run
          test -n "$(find /tmp/crm-mobile-owner-interaction-dry-run -type f -print -quit)"
          echo 'WRANGLER_DRY_RUN=PASS'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'PRODUCTION_ID_GENERATION=0'
          echo 'PRODUCTION_SEQUENCE_UPDATE=0'
          echo 'WORKER_DEPLOY=0'
          echo 'PAGES_PRODUCTION_DEPLOY=0'
          echo 'LINE_SEND=0'

      - name: Upload Owner acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-mobile-owner-interaction-recovery-screenshots
          path: artifacts/crm-mobile-owner-interaction/
          if-no-files-found: error
          retention-days: 7
