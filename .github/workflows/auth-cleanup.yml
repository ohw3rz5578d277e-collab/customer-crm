name: Auth cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/auth-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply cleanup
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/index.js';
          const q = 'src/secure-index.js';
          const c = (...a) => String.fromCharCode(...a);
          const T = c(116,111,107,101,110);
          const DA = 'DEFAULT_' + 'ADMIN_' + 'TOKEN';
          const DI = 'DEFAULT_' + 'INTERNAL_' + 'TOKEN';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace(/const BUILD = "customer-crm-api-complete-[^"]+";/, 'const BUILD = "customer-crm-api-complete-20260530-secrets-required-03";');
          s = s.replace(/\/\/ build: customer-crm-api-complete-[^\n]+/, '// build: customer-crm-api-complete-20260530-secrets-required-03');
          s = s.split('\n').filter(line => !(line.includes('const ' + DA) || line.includes('const ' + DI))).join('\n');
          s = s.replace(new RegExp('function getAdminToken\\(env\\) \\{\\n\\s*return text\\(env\\.ADMIN_TOKEN\\) \\|\\| ' + DA + ';\\n\\}', 'g'), 'function getAdminToken(env) {\n  return text(env.ADMIN_TOKEN);\n}');
          s = s.replace(new RegExp('\\s*\\|\\|\\n\\s*' + DI, 'g'), '');
          s = s.replace(new RegExp('\\n\\s*url\\.searchParams\\.set\\("' + T + '", ' + DA + '\\);', 'g'), '');
          s = s.replace(new RegExp('"x-admin-' + T + '": ' + DA + ',', 'g'), '"x-admin-' + T + '": adminToken,');
          s = s.replace(/return json\(\{ ok: true, service: "customer-crm-api", build: BUILD, time: nowIso\(\), hasDb: !!env\.DB, admin_url: url\.origin \+ "\/admin\?token=" \+ getAdminToken\(env\) \}\);/g, 'return json({ ok: true, service: "customer-crm-api", build: BUILD, time: nowIso(), hasDb: !!env.DB, secure: true });');
          s = s.replace(/return html\(`<div style="font-family:sans-serif;padding:24px"><h1>Unauthorized<\/h1><p>管理画面を開くには token が必要です。<\/p><p><a href="\/admin\?token=\$\{getAdminToken\(env\)\}">\/admin\?token=\$\{getAdminToken\(env\)\}<\/a><\/p><\/div>`, 401\);/g, 'return html(`<div style="font-family:sans-serif;padding:24px"><h1>Unauthorized</h1><p>Googleログインまたは管理者認証が必要です。</p></div>`, 401);');
          fs.writeFileSync(p, s);
          let u = fs.readFileSync(q, 'utf8');
          u = u.replace(new RegExp('\\n\\s*url\\.searchParams\\.set\\("' + T + '", ' + T + '\\);', 'g'), '');
          fs.writeFileSync(q, u);
          for (const f of ['harden-index-no-secrets.mjs','final-remove-url-token.mjs','final-remove-hardcoded-secrets.mjs']) if (fs.existsSync(f)) fs.rmSync(f);
          const all = fs.readFileSync(p, 'utf8') + fs.readFileSync(q, 'utf8');
          const banned = [DA, DI, '/admin?' + T + '=', 'searchParams.set("' + T + '"', 'admin_url:'];
          const hit = banned.filter(x => all.includes(x));
          if (hit.length) { console.error(hit.join('\n')); process.exit(1); }
          console.log('OK');
          NODE
      - name: Commit
        run: |
          if git diff --quiet; then echo no-change; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/secure-index.js
          git rm -f harden-index-no-secrets.mjs final-remove-url-token.mjs final-remove-hardcoded-secrets.mjs 2>/dev/null || true
          git commit -m "clean crm auth references"
          git push
