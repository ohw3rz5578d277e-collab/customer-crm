name: Member Production schema preflight

on:
  pull_request:
    paths:
      - '.github/workflows/member-production-schema-preflight.yml'
      - '.github/workflows/dispatch-member-schema-preflight-from-issue.yml'
      - 'migrations_managed/20260924_member_*.sql'
      - 'tests/member-production-schema-preflight-contract.test.mjs'
      - 'docs/member-app/member-production-schema-preflight.md'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA authorized for read-only Member schema preflight
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'member-production-schema-preflight' || format('member-schema-preflight-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  contract:
    name: Member schema preflight contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Member schema preflight contract
        run: node tests/member-production-schema-preflight-contract.test.mjs

  preflight:
    name: Exact-SHA Member Production schema preflight
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA_RAW: ${{ inputs.expected_sha }}
    steps:
      - name: Normalize and validate authorized SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(printf '%s' "$EXPECTED_SHA_RAW" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::INVALID_EXPECTED_SHA'; exit 1; }
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "AUTHORIZED_SHA=$expected_sha"

      - name: Checkout exact authorized SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.expected_sha }}
          fetch-depth: 0

      - name: Exact SHA and current-main gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA" || { echo "::error::CHECKOUT_SHA_MISMATCH actual=$actual_sha expected=$EXPECTED_SHA"; exit 1; }
          test "$current_main" = "$EXPECTED_SHA" || { echo "::error::MAIN_DRIFT current=$current_main expected=$EXPECTED_SHA"; exit 1; }
          echo "EXACT_SHA_GATE=PASS"
          echo "CURRENT_MAIN_SHA=$current_main"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify additive Member migration contract
        run: node tests/member-production-schema-preflight-contract.test.mjs

      - name: Install Wrangler tooling
        run: npm install --no-save wrangler@4.36.0

      - name: Confirm Cloudflare authentication
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler whoami >/tmp/member-schema-whoami.txt
          test -s /tmp/member-schema-whoami.txt
          echo 'CLOUDFLARE_AUTH=PASS'

      - name: List pending managed remote D1 migrations
        id: pending
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 migrations list customer-crm-db --remote

      - name: Read Member Production schema state
        id: remote
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute customer-crm-db --remote --json --command "SELECT name,type FROM sqlite_master WHERE name IN ('customer_family_groups','customer_family_customer_links','member_memories','member_memory_media','member_memory_favorites','member_favorite_mutation_rate_limits','member_family_pass_entitlements','member_public_assets','member_creative_templates','member_shop_products','member_news_items') ORDER BY name; SELECT name FROM d1_migrations_managed WHERE name LIKE '20260924_member_%' ORDER BY name;"

      - name: Classify exact Member schema state
        shell: bash
        env:
          PENDING_OUTPUT: ${{ steps.pending.outputs.command-output }}
          REMOTE_OUTPUT: ${{ steps.remote.outputs.command-output }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const pending=process.env.PENDING_OUTPUT||'';
          const remote=process.env.REMOTE_OUTPUT||'';

          const known=[
            '20260924_member_creative_catalog_foundation.sql',
            '20260924_member_family_identity_foundation.sql',
            '20260924_member_family_pass_entitlement_foundation.sql',
            '20260924_member_favorite_mutation_rate_limit_foundation.sql',
            '20260924_member_memory_core_foundation.sql',
            '20260924_member_memory_favorites_foundation.sql',
            '20260924_member_news_catalog_foundation.sql',
            '20260924_member_public_asset_registry_foundation.sql',
            '20260924_member_shop_catalog_foundation.sql'
          ];
          const expectedTables=[
            'customer_family_groups',
            'customer_family_customer_links',
            'member_memories',
            'member_memory_media',
            'member_memory_favorites',
            'member_favorite_mutation_rate_limits',
            'member_family_pass_entitlements',
            'member_public_assets',
            'member_creative_templates',
            'member_shop_products',
            'member_news_items'
          ];

          const files=[];
          for(const match of pending.matchAll(/[A-Za-z0-9_.-]+\.sql/g)){
            if(!files.includes(match[0]))files.push(match[0]);
          }
          const unknown=files.filter(x=>!known.includes(x));
          if(unknown.length)throw new Error(`BLOCKED_NON_MEMBER_PENDING_MIGRATION:${unknown.join(',')}`);

          const pendingMember=files.filter(x=>known.includes(x));
          const missingPending=known.filter(x=>!pendingMember.includes(x));
          const tablesPresent=expectedTables.filter(x=>remote.includes(x));
          const tracked=known.filter(x=>remote.includes(x));

          const cleanAllPending=
            pendingMember.length===known.length &&
            missingPending.length===0 &&
            tablesPresent.length===0 &&
            tracked.length===0;

          const alreadyApplied=
            pendingMember.length===0 &&
            tablesPresent.length===expectedTables.length &&
            tracked.length===known.length;

          if(cleanAllPending){
            console.log('MEMBER_SCHEMA_CLASSIFICATION=ALL_9_PENDING_CLEAN');
          }else if(alreadyApplied){
            console.log('MEMBER_SCHEMA_CLASSIFICATION=ALREADY_APPLIED_CONFIRMED');
          }else{
            throw new Error(
              `INCONSISTENT_MEMBER_SCHEMA_STATE:pending=${pendingMember.length},missingPending=${missingPending.join(',')||'NONE'},tablesPresent=${tablesPresent.length},tracked=${tracked.length}`
            );
          }

          console.log(`MEMBER_PENDING_MIGRATION_COUNT=${pendingMember.length}`);
          console.log(`MEMBER_PENDING_MIGRATIONS=${pendingMember.join(',')||'NONE'}`);
          console.log(`MEMBER_SCHEMA_TABLES_PRESENT=${tablesPresent.join(',')||'NONE'}`);
          console.log(`MEMBER_SCHEMA_TRACKED_MIGRATIONS=${tracked.join(',')||'NONE'}`);
          console.log('MEMBER_SCHEMA_PREFLIGHT_READ_ONLY=PASS');
          console.log('MEMBER_SCHEMA_APPLY=0');
          console.log('PRODUCTION_D1_WRITE=0');
          console.log('PRODUCTION_DEPLOY=0');
          console.log('MEMBER_ROUTE_ACTIVATION=0');
          console.log('LINE_SEND=0');
          NODE

      - name: Final read-only safety declaration
        run: |
          echo 'MEMBER_SCHEMA_PREFLIGHT=PASS'
          echo 'MEMBER_SCHEMA_APPLY=0'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'CRM_WRITE=0'
          echo 'LINE_SEND=0'
