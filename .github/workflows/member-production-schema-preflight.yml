name: Member Production schema preflight

on:
  pull_request:
    paths:
      - '.github/workflows/member-production-schema-preflight.yml'
      - '.github/workflows/dispatch-member-schema-preflight-from-issue.yml'
      - 'migrations_managed/20261007_member_identity_prospect_foundation.sql'
      - 'migrations_managed/20261009_member_registration_consent_event_foundation.sql'
      - 'src/member-production-runtime-schema-readiness.mjs'
      - 'src/member-production-lifecycle-schema-gate.mjs'
      - 'member_tests/member-production-lifecycle-schema-gate.test.mjs'
      - 'tests/member-production-schema-preflight-contract.test.mjs'
      - 'tests/member-production-lifecycle-schema-gate.test.mjs'
      - 'docs/member-app/member-production-schema-preflight.md'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA authorized for read-only Member lifecycle schema preflight
        required: true
        type: string
      owner_comment_id:
        description: Exact Owner authorization comment ID from release-gate issue #26
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'member-production-schema-preflight' || format('member-schema-preflight-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  contract:
    name: Member schema preflight contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Member schema preflight contract
        run: |
          node tests/member-production-schema-preflight-contract.test.mjs
          node tests/member-production-lifecycle-schema-gate.test.mjs

  preflight:
    name: Exact-SHA read-only Member lifecycle schema preflight
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA_RAW: ${{ inputs.expected_sha }}
      OWNER_COMMENT_ID_RAW: ${{ inputs.owner_comment_id }}
    steps:
      - name: Normalize and validate authorization inputs
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(printf '%s' "$EXPECTED_SHA_RAW" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::INVALID_EXPECTED_SHA'; exit 1; }
          [[ "$OWNER_COMMENT_ID_RAW" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_OWNER_COMMENT_ID'; exit 1; }
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "owner_comment_id=$OWNER_COMMENT_ID_RAW" >> "$GITHUB_OUTPUT"
          echo "MEMBER_LIFECYCLE_SCHEMA_PREFLIGHT_AUTHORIZED_SHA=$expected_sha"
      - name: Checkout exact authorized SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.auth.outputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact SHA and current-main gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA" || { echo "::error::CHECKOUT_SHA_MISMATCH actual=$actual_sha expected=$EXPECTED_SHA"; exit 1; }
          test "$current_main" = "$EXPECTED_SHA" || { echo "::error::MAIN_DRIFT current=$current_main expected=$EXPECTED_SHA"; exit 1; }
          echo 'EXACT_SHA_GATE=PASS'
      - name: Verify exact Owner authorization receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
          OWNER_COMMENT_ID: ${{ steps.auth.outputs.owner_comment_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$OWNER_COMMENT_ID" > /tmp/member-schema-preflight-owner-comment.json
          export EXPECTED_BODY="/member-schema-preflight sha=$EXPECTED_SHA"
          python3 - <<'PY'
          import json, os
          with open('/tmp/member-schema-preflight-owner-comment.json', encoding='utf-8') as f: c=json.load(f)
          if c.get('user',{}).get('login')!='ohw3rz5578d277e-collab': raise SystemExit('OWNER_COMMENT_ACTOR_MISMATCH')
          if c.get('body')!=os.environ['EXPECTED_BODY']: raise SystemExit('OWNER_COMMENT_BODY_MISMATCH')
          if not str(c.get('issue_url','')).endswith('/issues/26'): raise SystemExit('OWNER_COMMENT_ISSUE_MISMATCH')
          print('OWNER_AUTHORIZATION_COMMENT=PASS')
          PY
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify lifecycle schema gate contract
        run: |
          node tests/member-production-schema-preflight-contract.test.mjs
          node tests/member-production-lifecycle-schema-gate.test.mjs
      - name: Install Wrangler tooling
        run: npm install --no-save wrangler@4.36.0
      - name: Confirm Cloudflare authentication
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler whoami >/tmp/member-schema-whoami.txt
          test -s /tmp/member-schema-whoami.txt
          echo 'CLOUDFLARE_AUTH=PASS'
      - name: List pending managed remote D1 migrations
        id: pending
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 migrations list customer-crm-db --remote
      - name: Read exact Member lifecycle schema receipts
        id: remote
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute customer-crm-db --remote --json --command "SELECT name,type,tbl_name FROM sqlite_master WHERE name COLLATE NOCASE IN ('customer_family_groups','customer_family_customer_links','member_memories','member_memory_media','member_memory_favorites','member_favorite_mutation_rate_limits','member_family_pass_entitlements','member_public_assets','member_creative_templates','member_shop_products','member_news_items','member_identities','member_prospects','member_customer_invitations','member_profile_change_review_queue','member_registration_events','member_consent_evidence','idx_member_identity_customer','idx_member_identity_prospect','idx_member_customer_invitation_customer','idx_member_registration_events_member_time','idx_member_registration_events_prospect_time','idx_member_consent_evidence_member_time','idx_member_consent_evidence_prospect_time','trg_member_registration_events_no_update','trg_member_registration_events_no_delete','trg_member_consent_evidence_no_update','trg_member_consent_evidence_no_delete') ORDER BY name; SELECT name FROM d1_migrations_managed WHERE name IN ('20260924_member_creative_catalog_foundation.sql','20260924_member_family_identity_foundation.sql','20260924_member_family_pass_entitlement_foundation.sql','20260924_member_favorite_mutation_rate_limit_foundation.sql','20260924_member_memory_core_foundation.sql','20260924_member_memory_favorites_foundation.sql','20260924_member_news_catalog_foundation.sql','20260924_member_public_asset_registry_foundation.sql','20260924_member_shop_catalog_foundation.sql','20261007_member_identity_prospect_foundation.sql','20261009_member_registration_consent_event_foundation.sql') ORDER BY name;"
      - name: Require exact lifecycle-pending Production state
        shell: bash
        env:
          PENDING_OUTPUT: ${{ steps.pending.outputs.command-output }}
          REMOTE_OUTPUT: ${{ steps.remote.outputs.command-output }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { requireMemberLifecyclePreApplyState } from './src/member-production-lifecycle-schema-gate.mjs';
          const result=requireMemberLifecyclePreApplyState({pendingOutput:process.env.PENDING_OUTPUT||'',schemaOutput:process.env.REMOTE_OUTPUT||''});
          console.log(`MEMBER_SCHEMA_PREFLIGHT_CLASSIFICATION=${result.status}`);
          console.log(`MEMBER_LIFECYCLE_PENDING_COUNT=${result.runtime.pending.lifecycle.length}`);
          console.log(`MEMBER_LIFECYCLE_PENDING_MIGRATIONS=${result.runtime.pending.lifecycle.join(',')}`);
          console.log(`MEMBER_LIFECYCLE_SCHEMA_OBJECTS_PRESENT=${result.evidence.present_lifecycle_schema_objects.join(',')||'NONE'}`);
          console.log('MEMBER_SCHEMA_PREFLIGHT_READ_ONLY=PASS');
          console.log('MEMBER_SCHEMA_APPLY=0');
          console.log('PRODUCTION_D1_WRITE=0');
          NODE
      - name: Final read-only safety declaration
        run: |
          echo 'MEMBER_LIFECYCLE_SCHEMA_PREFLIGHT=PASS'
          echo 'MEMBER_SCHEMA_APPLY=0'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'MEMBER_ROUTE_ACTIVATION=0'
          echo 'CRM_WRITE=0'
          echo 'LINE_SEND=0'
