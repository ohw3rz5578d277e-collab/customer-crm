name: Member Production staged version promotion

on:
  pull_request:
    paths:
      - '.github/workflows/member-production-version-promotion.yml'
      - '.github/workflows/dispatch-member-production-version-promotion-from-issue.yml'
      - 'tests/member-production-version-promotion-contract.test.mjs'
      - 'docs/member-app/member-production-version-promotion.md'
      - 'release/member/member-production-runtime-secret-stage-36285531724.json'
      - '.github/workflows/member-app-foundation.yml'
  workflow_call:
    inputs:
      expected_sha:
        description: Exact current main SHA freshly authorized by Owner
        required: true
        type: string
      staged_version_id:
        description: Exact immutable staged Worker version ID
        required: true
        type: string
      expected_active_version_id:
        description: Exact currently active 100%-traffic Worker version the Owner authorizes replacing
        required: true
        type: string
      staging_run_id:
        description: Exact successful staging workflow run ID
        required: true
        type: string
      owner_comment_id:
        description: Fresh Owner authorization comment ID from release-gate issue #26
        required: true
        type: string
      bridge_run_id:
        description: Exact issue-comment bridge run ID
        required: true
        type: string
      bridge_run_attempt:
        description: Exact first-attempt bridge run attempt
        required: true
        type: string
      confirmation:
        description: Exact promotion confirmation token
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('member-production-version-promotion-pr-{0}', github.event.pull_request.number) || 'customer-crm-production-deploy' }}
  cancel-in-progress: false

jobs:
  contract:
    name: Member Production promotion contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Verify promotion workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" .github/workflows/member-production-version-promotion.yml
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0])" .github/workflows/dispatch-member-production-version-promotion-from-issue.yml
          echo 'MEMBER_PRODUCTION_PROMOTION_WORKFLOW_YAML=PASS'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify promotion contract
        run: node tests/member-production-version-promotion-contract.test.mjs

  promote:
    name: Owner-gated exact staged version Production promotion
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA_RAW: ${{ inputs.expected_sha }}
      STAGED_VERSION_ID_RAW: ${{ inputs.staged_version_id }}
      EXPECTED_ACTIVE_VERSION_ID_RAW: ${{ inputs.expected_active_version_id }}
      STAGING_RUN_ID_RAW: ${{ inputs.staging_run_id }}
      OWNER_COMMENT_ID_RAW: ${{ inputs.owner_comment_id }}
      BRIDGE_RUN_ID_RAW: ${{ inputs.bridge_run_id }}
      BRIDGE_RUN_ATTEMPT_RAW: ${{ inputs.bridge_run_attempt }}
      CONFIRMATION_RAW: ${{ inputs.confirmation }}
      STAGING_SOURCE_SHA: 41059eb0ca192f29f790abfd4563552581b1a6b8
      AUTHORIZED_STAGED_VERSION_ID: 6dd49589-f01d-473f-876a-034563023b0e
      AUTHORIZED_STAGING_RUN_ID: '36285531724'
      DURABLE_STAGING_RECEIPT: release/member/member-production-runtime-secret-stage-36285531724.json
    steps:
      - name: Normalize and validate exact authorization inputs
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(printf '%s' "$EXPECTED_SHA_RAW" | tr '[:upper:]' '[:lower:]')"
          staged_version_id="$(printf '%s' "$STAGED_VERSION_ID_RAW" | tr '[:upper:]' '[:lower:]')"
          expected_active_version_id="$(printf '%s' "$EXPECTED_ACTIVE_VERSION_ID_RAW" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::INVALID_EXPECTED_SHA'; exit 1; }
          [[ "$staged_version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo '::error::INVALID_STAGED_VERSION_ID'; exit 1; }
          [[ "$expected_active_version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo '::error::INVALID_EXPECTED_ACTIVE_VERSION_ID'; exit 1; }
          [[ "$STAGING_RUN_ID_RAW" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_STAGING_RUN_ID'; exit 1; }
          [[ "$OWNER_COMMENT_ID_RAW" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_OWNER_COMMENT_ID'; exit 1; }
          [[ "$BRIDGE_RUN_ID_RAW" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_BRIDGE_RUN_ID'; exit 1; }
          test "$BRIDGE_RUN_ATTEMPT_RAW" = '1' || { echo '::error::BRIDGE_RERUN_NOT_AUTHORIZED'; exit 1; }
          test "$staged_version_id" = "$AUTHORIZED_STAGED_VERSION_ID" || { echo '::error::UNAUTHORIZED_STAGED_VERSION_ID'; exit 1; }
          test "$STAGING_RUN_ID_RAW" = "$AUTHORIZED_STAGING_RUN_ID" || { echo '::error::UNAUTHORIZED_STAGING_RUN_ID'; exit 1; }
          test "$CONFIRMATION_RAW" = 'PROMOTE_MEMBER_STAGED_VERSION' || { echo '::error::INVALID_PROMOTION_CONFIRMATION'; exit 1; }
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "staged_version_id=$staged_version_id" >> "$GITHUB_OUTPUT"
          echo "expected_active_version_id=$expected_active_version_id" >> "$GITHUB_OUTPUT"
          echo "staging_run_id=$STAGING_RUN_ID_RAW" >> "$GITHUB_OUTPUT"
          echo "owner_comment_id=$OWNER_COMMENT_ID_RAW" >> "$GITHUB_OUTPUT"
          echo "bridge_run_id=$BRIDGE_RUN_ID_RAW" >> "$GITHUB_OUTPUT"
          echo 'bridge_run_attempt=1' >> "$GITHUB_OUTPUT"
          echo "MEMBER_PROMOTION_AUTHORIZED_CURRENT_MAIN=$expected_sha"
          echo "MEMBER_PROMOTION_AUTHORIZED_STAGED_VERSION=$staged_version_id"
          echo "MEMBER_PROMOTION_AUTHORIZED_REPLACED_ACTIVE_VERSION=$expected_active_version_id"
          echo "MEMBER_PROMOTION_STAGING_RUN=$STAGING_RUN_ID_RAW"
          echo "MEMBER_PROMOTION_BRIDGE_RUN=$BRIDGE_RUN_ID_RAW"

      - name: Checkout exact freshly authorized current main
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.auth.outputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Exact current-main and staging lineage gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA" || { echo "::error::CHECKOUT_SHA_MISMATCH actual=$actual_sha expected=$EXPECTED_SHA"; exit 1; }
          test "$current_main" = "$EXPECTED_SHA" || { echo "::error::MAIN_DRIFT current=$current_main expected=$EXPECTED_SHA"; exit 1; }
          git cat-file -e "$STAGING_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$STAGING_SOURCE_SHA" "$EXPECTED_SHA" || { echo '::error::STAGING_SOURCE_NOT_ANCESTOR_OF_CURRENT_MAIN'; exit 1; }
          echo 'CURRENT_MAIN_EXACT_GATE=PASS'
          echo 'STAGING_SOURCE_LINEAGE=PASS'

      - name: Verify invocation is first-attempt Issue 26 bridge run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
          BRIDGE_RUN_ID: ${{ steps.auth.outputs.bridge_run_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BRIDGE_RUN_ID"             > /tmp/member-promotion-bridge-run.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/member-promotion-bridge-run.json', encoding='utf-8') as f:
              r=json.load(f)
          checks={
              'id': r.get('id')==int(os.environ['BRIDGE_RUN_ID']),
              'event': r.get('event')=='issue_comment',
              'path': r.get('path')=='.github/workflows/dispatch-member-production-version-promotion-from-issue.yml',
              'head_sha': r.get('head_sha')==os.environ['EXPECTED_SHA'],
              'run_attempt': r.get('run_attempt')==1,
              'actor': r.get('actor',{}).get('login')=='ohw3rz5578d277e-collab',
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('INVALID_PROMOTION_BRIDGE_RECEIPT:'+','.join(bad))
          print('MEMBER_PROMOTION_ISSUE_BRIDGE_RECEIPT=PASS')
          PY
          rm -f /tmp/member-promotion-bridge-run.json

      - name: Verify fresh unedited Owner authorization comment on issue 26
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
          STAGED_VERSION_ID: ${{ steps.auth.outputs.staged_version_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ steps.auth.outputs.expected_active_version_id }}
          STAGING_RUN_ID: ${{ steps.auth.outputs.staging_run_id }}
          OWNER_COMMENT_ID: ${{ steps.auth.outputs.owner_comment_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$OWNER_COMMENT_ID"             > /tmp/member-promotion-owner-comment.json
          EXPECTED_BODY="/member-production-promote sha=$EXPECTED_SHA staged_version=$STAGED_VERSION_ID staging_run=$STAGING_RUN_ID replace_active_version=$EXPECTED_ACTIVE_VERSION_ID confirm=PROMOTE_MEMBER_STAGED_VERSION"           python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open('/tmp/member-promotion-owner-comment.json', encoding='utf-8') as f:
              c=json.load(f)
          if c.get('user',{}).get('login')!='ohw3rz5578d277e-collab':
              raise SystemExit('OWNER_COMMENT_ACTOR_MISMATCH')
          if c.get('body')!=os.environ['EXPECTED_BODY']:
              raise SystemExit('OWNER_COMMENT_BODY_MISMATCH')
          if not str(c.get('issue_url','')).endswith('/issues/26'):
              raise SystemExit('OWNER_COMMENT_ISSUE_MISMATCH')
          if c.get('created_at')!=c.get('updated_at'):
              raise SystemExit('OWNER_COMMENT_EDITED')
          created=datetime.fromisoformat(str(c.get('created_at','')).replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-created).total_seconds()
          if age < 0 or age > 900:
              raise SystemExit(f'OWNER_COMMENT_NOT_FRESH:age_seconds={age:.0f}')
          print('OWNER_PROMOTION_AUTHORIZATION_COMMENT=PASS')
          print('OWNER_PROMOTION_AUTHORIZATION_FRESHNESS=PASS')
          PY
          rm -f /tmp/member-promotion-owner-comment.json

      - name: Verify durable exact SUCCESS staging receipt and live run metadata when retained
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_VERSION_ID: ${{ steps.auth.outputs.staged_version_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ steps.auth.outputs.expected_active_version_id }}
          STAGING_RUN_ID: ${{ steps.auth.outputs.staging_run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.DURABLE_STAGING_RECEIPT,'utf8'));
          const expected={
            schema_version:1,
            worker_name:'customer-crm-api',
            workflow_path:'.github/workflows/member-production-runtime-secret-stage.yml',
            run_id:Number(process.env.STAGING_RUN_ID),
            job_id:108525472623,
            source_sha:process.env.STAGING_SOURCE_SHA,
            status:'completed',
            conclusion:'success',
            staged_version_id:process.env.STAGED_VERSION_ID,
            worker_version_stage:'PASS',
            production_deployment_unchanged:true,
            production_traffic_change:0,
            production_deploy:0,
          };
          for(const [key,value] of Object.entries(expected)){
            if(r[key]!==value)throw new Error('DURABLE_STAGING_RECEIPT_MISMATCH:'+key);
          }
          console.log('DURABLE_MEMBER_STAGING_SUCCESS_RECEIPT=PASS');
          NODE

          code="$(
            curl --silent --show-error --output /tmp/member-promotion-staging-run-live.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID"
          )"
          if [[ "$code" == 200 ]]; then
            python3 - <<'PY'
          import json, os
          with open('/tmp/member-promotion-staging-run-live.json', encoding='utf-8') as f:
              r=json.load(f)
          checks={
              'id': r.get('id')==int(os.environ['STAGING_RUN_ID']),
              'status': r.get('status')=='completed',
              'conclusion': r.get('conclusion')=='success',
              'head_sha': r.get('head_sha')==os.environ['STAGING_SOURCE_SHA'],
              'event': r.get('event')=='workflow_dispatch',
              'path': r.get('path')=='.github/workflows/member-production-runtime-secret-stage.yml',
              'created_at': r.get('created_at')=='2026-09-27T01:26:24Z',
              'updated_at': r.get('updated_at')=='2026-09-27T01:26:51Z',
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('LIVE_STAGING_RUN_METADATA_MISMATCH:'+','.join(bad))
          print('LIVE_MEMBER_STAGING_RUN_METADATA=PASS')
          PY
          elif [[ "$code" == 404 ]]; then
            echo 'LIVE_MEMBER_STAGING_RUN_METADATA=NOT_RETAINED'
          else
            cat /tmp/member-promotion-staging-run-live.json >&2 || true
            echo "::error::LIVE_STAGING_RUN_METADATA_HTTP_$code"
            exit 1
          fi
          rm -f /tmp/member-promotion-staging-run-live.json

      - name: Refuse during conflicting non-serialized Production operations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in member-production-runtime-readiness.yml member-production-runtime-secret-stage.yml member-production-schema-preflight.yml member-production-schema-apply.yml; do
            for status in queued in_progress; do
              count="$(
                curl --fail --silent --show-error                   -H "Authorization: Bearer $GH_TOKEN"                   -H 'Accept: application/vnd.github+json'                   -H 'X-GitHub-Api-Version: 2022-11-28'                   "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=$status&per_page=1"                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])'
              )"
              test "$count" = '0' || { echo "::error::MEMBER_PROMOTION_LOCK_OCCUPIED workflow=$workflow status=$status count=$count"; exit 1; }
            done
          done
          echo 'MEMBER_PROMOTION_NON_SERIALIZED_CONFLICT_LOCK=FREE'
          echo 'CRM_PRODUCTION_DEPLOY_SHARED_CONCURRENCY_LOCK=HELD'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify promotion contract
        run: node tests/member-production-version-promotion-contract.test.mjs

      - name: Install pinned Wrangler tooling
        run: npm install --no-save wrangler@4.131.2

      - name: Confirm Cloudflare authentication
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler whoami >/tmp/member-promotion-whoami.txt
          test -s /tmp/member-promotion-whoami.txt
          rm -f /tmp/member-promotion-whoami.txt
          echo 'CLOUDFLARE_AUTH=PASS'

      - name: Independently authenticate immutable staged version lineage in Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGED_VERSION_ID: ${{ steps.auth.outputs.staged_version_id }}
        run: |
          set -euo pipefail
          npx wrangler versions view "$STAGED_VERSION_ID" --name customer-crm-api --json > /tmp/member-promotion-staged-version.json
          node <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/member-promotion-staged-version.json','utf8');
          const parsed=JSON.parse(raw);
          const expectedId=process.env.STAGED_VERSION_ID.toLowerCase();
          const expectedMessage='Owner-gated Member runtime secret stage for '+process.env.STAGING_SOURCE_SHA;
          const start=Date.parse('2026-09-27T01:26:24Z');
          const end=Date.parse('2026-09-27T01:26:51Z');
          function collect(value,key,out=[]){
            if(Array.isArray(value)){
              for(const item of value)collect(item,key,out);
            }else if(value&&typeof value==='object'){
              for(const [k,v] of Object.entries(value)){
                if(k===key)out.push(v);
                collect(v,key,out);
              }
            }
            return out;
          }
          const ids=collect(parsed,'id').concat(collect(parsed,'version_id')).map(v=>String(v).toLowerCase());
          if(!ids.includes(expectedId) && !raw.toLowerCase().includes(expectedId))throw new Error('STAGED_VERSION_ID_NOT_PRESENT_IN_VERSION_VIEW');
          const created=collect(parsed,'created_on').concat(collect(parsed,'created_at')).map(String);
          const inRunWindow=created.some(v=>{ const t=Date.parse(v); return Number.isFinite(t)&&t>=start&&t<=end; });
          if(!inRunWindow)throw new Error('STAGED_VERSION_CREATED_OUTSIDE_AUTHENTICATED_STAGING_RUN_WINDOW');
          const messages=collect(parsed,'workers/message').concat(collect(parsed,'message')).map(String);
          if(!messages.includes(expectedMessage) && !raw.includes(expectedMessage))throw new Error('STAGED_VERSION_SOURCE_SHA_MESSAGE_MISMATCH');
          for(const name of [
            'MEMBER_SESSION_SECRET',
            'MEMBER_LINE_LOGIN_TRANSACTION_SECRET',
            'MEMBER_LINE_LOGIN_CHANNEL_SECRET',
            'MEMBER_PRIVATE_MEDIA_DELIVERY_SECRET'
          ]){
            if(!raw.includes(name))throw new Error('STAGED_MEMBER_SECRET_BINDING_MISSING:'+name);
          }
          console.log('IMMUTABLE_STAGED_VERSION_VIEW=PASS');
          console.log('CLOUDFLARE_STAGED_VERSION_CREATED_WITHIN_RUN_WINDOW=PASS');
          console.log('CLOUDFLARE_STAGED_VERSION_SOURCE_SHA_MESSAGE=PASS');
          console.log('INDEPENDENT_MEMBER_STAGED_VERSION_LINEAGE=PASS');
          NODE
          git show "$STAGING_SOURCE_SHA:.github/workflows/member-production-runtime-secret-stage.yml" > /tmp/member-promotion-staging-source-workflow.yml
          grep -Fq 'wrangler versions secret bulk /tmp/member-runtime-secrets.json' /tmp/member-promotion-staging-source-workflow.yml
          grep -Fq 'Owner-gated Member runtime secret stage for $EXPECTED_SHA' /tmp/member-promotion-staging-source-workflow.yml
          echo 'STAGING_SOURCE_WORKFLOW_PROVENANCE_CONTRACT=PASS'

      - name: Capture and match fresh Owner-authorized active Production version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGED_VERSION_ID: ${{ steps.auth.outputs.staged_version_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ steps.auth.outputs.expected_active_version_id }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-promotion-active-before.json
          node <<'NODE'
          const fs=require('fs');
          const value=JSON.parse(fs.readFileSync('/tmp/member-promotion-active-before.json','utf8'));
          const d=Array.isArray(value)?value[0]:value;
          const active=(d?.versions||[]).filter(v=>Number(v.percentage)===100);
          if(active.length!==1||typeof active[0].version_id!=='string')throw new Error('CURRENT_ACTIVE_PRODUCTION_VERSION_UNAVAILABLE');
          const current=active[0].version_id.toLowerCase();
          const expected=process.env.EXPECTED_ACTIVE_VERSION_ID.toLowerCase();
          const staged=process.env.STAGED_VERSION_ID.toLowerCase();
          if(current!==expected)throw new Error('CURRENT_ACTIVE_VERSION_NOT_OWNER_AUTHORIZED:'+current);
          if(current===staged)throw new Error('STAGED_VERSION_ALREADY_PRESENT_IN_ACTIVE_DEPLOYMENT');
          console.log('ACTIVE_PRODUCTION_DEPLOYMENT_FRESH_SNAPSHOT=PASS');
          console.log('OWNER_AUTHORIZED_ACTIVE_VERSION_MATCH=PASS');
          console.log('STAGED_VERSION_ACTIVE_BEFORE_PROMOTION=NO');
          NODE

      - name: Re-snapshot immediately before mutation and fail on drift
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ steps.auth.outputs.expected_active_version_id }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-promotion-active-pre-mutation.json
          node <<'NODE'
          const fs=require('fs');
          function canonical(v){
            if(Array.isArray(v))return v.map(canonical);
            if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])]));
            return v;
          }
          const beforeRaw=JSON.parse(fs.readFileSync('/tmp/member-promotion-active-before.json','utf8'));
          const nowRaw=JSON.parse(fs.readFileSync('/tmp/member-promotion-active-pre-mutation.json','utf8'));
          const before=canonical(beforeRaw);
          const now=canonical(nowRaw);
          if(JSON.stringify(before)!==JSON.stringify(now))throw new Error('ACTIVE_PRODUCTION_DEPLOYMENT_DRIFTED_BEFORE_PROMOTION');
          const d=Array.isArray(nowRaw)?nowRaw[0]:nowRaw;
          const active=(d?.versions||[]).filter(v=>Number(v.percentage)===100);
          if(active.length!==1||typeof active[0].version_id!=='string')throw new Error('PRE_MUTATION_ACTIVE_VERSION_UNAVAILABLE');
          if(active[0].version_id.toLowerCase()!==process.env.EXPECTED_ACTIVE_VERSION_ID.toLowerCase())throw new Error('PRE_MUTATION_ACTIVE_VERSION_NOT_OWNER_AUTHORIZED');
          console.log('ACTIVE_PRODUCTION_DEPLOYMENT_STABLE_BEFORE_PROMOTION=PASS');
          console.log('PRE_MUTATION_OWNER_AUTHORIZED_ACTIVE_VERSION_MATCH=PASS');
          NODE

      - name: Final current-main Owner-comment active-version and conflict gate immediately before mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
          STAGED_VERSION_ID: ${{ steps.auth.outputs.staged_version_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ steps.auth.outputs.expected_active_version_id }}
          STAGING_RUN_ID: ${{ steps.auth.outputs.staging_run_id }}
          OWNER_COMMENT_ID: ${{ steps.auth.outputs.owner_comment_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$EXPECTED_SHA" || { echo "::error::FINAL_MAIN_DRIFT current=$current_main expected=$EXPECTED_SHA"; exit 1; }

          curl --fail --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$OWNER_COMMENT_ID"             > /tmp/member-promotion-owner-comment-final.json
          EXPECTED_BODY="/member-production-promote sha=$EXPECTED_SHA staged_version=$STAGED_VERSION_ID staging_run=$STAGING_RUN_ID replace_active_version=$EXPECTED_ACTIVE_VERSION_ID confirm=PROMOTE_MEMBER_STAGED_VERSION"           python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open('/tmp/member-promotion-owner-comment-final.json', encoding='utf-8') as f:
              c=json.load(f)
          if c.get('user',{}).get('login')!='ohw3rz5578d277e-collab':
              raise SystemExit('FINAL_OWNER_COMMENT_ACTOR_MISMATCH')
          if c.get('body')!=os.environ['EXPECTED_BODY']:
              raise SystemExit('FINAL_OWNER_COMMENT_BODY_MISMATCH')
          if not str(c.get('issue_url','')).endswith('/issues/26'):
              raise SystemExit('FINAL_OWNER_COMMENT_ISSUE_MISMATCH')
          if c.get('created_at')!=c.get('updated_at'):
              raise SystemExit('FINAL_OWNER_COMMENT_EDITED')
          created=datetime.fromisoformat(str(c.get('created_at','')).replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-created).total_seconds()
          if age < 0 or age > 900:
              raise SystemExit(f'FINAL_OWNER_COMMENT_NOT_FRESH:age_seconds={age:.0f}')
          print('FINAL_CURRENT_MAIN_GATE=PASS')
          print('FINAL_OWNER_PROMOTION_AUTHORIZATION_FRESHNESS=PASS')
          PY
          rm -f /tmp/member-promotion-owner-comment-final.json

          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-promotion-active-final.json
          node <<'NODE'
          const fs=require('fs');
          const value=JSON.parse(fs.readFileSync('/tmp/member-promotion-active-final.json','utf8'));
          const d=Array.isArray(value)?value[0]:value;
          const active=(d?.versions||[]).filter(v=>Number(v.percentage)===100);
          if(active.length!==1||typeof active[0].version_id!=='string')throw new Error('FINAL_ACTIVE_PRODUCTION_VERSION_UNAVAILABLE');
          const current=active[0].version_id.toLowerCase();
          const expected=process.env.EXPECTED_ACTIVE_VERSION_ID.toLowerCase();
          if(current!==expected)throw new Error('FINAL_ACTIVE_VERSION_NOT_OWNER_AUTHORIZED:'+current);
          console.log('FINAL_OWNER_AUTHORIZED_ACTIVE_VERSION_MATCH=PASS');
          NODE

          for workflow in member-production-runtime-readiness.yml member-production-runtime-secret-stage.yml member-production-schema-preflight.yml member-production-schema-apply.yml; do
            for status in queued in_progress; do
              count="$(
                curl --fail --silent --show-error                   -H "Authorization: Bearer $GH_TOKEN"                   -H 'Accept: application/vnd.github+json'                   -H 'X-GitHub-Api-Version: 2022-11-28'                   "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=$status&per_page=1"                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])'
              )"
              test "$count" = '0' || { echo "::error::FINAL_MEMBER_PROMOTION_LOCK_OCCUPIED workflow=$workflow status=$status count=$count"; exit 1; }
            done
          done
          echo 'FINAL_MEMBER_PROMOTION_NON_SERIALIZED_CONFLICT_LOCK=FREE'

      - name: Promote only the exact staged version to 100 percent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGED_VERSION_ID: ${{ steps.auth.outputs.staged_version_id }}
          EXPECTED_SHA: ${{ steps.auth.outputs.expected_sha }}
        run: |
          set -euo pipefail
          npx wrangler versions deploy "$STAGED_VERSION_ID@100%"             --name customer-crm-api             --message "Owner-gated Member staged-version promotion; current-main=$EXPECTED_SHA; stage-run=$AUTHORIZED_STAGING_RUN_ID"             --yes
          echo "MEMBER_PRODUCTION_PROMOTED_VERSION=$STAGED_VERSION_ID"

      - name: Verify exact promoted version receives 100 percent Production traffic
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGED_VERSION_ID: ${{ steps.auth.outputs.staged_version_id }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-promotion-active-after.json
          node <<'NODE'
          const fs=require('fs');
          const value=JSON.parse(fs.readFileSync('/tmp/member-promotion-active-after.json','utf8'));
          const d=Array.isArray(value)?value[0]:value;
          const versions=Array.isArray(d?.versions)?d.versions:[];
          const staged=versions.filter(v=>
            typeof v?.version_id==='string' &&
            v.version_id.toLowerCase()===process.env.STAGED_VERSION_ID.toLowerCase()
          );
          if(staged.length!==1)throw new Error('PROMOTED_VERSION_ACTIVE_ENTRY_COUNT_NOT_EXACTLY_ONE');
          if(Number(staged[0].percentage)!==100)throw new Error('PROMOTED_VERSION_TRAFFIC_NOT_100_PERCENT');
          const fullTraffic=versions.filter(v=>Number(v.percentage)===100);
          if(fullTraffic.length!==1)throw new Error('ACTIVE_PRODUCTION_100_PERCENT_ENTRY_COUNT_NOT_EXACTLY_ONE');
          if(
            typeof fullTraffic[0]?.version_id!=='string' ||
            fullTraffic[0].version_id.toLowerCase()!==process.env.STAGED_VERSION_ID.toLowerCase()
          )throw new Error('ACTIVE_PRODUCTION_100_PERCENT_VERSION_MISMATCH');
          console.log('ACTIVE_PRODUCTION_PROMOTED_VERSION=PASS');
          console.log('ACTIVE_PRODUCTION_PROMOTED_VERSION_TRAFFIC_PERCENT=100');
          NODE

      - name: Cleanup snapshots
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f             /tmp/member-promotion-staged-version.json             /tmp/member-promotion-active-before.json             /tmp/member-promotion-active-pre-mutation.json             /tmp/member-promotion-active-after.json             /tmp/member-promotion-owner-comment.json             /tmp/member-promotion-owner-comment-final.json             /tmp/member-promotion-bridge-run.json \
            /tmp/member-promotion-staging-run-live.json \
            /tmp/member-promotion-staging-source-workflow.yml \
            /tmp/member-promotion-active-final.json
          echo 'MEMBER_PROMOTION_TEMP_FILES_REMOVED=YES'

      - name: Final promotion declaration
        if: ${{ success() }}
        shell: bash
        run: |
          echo 'MEMBER_STAGED_VERSION_PROMOTION=PASS'
          echo "MEMBER_STAGED_VERSION_ID=$AUTHORIZED_STAGED_VERSION_ID"
          echo "MEMBER_STAGING_RUN_ID=$AUTHORIZED_STAGING_RUN_ID"
          echo "OWNER_AUTHORIZED_REPLACED_ACTIVE_VERSION=${{ steps.auth.outputs.expected_active_version_id }}"
          echo 'PRODUCTION_TRAFFIC_TARGET_PERCENT=100'
          echo 'WRANGLER_DEPLOY_USED=NO'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'CRM_WRITE=0'
          echo 'LINE_SEND=0'
          echo 'CUSTOMER_ID_GENERATION=0'
          echo 'COMMERCE_ACTIVATION=0'
