name: LINE cross-repo checkout probe from CRM runner

on:
  push:
    branches:
      - task/line-cross-repo-checkout-probe-01

permissions:
  contents: read

jobs:
  probe:
    name: Read-only checkout of LINE PR36 head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact private LINE PR36 head
        uses: actions/checkout@v6
        with:
          repository: ohw3rz5578d277e-collab/meta-line-dashboard-worker
          ref: fd791a562387e3d62770b3e526e3d059a8fb64a4
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact sanitized checkout only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'fd791a562387e3d62770b3e526e3d059a8fb64a4'
          test -f worker-core.js
          echo 'LINE_CROSS_REPO_CHECKOUT=PASS'
          echo 'SOURCE_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
