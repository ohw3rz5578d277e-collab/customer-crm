name: Sales CRM local reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/crm-sales-history-reconciliation.mjs'
      - 'scripts/extract-photo-sales-xlsx.py'
      - 'scripts/extract-line-name-evidence-xlsx.py'
      - 'scripts/reconcile-photo-sales-readonly.mjs'
      - 'scripts/run-sales-crm-readonly-reconciliation.sh'
      - 'tests/sales-crm-readonly-reconciliation.test.mjs'
      - '.github/workflows/sales-crm-local-reconciliation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Static syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/crm-sales-history-reconciliation.mjs
          node --check scripts/reconcile-photo-sales-readonly.mjs
          python3 -m py_compile scripts/extract-photo-sales-xlsx.py scripts/extract-line-name-evidence-xlsx.py
          bash -n scripts/run-sales-crm-readonly-reconciliation.sh
          echo 'SALES_RECONCILIATION_SYNTAX=PASS'

      - name: Local-only network and mutation contract
        shell: bash
        run: |
          set -euo pipefail
          runner='scripts/run-sales-crm-readonly-reconciliation.sh'
          ! grep -Eiq '\b(wrangler|curl|wget|npx|ssh|scp|rsync)\b' "$runner"
          ! grep -Eiq 'git[[:space:]]+ls-remote|--remote\b|api\.cloudflare\.com|api\.line\.me|CLOUDFLARE_(API_TOKEN|API_KEY|EMAIL|ACCOUNT_ID)' "$runner"
          grep -q 'PRODUCTION_NETWORK_ACCESS=0' "$runner"
          grep -q 'PRODUCTION_D1_READ=0' "$runner"
          grep -q 'PRODUCTION_D1_WRITE=0' "$runner"
          grep -q '<production-customers-snapshot.json>' "$runner"
          echo 'PRODUCTION_NETWORK_ACCESS=0'
          echo 'PRODUCTION_D1_READ=0'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'LOCAL_ONLY_CONTRACT=PASS'

      - name: Reconciliation regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/sales-crm-readonly-reconciliation.test.mjs
