name: Dispatch Member Production staged version promotion from release-gate issue

run-name: >-
  ${{ startsWith(github.event.comment.body, '/member-production-promote ') && 'Production mutation bridge: version-promotion' || startsWith(github.event.comment.body, '/member-production-promotion-snapshot ') && 'Production read-only bridge: version-snapshot' || 'Production bridge: ignored' }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  snapshot:
    name: Read-only Member route-stage promotion snapshot
    if: >-
      github.event.issue.number == 26 &&
      github.event.issue.pull_request == null &&
      github.actor == 'ohw3rz5578d277e-collab' &&
      github.event.comment.user.login == 'ohw3rz5578d277e-collab' &&
      startsWith(github.event.comment.body, '/member-production-promotion-snapshot ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate exact read-only snapshot command current main and route-stage receipt
        id: snapshot_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          command_re='^/member-production-promotion-snapshot sha=([0-9a-f]{40}) staged_version=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}) staging_run=([0-9]+)$'
          [[ "$COMMAND_BODY" =~ $command_re ]] || { echo '::error::INVALID_MEMBER_PROMOTION_SNAPSHOT_COMMAND'; exit 1; }
          expected_sha="${BASH_REMATCH[1]}"
          staged_version_id="${BASH_REMATCH[2]}"
          staging_run_id="${BASH_REMATCH[3]}"

          current_sha="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
          )"
          test "$current_sha" = "$expected_sha" || { echo "::error::MAIN_DRIFT expected=$expected_sha current=$current_sha"; exit 1; }

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$staging_run_id" \
            > /tmp/member-promotion-snapshot-route-stage.json

          EXPECTED_SHA="$expected_sha" STAGING_RUN_ID="$staging_run_id" python3 - <<'PY'
          import json, os
          with open('/tmp/member-promotion-snapshot-route-stage.json', encoding='utf-8') as f:
              r=json.load(f)
          checks={
              'id': r.get('id')==int(os.environ['STAGING_RUN_ID']),
              'status': r.get('status')=='completed',
              'conclusion': r.get('conclusion')=='success',
              'head_sha': r.get('head_sha')==os.environ['EXPECTED_SHA'],
              'event': r.get('event')=='workflow_dispatch',
              'path': r.get('path')=='.github/workflows/member-production-route-stage.yml',
              'run_attempt': r.get('run_attempt')==1,
              'display_title': r.get('display_title')==f"Member route candidate stage {os.environ['EXPECTED_SHA']}",
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('INVALID_ROUTE_STAGE_RECEIPT:'+','.join(bad))
          print('MEMBER_PROMOTION_ROUTE_STAGE_RECEIPT=PASS')
          PY
          rm -f /tmp/member-promotion-snapshot-route-stage.json

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "staged_version_id=$staged_version_id" >> "$GITHUB_OUTPUT"
          echo "staging_run_id=$staging_run_id" >> "$GITHUB_OUTPUT"

      - name: Read exact current active 100 percent Worker version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ steps.snapshot_gate.outputs.expected_sha }}
          STAGED_VERSION_ID: ${{ steps.snapshot_gate.outputs.staged_version_id }}
          STAGING_RUN_ID: ${{ steps.snapshot_gate.outputs.staging_run_id }}
        run: |
          set -euo pipefail
          npm install --no-save wrangler@4.131.2
          npx wrangler deployments status --name customer-crm-api --json > /tmp/member-promotion-snapshot.json

          active_version_id="$(
            node - /tmp/member-promotion-snapshot.json <<'NODE'
          const fs=require('fs');
          const value=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const d=Array.isArray(value)?value[0]:value;
          const active=(d?.versions||[]).filter(v=>Number(v.percentage)===100);
          if(active.length!==1||typeof active[0].version_id!=='string')process.exit(2);
          process.stdout.write(active[0].version_id.toLowerCase());
          NODE
          )" || { echo '::error::CURRENT_ACTIVE_PRODUCTION_VERSION_UNAVAILABLE'; exit 1; }

          [[ "$active_version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || {
            echo '::error::INVALID_CURRENT_ACTIVE_VERSION_ID'
            exit 1
          }

          test "$active_version_id" != "$STAGED_VERSION_ID" || {
            echo '::error::STAGED_VERSION_ALREADY_ACTIVE'
            exit 1
          }

          echo "ACTIVE_PRODUCTION_VERSION_ID=$active_version_id"
          promotion_command="/member-production-promote sha=$EXPECTED_SHA staged_version=$STAGED_VERSION_ID staging_run=$STAGING_RUN_ID replace_active_version=$active_version_id confirm=PROMOTE_MEMBER_STAGED_VERSION"
          {
            echo '## Member route-stage promotion read-only snapshot'
            echo
            echo "- CURRENT_MAIN_SHA=$EXPECTED_SHA"
            echo "- STAGED_VERSION_ID=$STAGED_VERSION_ID"
            echo "- ROUTE_STAGE_RUN_ID=$STAGING_RUN_ID"
            echo "- ACTIVE_PRODUCTION_VERSION_ID=$active_version_id"
            echo '- PRODUCTION_TRAFFIC_CHANGE=0'
            echo '- PRODUCTION_DEPLOY=0'
            echo
            echo 'Fresh promotion command template:'
            echo
            printf '`%s`\n' "$promotion_command"
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f /tmp/member-promotion-snapshot.json
          echo 'MEMBER_PROMOTION_SNAPSHOT=PASS'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_OBJECT_WRITE=0'

  validate:
    name: Validate exact fresh Owner promotion command
    if: >-
      github.event.issue.number == 26 &&
      github.event.issue.pull_request == null &&
      github.actor == 'ohw3rz5578d277e-collab' &&
      github.event.comment.user.login == 'ohw3rz5578d277e-collab' &&
      startsWith(github.event.comment.body, '/member-production-promote ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expected_sha: ${{ steps.gate.outputs.expected_sha }}
      staged_version_id: ${{ steps.gate.outputs.staged_version_id }}
      expected_active_version_id: ${{ steps.gate.outputs.expected_active_version_id }}
      staging_run_id: ${{ steps.gate.outputs.staging_run_id }}
      owner_comment_id: ${{ steps.gate.outputs.owner_comment_id }}
      bridge_run_id: ${{ steps.gate.outputs.bridge_run_id }}
      bridge_run_attempt: ${{ steps.gate.outputs.bridge_run_attempt }}
    steps:
      - name: Validate exact Owner command current main route-stage receipt and first attempt
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
          OWNER_COMMENT_ID: ${{ github.event.comment.id }}
          BRIDGE_RUN_ID: ${{ github.run_id }}
          BRIDGE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$BRIDGE_RUN_ATTEMPT" = '1' || { echo '::error::PROMOTION_BRIDGE_RERUN_NOT_AUTHORIZED'; exit 1; }

          command_re='^/member-production-promote sha=([0-9a-f]{40}) staged_version=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}) staging_run=([0-9]+) replace_active_version=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}) confirm=PROMOTE_MEMBER_STAGED_VERSION$'
          [[ "$COMMAND_BODY" =~ $command_re ]] || { echo '::error::INVALID_MEMBER_PRODUCTION_PROMOTION_COMMAND'; exit 1; }

          expected_sha="${BASH_REMATCH[1]}"
          staged_version_id="${BASH_REMATCH[2]}"
          staging_run_id="${BASH_REMATCH[3]}"
          expected_active_version_id="${BASH_REMATCH[4]}"

          current_sha="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
          )"
          test "$current_sha" = "$expected_sha" || { echo "::error::MAIN_DRIFT expected=$expected_sha current=$current_sha"; exit 1; }

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$staging_run_id" \
            > /tmp/member-promotion-route-stage.json

          EXPECTED_SHA="$expected_sha" STAGING_RUN_ID="$staging_run_id" python3 - <<'PY'
          import json, os
          with open('/tmp/member-promotion-route-stage.json', encoding='utf-8') as f:
              r=json.load(f)
          checks={
              'id': r.get('id')==int(os.environ['STAGING_RUN_ID']),
              'status': r.get('status')=='completed',
              'conclusion': r.get('conclusion')=='success',
              'head_sha': r.get('head_sha')==os.environ['EXPECTED_SHA'],
              'event': r.get('event')=='workflow_dispatch',
              'path': r.get('path')=='.github/workflows/member-production-route-stage.yml',
              'run_attempt': r.get('run_attempt')==1,
              'display_title': r.get('display_title')==f"Member route candidate stage {os.environ['EXPECTED_SHA']}",
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('INVALID_ROUTE_STAGE_RECEIPT:'+','.join(bad))
          print('MEMBER_PROMOTION_ROUTE_STAGE_RECEIPT=PASS')
          PY
          rm -f /tmp/member-promotion-route-stage.json

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "staged_version_id=$staged_version_id" >> "$GITHUB_OUTPUT"
          echo "expected_active_version_id=$expected_active_version_id" >> "$GITHUB_OUTPUT"
          echo "staging_run_id=$staging_run_id" >> "$GITHUB_OUTPUT"
          echo "owner_comment_id=$OWNER_COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "bridge_run_id=$BRIDGE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "bridge_run_attempt=$BRIDGE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

          echo "MEMBER_PROMOTION_FRESH_OWNER_SHA=$expected_sha"
          echo "MEMBER_PROMOTION_EXACT_STAGED_VERSION=$staged_version_id"
          echo "MEMBER_PROMOTION_EXACT_ROUTE_STAGE_RUN=$staging_run_id"
          echo "MEMBER_PROMOTION_OWNER_AUTHORIZED_REPLACED_ACTIVE_VERSION=$expected_active_version_id"
          echo "MEMBER_PROMOTION_BRIDGE_RUN_ID=$BRIDGE_RUN_ID"
          echo 'MEMBER_PROMOTION_BRIDGE_RUN_ATTEMPT=1'

      - name: Reject instead of queueing behind another Production mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sleep 2
          workflows=(
            dispatch-production-deploy-from-issue.yml
            dispatch-member-schema-apply-from-issue.yml
            dispatch-member-production-runtime-secret-stage-from-issue.yml
            dispatch-member-production-version-promotion-from-issue.yml
            dispatch-member-production-route-stage-from-issue.yml
            deploy-cloudflare.yml
            member-production-schema-apply.yml
            member-production-runtime-secret-stage.yml
            member-production-version-promotion.yml
            member-production-route-stage.yml
          )
          statuses=(queued in_progress waiting pending requested)
          for workflow in "${workflows[@]}"; do
            for status in "${statuses[@]}"; do
              code="$(curl --silent --show-error --output /tmp/member-promotion-conflicts.json --write-out '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=$status&per_page=100")"
              if [[ "$code" == 404 ]]; then
                continue
              fi
              test "$code" = 200 || { cat /tmp/member-promotion-conflicts.json >&2 || true; exit 1; }

              conflicts="$(
                WORKFLOW="$workflow" THIS_RUN_ID="$THIS_RUN_ID" python3 - <<'PY'
          import json, os
          with open('/tmp/member-promotion-conflicts.json', encoding='utf-8') as f:
              runs=json.load(f).get('workflow_runs',[])
          workflow=os.environ['WORKFLOW']
          me=int(os.environ['THIS_RUN_ID'])
          direct_mutation_workflows={
              'member-production-schema-apply.yml',
              'member-production-runtime-secret-stage.yml',
              'member-production-version-promotion.yml',
              'member-production-route-stage.yml',
          }
          def is_actual_mutation(run):
              if int(run.get('id',0))==me:
                  return False
              event=run.get('event')
              title=str(run.get('display_title',''))
              if workflow=='deploy-cloudflare.yml':
                  return event=='workflow_dispatch' and not title.startswith('CRM Production preflight ')
              if workflow in direct_mutation_workflows:
                  return event=='workflow_dispatch'
              if workflow.startswith('dispatch-'):
                  if title.startswith('Production read-only bridge:') or title=='Production bridge: ignored':
                      return False
                  return title.startswith('Production mutation bridge:') or event=='issue_comment'
              return False
          print(sum(1 for run in runs if is_actual_mutation(run)))
          PY
              )"
              test "$conflicts" = 0 || {
                echo "::error::PRODUCTION_MUTATION_BUSY_RETRY_REQUIRED workflow=$workflow status=$status count=$conflicts"
                exit 1
              }
            done
          done
          rm -f /tmp/member-promotion-conflicts.json
          echo 'PRODUCTION_MUTATION_DISPATCH_GATE=FREE'
          echo 'PRODUCTION_MUTATION_QUEUE_POLICY=REJECT_AND_RETRY'
          echo 'PRODUCTION_MUTATION_FILTER=ACTUAL_MUTATIONS_ONLY'

  promote:
    name: Call exact Owner-gated route-stage promotion workflow
    needs: validate
    uses: ./.github/workflows/member-production-version-promotion.yml
    with:
      expected_sha: ${{ needs.validate.outputs.expected_sha }}
      staged_version_id: ${{ needs.validate.outputs.staged_version_id }}
      expected_active_version_id: ${{ needs.validate.outputs.expected_active_version_id }}
      staging_run_id: ${{ needs.validate.outputs.staging_run_id }}
      owner_comment_id: ${{ needs.validate.outputs.owner_comment_id }}
      bridge_run_id: ${{ needs.validate.outputs.bridge_run_id }}
      bridge_run_attempt: ${{ needs.validate.outputs.bridge_run_attempt }}
      confirmation: PROMOTE_MEMBER_STAGED_VERSION
    secrets: inherit
