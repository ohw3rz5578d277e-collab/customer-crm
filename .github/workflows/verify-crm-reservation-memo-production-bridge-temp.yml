name: Verify CRM Reservation memo Production bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify scoped diff and exact SQL hash
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only origin/main...HEAD | sort)
          printf '%s\n' "${files[@]}"
          expected=(
            '.github/workflows/apply-reservation-memo-schema-via-crm.yml'
            '.github/workflows/dispatch-reservation-memo-schema-from-issue.yml'
            '.github/workflows/verify-crm-reservation-memo-production-bridge-temp.yml'
            'release/reservation/20260825_reservation_memos.sql'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!files[@]}"; do test "${files[$i]}" = "${expected_sorted[$i]}"; done
          actual="$(sha256sum release/reservation/20260825_reservation_memos.sql | awk '{print $1}')"
          test "$actual" = 'd3b7620d000aff41cf750ee758e5acc73000f9ac9ebd56cb2f445489578030de'
          echo "EXACT_SQL_SHA256=$actual"

      - name: Verify exact SQL safety
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          let sql=fs.readFileSync('release/reservation/20260825_reservation_memos.sql','utf8')
            .replace(/--.*$/gm,' ').replace(/\/\*[\s\S]*?\*\//g,' ');
          for(const p of [/\bDROP\b/i,/\bALTER\b/i,/\bDELETE\b/i,/\bUPDATE\b/i,/\bINSERT\b/i,/\bREPLACE\b/i,/\bTRUNCATE\b/i,/\bPRAGMA\b/i,/\bATTACH\b/i,/\bDETACH\b/i]) {
            if(p.test(sql)) throw new Error(`Forbidden SQL token: ${p}`);
          }
          const statements=sql.split(';').map(x=>x.trim()).filter(Boolean);
          if(statements.length!==4) throw new Error(`Expected 4 statements, got ${statements.length}`);
          for(const s of statements) if(!/^CREATE\s+(TABLE|INDEX)\s+IF\s+NOT\s+EXISTS\b/i.test(s)) throw new Error(`Unsafe statement: ${s}`);
          console.log('EXACT_SQL_SAFETY=PASS');
          NODE

      - name: Verify permanent workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const apply=fs.readFileSync('.github/workflows/apply-reservation-memo-schema-via-crm.yml','utf8');
          const bridge=fs.readFileSync('.github/workflows/dispatch-reservation-memo-schema-from-issue.yml','utf8');
          for(const token of [
            'workflow_dispatch:',
            'confirm_production:',
            'confirm_crm_sha:',
            'confirm_reservation_sha:',
            'confirm_migration_sha256:',
            '61b1184eb1753822afc1a2d3e923202d08a074ab',
            'd3b7620d000aff41cf750ee758e5acc73000f9ac9ebd56cb2f445489578030de',
            'd1 execute reservation-app-db --remote --file release/reservation/20260825_reservation_memos.sql',
            'RESERVATION_ROW_COUNT_UNCHANGED',
            'WORKER_DEPLOY=0'
          ]) if(!apply.includes(token)) throw new Error(`Apply workflow token missing: ${token}`);
          if(/\bd1\s+migrations\s+apply\b/i.test(apply)) throw new Error('Generic migrations apply is forbidden');
          if(/command:\s*deploy\b/i.test(apply)) throw new Error('Worker deploy must not exist');
          for(const token of [
            'github.event.issue.number == 28',
            "github.actor == 'ohw3rz5578d277e-collab'",
            '/reservation-memo-production-migrate ',
            'Fresh read-only Reservation D1 capability gate',
            'SELECT 1 AS ok',
            'apply-reservation-memo-schema-via-crm.yml',
            "'confirm_production': 'true'",
            'BRIDGE_PRODUCTION_WRITE=0'
          ]) if(!bridge.includes(token)) throw new Error(`Bridge workflow token missing: ${token}`);
          console.log('PERMANENT_WORKFLOW_CONTRACTS=PASS');
          NODE
