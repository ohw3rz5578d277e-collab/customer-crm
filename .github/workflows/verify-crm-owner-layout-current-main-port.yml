name: Verify CRM owner layout current-main port

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  exact-head-verify:
    if: github.event.pull_request.head.ref == 'task/crm-owner-layout-current-main-port-01'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact Product delta
        shell: bash
        run: |
          set -euo pipefail
          base_main='1f77d5ed3ce256a4303119a4c3685a8d978beb59'
          test "${{ github.event.pull_request.base.sha }}" = "$base_main"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base_main" HEAD | grep -v '^\.github/workflows/verify-crm-owner-layout-current-main-port\.yml$' || true)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = '2'
          printf '%s\n' "$changed" | grep -qx 'src/production-index-crm-browser-root-entry.js'
          printf '%s\n' "$changed" | grep -qx 'tests/customer-production-owner-layout-regression.mjs'
          grep -q 'crm-production-desktop-owner-hotfix-20260825' src/production-index-crm-browser-root-entry.js
          node --check src/production-index-crm-browser-root-entry.js
          git diff --check
          echo 'EXACT_PRODUCT_DELTA=PASS'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run owner layout and existing CRM regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/customer-production-owner-layout-regression.mjs
          node tests/customer-management-browser.mjs
          node tests/customer-management-ux.mjs
          node tests/customer-reservation-history-order.mjs
          node tests/customer-identity-resolver.mjs
          node tests/customer-identity-regression.mjs
          echo 'CURRENT_MAIN_UI_PORT_EXACT_HEAD=PASS'

      - name: Safety summary
        run: |
          echo 'PRODUCTION_CUSTOMER_WRITE=0'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'DEPLOY=0'
          echo 'LINE_SEND=0'
