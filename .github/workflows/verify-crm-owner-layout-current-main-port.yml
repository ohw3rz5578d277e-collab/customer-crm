name: Verify CRM owner layout current-main port

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  port-and-verify:
    if: github.event.pull_request.head.ref == 'task/crm-owner-layout-current-main-port-01'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify stack and port UI delta if needed
        id: port
        shell: bash
        run: |
          set -euo pipefail
          base_main='1f77d5ed3ce256a4303119a4c3685a8d978beb59'
          deployed_base='7c1acdd9a3d3f7eabd1bf70f752abef4bc34b276'
          validated='18ffc91f7946ec4495fe08202f29120bcd1f1744'
          test "${{ github.event.pull_request.base.sha }}" = "$base_main"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

          if grep -q 'crm-production-desktop-owner-hotfix-20260825' src/production-index-crm-browser-root-entry.js && test -f tests/customer-production-owner-layout-regression.mjs; then
            echo 'PATCH_ALREADY_PRESENT=YES'
            echo 'patched=false' >> "$GITHUB_OUTPUT"
          else
            git diff --binary "$deployed_base" "$validated" -- \
              src/production-index-crm-browser-root-entry.js \
              tests/customer-production-owner-layout-regression.mjs > /tmp/owner-layout.patch
            test -s /tmp/owner-layout.patch
            git apply --3way --index /tmp/owner-layout.patch
            staged="$(git diff --cached --name-only)"
            printf '%s\n' "$staged"
            test "$(printf '%s\n' "$staged" | sed '/^$/d' | wc -l | tr -d ' ')" = '2'
            printf '%s\n' "$staged" | grep -qx 'src/production-index-crm-browser-root-entry.js'
            printf '%s\n' "$staged" | grep -qx 'tests/customer-production-owner-layout-regression.mjs'
            echo 'UI_3WAY_PORT=PASS'
            echo 'patched=true' >> "$GITHUB_OUTPUT"
          fi

          node --check src/production-index-crm-browser-root-entry.js
          git diff --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run owner layout and existing CRM regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/customer-production-owner-layout-regression.mjs
          node tests/customer-management-browser.mjs
          node tests/customer-management-ux.mjs
          node tests/customer-reservation-history-order.mjs
          node tests/customer-identity-resolver.mjs
          node tests/customer-identity-regression.mjs
          echo 'CURRENT_MAIN_UI_PORT_REGRESSION=PASS'

      - name: Commit tested Product delta to PR branch
        if: steps.port.outputs.patched == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Port validated CRM owner desktop layout to current main'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo 'SOURCE_PORT_COMMITTED=YES'

      - name: Exact-head safety summary
        run: |
          echo 'IDENTITY_REDIRECT_OR_SCHEMA_REDESIGN=0'
          echo 'PRODUCTION_CUSTOMER_WRITE=0'
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'DEPLOY=0'
          echo 'LINE_SEND=0'
