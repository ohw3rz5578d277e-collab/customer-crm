name: Dispatch Member Production runtime version promotion from release-gate issue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: member-production-runtime-version-promotion-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate exact Member runtime version promotion command and dispatch
    if: >-
      github.event.issue.number == 26 &&
      github.event.issue.pull_request == null &&
      github.actor == 'ohw3rz5578d277e-collab' &&
      github.event.comment.user.login == 'ohw3rz5578d277e-collab' &&
      startsWith(github.event.comment.body, '/member-runtime-version-promote ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact Owner command and current main
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
          OWNER_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          command_re='^/member-runtime-version-promote sha=([0-9a-f]{40}) version=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}) stage_run=([0-9]+) confirm=PROMOTE_MEMBER_RUNTIME_VERSION$'
          [[ "$COMMAND_BODY" =~ $command_re ]] || { echo '::error::INVALID_MEMBER_RUNTIME_VERSION_PROMOTION_COMMAND'; exit 1; }
          expected_sha="${BASH_REMATCH[1]}"
          staged_version_id="${BASH_REMATCH[2]}"
          stage_run_id="${BASH_REMATCH[3]}"
          current_sha="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
          )"
          test "$current_sha" = "$expected_sha" || { echo "::error::MAIN_DRIFT expected=$expected_sha current=$current_sha"; exit 1; }
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "staged_version_id=$staged_version_id" >> "$GITHUB_OUTPUT"
          echo "stage_run_id=$stage_run_id" >> "$GITHUB_OUTPUT"
          echo "owner_comment_id=$OWNER_COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "MEMBER_RUNTIME_VERSION_PROMOTION_AUTHORIZED_SHA=$expected_sha"
          echo "MEMBER_RUNTIME_VERSION_PROMOTION_STAGED_VERSION_ID=$staged_version_id"
          echo "MEMBER_RUNTIME_VERSION_PROMOTION_STAGE_RUN_ID=$stage_run_id"
          echo "MEMBER_RUNTIME_VERSION_PROMOTION_OWNER_COMMENT_ID=$OWNER_COMMENT_ID"
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'

      - name: Refuse during conflicting Production operations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in \
            deploy-cloudflare.yml \
            member-production-runtime-readiness.yml \
            member-production-runtime-secret-stage.yml \
            member-production-runtime-version-promotion.yml; do
            for status in queued in_progress; do
              count="$(
                curl --fail --silent --show-error \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=$status&per_page=1" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])'
              )"
              test "$count" = '0' || { echo "::error::MEMBER_RUNTIME_VERSION_PROMOTION_LOCK_OCCUPIED workflow=$workflow status=$status count=$count"; exit 1; }
            done
          done
          echo 'MEMBER_RUNTIME_VERSION_PROMOTION_LOCK=FREE'

      - name: Dispatch exact-version promotion workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          STAGED_VERSION_ID: ${{ steps.gate.outputs.staged_version_id }}
          STAGE_RUN_ID: ${{ steps.gate.outputs.stage_run_id }}
          OWNER_COMMENT_ID: ${{ steps.gate.outputs.owner_comment_id }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'ref':'main',
            'inputs':{
              'expected_sha':os.environ['EXPECTED_SHA'],
              'staged_version_id':os.environ['STAGED_VERSION_ID'],
              'stage_run_id':os.environ['STAGE_RUN_ID'],
              'owner_comment_id':os.environ['OWNER_COMMENT_ID'],
              'confirmation':'PROMOTE_MEMBER_RUNTIME_VERSION'
            }
          }))
          PY
          )"
          code="$(
            curl --silent --show-error \
              --output /tmp/member-runtime-version-promotion-dispatch.txt \
              --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/member-production-runtime-version-promotion.yml/dispatches" \
              -d "$payload"
          )"
          test "$code" = '204' || {
            cat /tmp/member-runtime-version-promotion-dispatch.txt >&2 || true
            echo "::error::MEMBER_RUNTIME_VERSION_PROMOTION_DISPATCH_FAILED_HTTP_$code"
            exit 1
          }
          echo "MEMBER_RUNTIME_VERSION_PROMOTION_DISPATCHED_SHA=$EXPECTED_SHA"
          echo "MEMBER_RUNTIME_VERSION_PROMOTION_DISPATCHED_VERSION=$STAGED_VERSION_ID"
          echo 'PRODUCTION_D1_WRITE=0'
          echo 'CRM_WRITE=0'
          echo 'LINE_SEND=0'
