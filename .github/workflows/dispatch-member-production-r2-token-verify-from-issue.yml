name: Dispatch Member Production R2 token verify from release-gate issue

run-name: 'Production read-only bridge: r2-token-verify'

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: member-production-r2-token-verify-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate exact Member R2 token verify command and dispatch
    if: >-
      github.event.issue.number == 26 &&
      github.event.issue.pull_request == null &&
      github.actor == 'ohw3rz5578d277e-collab' &&
      github.event.comment.user.login == 'ohw3rz5578d277e-collab' &&
      startsWith(github.event.comment.body, '/member-production-r2-token-verify ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact Owner command and current main
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          command_re='^/member-production-r2-token-verify sha=([0-9a-f]{40})$'
          [[ "$COMMAND_BODY" =~ $command_re ]] || { echo '::error::INVALID_MEMBER_R2_TOKEN_VERIFY_COMMAND'; exit 1; }
          expected_sha="${BASH_REMATCH[1]}"

          current_sha="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
          )"
          test "$current_sha" = "$expected_sha" || { echo "::error::MAIN_DRIFT expected=$expected_sha current=$current_sha"; exit 1; }

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "MEMBER_R2_TOKEN_VERIFY_AUTHORIZED_SHA=$expected_sha"
          echo 'R2_INVENTORY=0'
          echo 'R2_BUCKET_METADATA_LIST_GET=0'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_WRITE=0'
          echo 'BUCKET_MUTATION=0'
          echo 'PRODUCTION_STORAGE_BINDING_CHANGE=0'
          echo 'PRODUCTION_STORAGE_FETCH=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_D1_WRITE=0'

      - name: Dispatch exact read-only Member R2 token verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              'ref':'main',
              'inputs':{
                  'expected_sha':os.environ['EXPECTED_SHA']
              }
          }))
          PY
          )"
          code="$(
            curl --silent --show-error \
              --output /tmp/member-r2-token-verify-dispatch.txt \
              --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/member-production-r2-token-verify.yml/dispatches" \
              -d "$payload"
          )"
          test "$code" = '204' || {
            cat /tmp/member-r2-token-verify-dispatch.txt >&2 || true
            echo "::error::MEMBER_R2_TOKEN_VERIFY_DISPATCH_FAILED_HTTP_$code"
            exit 1
          }
          rm -f /tmp/member-r2-token-verify-dispatch.txt
          echo "MEMBER_R2_TOKEN_VERIFY_DISPATCHED_SHA=$EXPECTED_SHA"
          echo 'R2_INVENTORY=0'
          echo 'R2_BUCKET_METADATA_LIST_GET=0'
          echo 'R2_OBJECT_READ=0'
          echo 'R2_WRITE=0'
          echo 'BUCKET_MUTATION=0'
          echo 'PRODUCTION_STORAGE_BINDING_CHANGE=0'
          echo 'PRODUCTION_STORAGE_FETCH=0'
          echo 'PRODUCTION_DEPLOY=0'
          echo 'PRODUCTION_TRAFFIC_CHANGE=0'
          echo 'PRODUCTION_D1_WRITE=0'
