name: Diagnose Cloudflare Access Service Auth Temp

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-cloudflare-access-temp.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      HOSTNAME: customer-crm-api.ohw3rz5578d277e.workers.dev
    steps:
      - name: Locate Access account read-only
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "${!v:-}" ]; then echo "$v=MISSING"; exit 1; fi
            echo "::add-mask::${!v}"
          done
          node <<'NODE'
          const apiToken=process.env.CLOUDFLARE_API_TOKEN;
          const configuredAccount=process.env.CLOUDFLARE_ACCOUNT_ID;
          const expectedClient=process.env.CF_ACCESS_CLIENT_ID;
          const expectedSecret=process.env.CF_ACCESS_CLIENT_SECRET;
          const hostname=process.env.HOSTNAME;
          const headers={Authorization:`Bearer ${apiToken}`,'Content-Type':'application/json'};
          async function get(url){const r=await fetch(url,{headers});let j=null;try{j=await r.json()}catch{};return {status:r.status,json:j};}
          const accounts=await get('https://api.cloudflare.com/client/v4/accounts?per_page=50');
          if(!(accounts.status===200&&accounts.json?.success)){console.log('accounts_api_failed='+accounts.status);process.exit(2);}
          const rows=[];
          for(const a of accounts.json.result||[]){
            const apps=await get(`https://api.cloudflare.com/client/v4/accounts/${a.id}/access/apps?per_page=100`);
            const sts=await get(`https://api.cloudflare.com/client/v4/accounts/${a.id}/access/service_tokens?per_page=100`);
            const appList=apps.status===200&&apps.json?.success?(apps.json.result||[]):[];
            const tokenList=sts.status===200&&sts.json?.success?(sts.json.result||[]):[];
            const app=appList.find(x=>x.domain===hostname || (Array.isArray(x.self_hosted_domains)&&x.self_hosted_domains.includes(hostname)) || x.name==='customer-crm-api')||null;
            const byClient=tokenList.find(x=>x.client_id===expectedClient)||null;
            const byName=tokenList.find(x=>x.name==='customer-crm-production-browser-smoke')||null;
            rows.push({accountName:a.name,configured:a.id===configuredAccount,appsApi:apps.status,serviceTokensApi:sts.status,appFound:!!app,tokenClientFound:!!byClient,tokenNameFound:!!byName,tokenClientMatchesNamed:!!byName&&byName.client_id===expectedClient});
            if(app){
              const pol=await get(`https://api.cloudflare.com/client/v4/accounts/${a.id}/access/apps/${app.id}/policies?per_page=100`);
              const plist=pol.status===200&&pol.json?.success?(pol.json.result||[]):[];
              const targetToken=byClient||byName;
              const summaries=plist.map(p=>({name:p.name,decision:p.decision,serviceTokenRule:Array.isArray(p.include)&&p.include.some(r=>!!r?.service_token),matchesNamedToken:!!targetToken&&Array.isArray(p.include)&&p.include.some(r=>r?.service_token?.token_id===targetToken.id)}));
              console.log('FOUND_APP account='+a.name+' policy_summaries='+JSON.stringify(summaries));
            }
          }
          console.log('ACCOUNT_SCAN='+JSON.stringify(rows));
          try{
            const r=await fetch(`https://${hostname}/api/crm-health-check`,{headers:{'CF-Access-Client-Id':expectedClient,'CF-Access-Client-Secret':expectedSecret,'x-admin-token':'invalid-readonly-diagnostic'}});
            console.log('DIRECT_ACCESS_LOGIN='+(/cloudflareaccess\.com/i.test(r.url)?'YES':'NO'));
          }catch{console.log('DIRECT_ACCESS_LOGIN=NETWORK_ERROR');}
          NODE
