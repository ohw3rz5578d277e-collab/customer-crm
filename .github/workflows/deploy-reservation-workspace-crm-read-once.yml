name: Deploy reservation workspace CRM read once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-reservation-workspace-crm-read-once.yml'

permissions:
  contents: read

concurrency:
  group: customer-crm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify strict read-only customer detail
        run: |
          set -euo pipefail
          node tests/crm-internal-customer-detail.mjs
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('src/crm-internal-customer-detail.mjs','utf8');
          const forbidden = ['INSERT INTO','UPDATE customers','DELETE FROM','CREATE TABLE','ALTER TABLE','DROP TABLE'];
          for (const token of forbidden) if (source.includes(token)) throw new Error(`Forbidden write/DDL token: ${token}`);
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if (config.name !== 'customer-crm-api') throw new Error('Unexpected Worker name');
          if (config.main !== 'src/production-index-crm-browser-root-entry.js') throw new Error('Unexpected production entry');
          console.log('CRM_READ_ONLY_GUARD=PASS');
          NODE

      - name: Confirm Cloudflare authentication
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: whoami

      - name: Deploy customer-crm code only
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Record deploy output
        env:
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_OUTPUT"
          printf 'DEPLOYMENT_URL=%s\n' "$DEPLOY_URL"
          echo 'CRM_CODE_ONLY_DEPLOY=PASS'
