name: Reservation CRM popup Production smoke once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reservation-crm-popup-prod-smoke-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only Production health and auth smoke
        shell: bash
        run: |
          set -euo pipefail
          RESERVATION_BASE='https://reservation-app-api.ohw3rz5578d277e.workers.dev'
          CRM_BASE='https://customer-crm-api.ohw3rz5578d277e.workers.dev'
          PROBE_ID='__reservation_workspace_crm_probe__'

          curl --fail --silent --show-error "$RESERVATION_BASE/health" -o /tmp/reservation-health.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/reservation-health.json','utf8'));
          const required={
            ok:true,
            reservation_workspace_crm_popup:true,
            reservation_workspace_crm_read_only:true,
            reservation_workspace_crm_lookup_key:'customer_id',
            reservation_workspace_crm_fallback:false,
            reservation_workspace_crm_admin_auth:true,
            reservation_workspace_crm_admin_token_configured:true,
            reservation_workspace_crm_service_binding:true,
            reservation_workspace_crm_internal_token:true,
            reservation_workspace_crm_write:false,
            reservation_workspace_crm_db_change:false,
            reservation_workspace_crm_migration:false,
            reservation_workspace_reservation_write:false,
            reservation_workspace_line_send:false
          };
          for(const [k,v] of Object.entries(required)) if(j[k]!==v) throw new Error(`${k}: expected ${JSON.stringify(v)} actual ${JSON.stringify(j[k])}`);
          console.log('RESERVATION_PRODUCTION_HEALTH=PASS');
          NODE

          curl --fail --silent --show-error "$CRM_BASE/health" -o /tmp/crm-health.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/crm-health.json','utf8'));
          const required={
            internal_customer_detail_enabled:true,
            internal_customer_detail_read_only:true,
            internal_customer_detail_lookup_key:'customer_id',
            internal_customer_detail_fallback:false,
            internal_customer_detail_token_configured:true
          };
          for(const [k,v] of Object.entries(required)) if(j[k]!==v) throw new Error(`${k}: expected ${JSON.stringify(v)} actual ${JSON.stringify(j[k])}`);
          console.log('CRM_PRODUCTION_HEALTH=PASS');
          NODE

          status=$(curl --silent --show-error -o /tmp/reservation-probe.json -w '%{http_code}' "$RESERVATION_BASE/api/reservation-workspace/customer?customer_id=$PROBE_ID")
          test "$status" = '401'
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/reservation-probe.json','utf8'));
          if(j.code!=='admin_auth_required') throw new Error(`reservation unauth code=${j.code}`);
          console.log('RESERVATION_UNAUTH_FAIL_CLOSED=PASS');
          NODE

          status=$(curl --silent --show-error -o /tmp/crm-probe.json -w '%{http_code}' "$CRM_BASE/api/internal/customer-detail?customer_id=$PROBE_ID")
          test "$status" = '401'
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/crm-probe.json','utf8'));
          if(j.ok!==false) throw new Error('CRM unauth response unexpectedly ok');
          console.log('CRM_UNAUTH_FAIL_CLOSED=PASS');
          NODE

          echo 'PRODUCTION_READ_ONLY_SMOKE=PASS'
