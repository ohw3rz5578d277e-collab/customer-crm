name: Customer360 canonical health URL patch helper

on:
  push:
    branches:
      - fix/customer360-canonical-production-health-url-20260903
    paths:
      - '.github/workflows/customer360-health-url-patch-helper.yml'
      - 'scripts/patch-customer360-canonical-health-url.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'ohw3rz5578d277e-collab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/customer360-canonical-production-health-url-20260903
          persist-credentials: true
          fetch-depth: 0

      - name: Patch only canonical Production health verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-customer360-canonical-health-url.py
          git diff --check
          git diff -- .github/workflows/deploy-cloudflare.yml
          test -n "$(git diff -- .github/workflows/deploy-cloudflare.yml)"

      - name: Stage exact patched workflow blob outside workflow path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          cp .github/workflows/deploy-cloudflare.yml tmp/customer360-patched-deploy-cloudflare.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/customer360-patched-deploy-cloudflare.yml
          git commit -m 'chore(release): stage exact patched deploy workflow blob'
          git push origin HEAD:fix/customer360-canonical-production-health-url-20260903
