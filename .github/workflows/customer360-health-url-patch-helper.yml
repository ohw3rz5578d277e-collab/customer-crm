name: Customer360 canonical health URL patch helper

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/customer360-canonical-production-health-url-20260903'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Patch only canonical Production health verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/deploy-cloudflare.yml')
          text=path.read_text()
          marker='      - name: Verify deployed Worker safety (READ ONLY HTTP)\n'
          canonical='https://customer-crm-api.ohw3rz5578d277e.workers.dev'
          if marker not in text:
              raise SystemExit('health verifier marker missing')
          if f'PRODUCTION_BASE_URL: {canonical}' in text:
              print('canonical health verifier already patched')
              raise SystemExit(0)
          expr='$'+'{{'
          block='''      - name: Verify deployed Worker safety (READ ONLY HTTP)
        if: @@ inputs.mode == 'deploy' }}
        shell: bash
        env:
          PRODUCTION_BASE_URL: https://customer-crm-api.ohw3rz5578d277e.workers.dev
          DEPLOYMENT_REFERENCE_URL: @@ steps.deploy_worker.outputs.deployment-url }}
          CF_ACCESS_CLIENT_ID: @@ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: @@ secrets.CF_ACCESS_CLIENT_SECRET }}
          ADMIN_TOKEN: @@ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          for v in PRODUCTION_BASE_URL CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET ADMIN_TOKEN; do
            test -n "${!v}" || { echo "::error::$v missing"; exit 1; }
          done
          curl --fail --silent --show-error --max-time 15 \\
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \\
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \\
            -H "x-admin-token: $ADMIN_TOKEN" \\
            -H 'Accept: application/json' \\
            "$PRODUCTION_BASE_URL/health" >/tmp/customer-crm-health.json
          test -s /tmp/customer-crm-health.json
          node <<'NODE'
          const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/customer-crm-health.json','utf8'));
          for(const k of [
            'customer360_family_marketing_foundation','customer360_profile_enrichment','customer360_line_profile_extraction',
            'referrer_customer_id_exact_existing_customer_only','customer360_profile_composed_into_detail',
            'customer360_profile_enrichment_schema_available','customer360_family_metadata_available','customer360_field_evidence_available','customer360_notes_history_available'
          ])if(h[k]!==true)throw new Error('HEALTH_MARKER:'+k);
          if(h.customer_id_generation!==false)throw new Error('CUSTOMER_ID_GENERATION_NOT_FALSE');
          if(h.customer_line_auto_apply!==false||h.line_profile_auto_apply!==false)throw new Error('AUTO_APPLY_NOT_FALSE');
          if(h.customer_line_extraction_mode!=='candidate-only')throw new Error('CANDIDATE_ONLY_MODE_MISSING');
          if(h.customer360_identity_fallback!==false)throw new Error('IDENTITY_FALLBACK_NOT_FALSE');
          if(h.customer360_paid_ai_provider_active!==false)throw new Error('PAID_AI_PROVIDER_NOT_FALSE');
          if(h.line_event_direction!=='incoming'||h.line_event_receive_status!=='received')throw new Error('LINE_CANONICAL_EVENT_CONTRACT');
          console.log('POST_DEPLOY_HTTP_READ_ONLY=PASS');
          console.log('CUSTOMER360_PROFILE_SCHEMA=PASS');
          console.log('CUSTOMER360_CANDIDATE_ONLY=PASS');
          console.log('CUSTOMER_ID_GENERATION=0');
          console.log('LINE_SEND=0');
          console.log('PAID_AI_ACTIVATION=0');
          NODE
          echo "PRODUCTION_HEALTH_URL=$PRODUCTION_BASE_URL/health"
          if [[ -n "$DEPLOYMENT_REFERENCE_URL" ]]; then echo 'DEPLOYMENT_REFERENCE_PRESENT=YES'; fi
'''.replace('@@',expr)
          path.write_text(text[:text.index(marker)]+block)
          PY
          git diff --check
          git diff -- .github/workflows/deploy-cloudflare.yml

      - name: Commit patch to PR branch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/deploy-cloudflare.yml; then
            echo 'PATCH_COMMIT=NOT_NEEDED'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-cloudflare.yml
          git commit -m 'fix(release): use canonical Customer360 Production health URL'
          git push origin HEAD:fix/customer360-canonical-production-health-url-20260903
