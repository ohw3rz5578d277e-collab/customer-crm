name: Dispatch CRM Production release from release-gate issue

run-name: >-
  ${{ startsWith(github.event.comment.body, '/crm-production-deploy ') && 'Production mutation bridge: deploy' || startsWith(github.event.comment.body, '/crm-production-preflight ') && 'Production read-only bridge: preflight' || 'Production bridge: ignored' }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: write

jobs:
  dispatch:
    name: Validate release-gate command and dispatch canonical workflow
    if: >-
      github.event.issue.number == 26 &&
      github.event.issue.pull_request == null &&
      github.actor == 'ohw3rz5578d277e-collab' &&
      github.event.comment.user.login == 'ohw3rz5578d277e-collab' &&
      (startsWith(github.event.comment.body, '/crm-production-preflight ') ||
       startsWith(github.event.comment.body, '/crm-production-deploy '))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate exact command and current main
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
          EXPECTED_ACTOR: ohw3rz5578d277e-collab
          EVENT_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "$EVENT_ACTOR" = "$EXPECTED_ACTOR"

          preflight_re='^/crm-production-preflight sha=([0-9a-f]{40})$'
          deploy_re='^/crm-production-deploy confirm_production=true sha=([0-9a-f]{40})$'

          if [[ "$COMMAND_BODY" =~ $preflight_re ]]; then
            release_mode='preflight'
            expected_sha="${BASH_REMATCH[1]}"
          elif [[ "$COMMAND_BODY" =~ $deploy_re ]]; then
            release_mode='deploy'
            expected_sha="${BASH_REMATCH[1]}"
          else
            echo '::error::Invalid production release command format.'
            exit 1
          fi

          current_sha="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
          )"
          if [[ "$current_sha" != "$expected_sha" ]]; then
            echo "::error::MAIN_DRIFT expected=$expected_sha current=$current_sha"
            exit 1
          fi

          echo "release_mode=$release_mode" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo 'RELEASE_GATE_ISSUE=26'
          echo "RELEASE_MODE=$release_mode"
          echo "CURRENT_MAIN_SHA=$current_sha"
          echo "AUTHORIZED_SHA=$expected_sha"
          echo 'CANONICAL_WORKFLOW=deploy-cloudflare.yml'
          echo 'CANONICAL_EVENT=workflow_dispatch'
          echo "CANONICAL_MODE=$release_mode"
          if [[ "$release_mode" == 'preflight' ]]; then
            echo 'CONFIRM_PRODUCTION=NOT_REQUIRED_FOR_PREFLIGHT'
          else
            echo 'CONFIRM_PRODUCTION=true'
          fi
          echo 'BRIDGE_PRODUCTION_WRITE=0'

      - name: Reject deploy instead of queueing behind another Production mutation
        if: ${{ steps.gate.outputs.release_mode == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sleep 2
          workflows=(
            dispatch-production-deploy-from-issue.yml
            dispatch-member-schema-apply-from-issue.yml
            dispatch-member-lifecycle-schema-apply-from-issue.yml
            dispatch-member-production-runtime-secret-stage-from-issue.yml
            dispatch-member-production-version-promotion-from-issue.yml
            deploy-cloudflare.yml
            member-production-schema-apply.yml
            member-lifecycle-schema-apply.yml
            member-production-runtime-secret-stage.yml
          )
          statuses=(queued in_progress waiting pending requested)
          for workflow in "${workflows[@]}"; do
            for status in "${statuses[@]}"; do
              conflicts="$(
                curl --fail --silent --show-error \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$workflow/runs?status=$status&per_page=100" \
                | WORKFLOW="$workflow" THIS_RUN_ID="$THIS_RUN_ID" python3 -c 'import json,os,sys; w=os.environ["WORKFLOW"]; me=int(os.environ["THIS_RUN_ID"]); runs=json.load(sys.stdin).get("workflow_runs",[]); print(sum(1 for r in runs if int(r.get("id",0))!=me and ((w=="deploy-cloudflare.yml" and r.get("event")=="workflow_dispatch" and not str(r.get("display_title","")).startswith("CRM Production preflight ")) or (w in {"member-production-schema-apply.yml","member-lifecycle-schema-apply.yml","member-production-runtime-secret-stage.yml"} and r.get("event")=="workflow_dispatch") or (w.startswith("dispatch-") and (str(r.get("display_title","")).startswith("Production mutation bridge:") or (not str(r.get("display_title","")).startswith("Production read-only bridge:") and str(r.get("display_title",""))!="Production bridge: ignored" and r.get("event")=="issue_comment"))))))'
              )"
              test "$conflicts" = '0' || {
                echo "::error::PRODUCTION_MUTATION_BUSY_RETRY_REQUIRED workflow=$workflow status=$status count=$conflicts"
                exit 1
              }
            done
          done
          echo 'PRODUCTION_MUTATION_DISPATCH_GATE=FREE'
          echo 'PRODUCTION_MUTATION_QUEUE_POLICY=REJECT_AND_RETRY'
          echo 'PRODUCTION_MUTATION_FILTER=ACTUAL_MUTATIONS_ONLY'

      - name: Dispatch existing canonical Production workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          RELEASE_MODE: ${{ steps.gate.outputs.release_mode }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'ref':'main','inputs':{'mode':os.environ['RELEASE_MODE'],'expected_sha':os.environ['EXPECTED_SHA']}}))
          PY
          )"
          response_code="$(
            curl --silent --show-error \
              --output /tmp/dispatch-response.txt \
              --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloudflare.yml/dispatches" \
              -d "$payload"
          )"
          if [[ "$response_code" != '204' ]]; then
            cat /tmp/dispatch-response.txt >&2 || true
            echo "::error::Workflow dispatch failed with HTTP $response_code"
            exit 1
          fi
          echo 'CANONICAL_WORKFLOW=deploy-cloudflare.yml'
          echo 'CANONICAL_EVENT=workflow_dispatch'
          echo "CANONICAL_MODE=$RELEASE_MODE"
          echo "DISPATCH_REQUESTED_FOR_SHA=$EXPECTED_SHA"
          echo 'BRIDGE_PRODUCTION_WRITE=0'
